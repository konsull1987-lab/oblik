<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Облік інструменту</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#16181d; --muted:#6b7280; --line:#e5e7eb;
  --accent:#0f766e; --accent-ink:#fff;
  --own:#1d4ed8; --own-bg:#dbeafe; --wrk:#c2410c; --wrk-bg:#ffedd5;
  --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --card:#191c22; --text:#eef0f3; --muted:#9aa1ad; --line:#2a2f38;
    --accent:#14b8a6; --accent-ink:#04201d;
    --own:#93c5fd; --own-bg:#1e2b4a; --wrk:#fdba74; --wrk-bg:#43260f;
    --warn:#fcd34d; --warn-bg:#3d2f0b; --bad:#fca5a5; --bad-bg:#451a1a; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 8px}
h1{font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h1 .sub{font-size:12px;font-weight:500;color:var(--muted);margin-left:auto}
main{padding:0 14px calc(90px + env(safe-area-inset-bottom))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.stat{background:var(--card);border-radius:10px;padding:6px 8px;text-align:center;cursor:pointer;border:2px solid transparent}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--muted)}
.stat.on{border-color:var(--accent)}
.stat.own b{color:var(--own)} .stat.wrk b{color:var(--wrk)} .stat.rep b{color:var(--warn)}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:60px;resize:vertical}
.search{display:flex;gap:6px}
.filters{display:flex;gap:6px;margin-top:6px}
.filters select{padding:7px 8px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.chip.x::after{content:" ✕"}
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.card{background:var(--card);border-radius:var(--radius);padding:11px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.card .main{flex:1;min-width:0}
.card .t{font-weight:600}
.card .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.tag.own{background:var(--own-bg);color:var(--own)}
.tag.wrk{background:var(--wrk-bg);color:var(--wrk)}
.tag.site{background:var(--bg);color:var(--text);font-weight:500}
.tag.rep{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.stripe{width:5px;align-self:stretch;border-radius:4px;background:var(--line)}
.stripe.own{background:var(--own)} .stripe.wrk{background:var(--wrk)}
.cb{width:22px;height:22px;margin-top:2px;accent-color:var(--accent)}
.inv{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:9px 0 8px;font:inherit;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.bulkbar{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:7;background:var(--text);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.bulkbar .sp{flex:1}
.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:inherit;border:1px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:18px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .btn{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:6px 0 10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.hist{font-size:13px;border-top:1px solid var(--line);padding:8px 0}
.hist .when{color:var(--muted);font-size:12px}
.section-t{font-size:13px;color:var(--muted);font-weight:600;margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.03em}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:8px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
#segM button{font-size:12.5px;padding:8px 2px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font:inherit;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:30;font-size:14px}
.in{color:#15803d}.out{color:var(--bad)}
@media (prefers-color-scheme: dark){.in{color:#4ade80}}
.acc{color:#7c3aed}.tag.acc{background:#ede9fe;color:#6d28d9}
@media (prefers-color-scheme: dark){.acc{color:#c4b5fd}.tag.acc{background:#2e1f5e;color:#c4b5fd}}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.bal .stat b{font-size:15px}
.sum{display:flex;gap:10px;font-size:13px;margin:8px 2px;flex-wrap:wrap}
.sum b{font-variant-numeric:tabular-nums}
.tabs2{display:flex;gap:6px;margin-bottom:8px}
.tabs2{overflow-x:auto}.tabs2 button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px;font:inherit;font-size:13px;color:var(--muted)}
.tabs2 button.on{border-color:var(--accent);color:var(--text);font-weight:600}
.daysep{font-size:12px;color:var(--muted);font-weight:600;margin:10px 2px 4px}
.count{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
#printArea{display:none}
body.duo .bal .stat{border-color:#f59e0b}
@media print{
  @page{size:A4;margin:14mm 16mm}
  body{background:#fff!important;color:#000!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .doc{font:10.5pt/1.35 Arial,Helvetica,sans-serif;color:#000}
  .doc h3{text-align:center;font-size:12pt;margin:18px 0 12px}
  .doc table{width:100%;border-collapse:collapse}
  .doc .hdr td{vertical-align:top;padding:3px 6px}.doc .hdr .lbl{width:120px;font-weight:bold}
  .doc .items th{background:#ccc;border:1px solid #000;padding:2px 4px;font-size:9.5pt}
  .doc .items td{border:1px solid #000;padding:2px 4px}
  .doc .items .tot td{border:none}.doc .items .tot td.box{border:1px solid #000}
  .doc .r{text-align:right}.doc .b{font-weight:bold}
  .doc .two td{width:50%;vertical-align:top;padding:4px 8px 4px 0}
  .doc .acti td{padding:3px 0}.doc .acti .sm{font-size:8.5pt;text-align:center}
  .doc .line{display:inline-block;width:170px;border-bottom:1px solid #000;height:14px}
  .doc .sign{text-align:right;margin-top:30px}
  .doc.ct{font-size:10pt;text-align:justify}.doc.ct p{margin:3px 0}.doc.ct h4{text-align:center;font-size:10pt;margin:10px 0 4px}
  .doc .req{page-break-inside:avoid;break-inside:avoid}.doc.ct h4{break-after:avoid}.doc .req td{font-size:9.5pt;text-align:left}.doc .pb{page-break-before:always}
}
</style>
</head>
<body>
<header>
  <h1>🧰 Облік інструменту <span class="sub" id="who"></span><button id="menuBtn" class="btn ghost sm" style="padding:4px 10px">⋯</button></h1>
  <div id="banner"></div>
  <div id="headTools"></div>
</header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Додати">+</button>
<div id="bulk"></div>
<nav id="nav">
  <button data-tab="money" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19M7 15h3"/></svg>Гроші</button>
  <button data-tab="sites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-6h6v6"/></svg>Об'єкти</button>
  <button data-tab="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Інструмент</button>
  <button data-tab="people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3 0 4 1.5 4.6 4"/></svg>Люди</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Історія</button>
</nav>
<div id="modal"></div>
<div id="login" style="display:none;position:fixed;inset:0;z-index:50;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center">
  <div style="font-size:54px">🧰</div><h2 style="margin:0">Облік інструменту</h2>
  <div id="loginMsg" style="color:var(--muted);max-width:320px">Увійдіть своїм Google-акаунтом</div>
  <button class="btn" id="loginBtn" style="min-width:220px">Увійти через Google</button>
  <div style="color:var(--muted);font-size:12.5px;max-width:320px">Якщо посилання відкрилось у Telegram, Viber чи іншому месенджері — натисніть ⋯ і виберіть «Відкрити в Safari / Chrome», там вхід через Google працює.</div>
  <button class="btn ghost" id="logoutBtn2" style="display:none">Вийти й увійти іншим акаунтом</button>
</div>

<script>
window.fbReady=new Promise(r=>window.__fbResolve=r);
// ---------- Категорії ----------
const CATS = {
  "Електроінструмент": [
    "Шуруповерти акумуляторні","Дрилі мережеві","Перфоратори","Відбійні молотки","Болгарки (КШМ)",
    "Штроборізи","Пили дискові (циркулярні)","Пили торцювальні","Лобзики","Шабельні пили","Ланцюгові пили",
    "Фрезери","Рубанки","Шліфмашини (ексцентрикові, стрічкові)","Шліфмашини по бетону / жирафи",
    "Міксери будівельні","Гайковерти / імпакти","Реноватори (МФІ)","Фени будівельні",
    "Плиткорізи електричні","Алмазне свердління","Вібратори для бетону","Пилососи будівельні",
    "Акумулятори та зарядки"
  ],
  "Обладнання": [
    "Генератори","Компресори","Зварювальні апарати","Бетонозмішувачі","Віброплити / трамбовки",
    "Мийки високого тиску","Обігрівачі / теплові гармати","Фарбопульти / агрегати","Подовжувачі та кабелі",
    "Прожектори","Драбини та стрем'янки","Риштування / вишки"
  ],
  "Вимірювальний": [
    "Лазерні рівні / нівеліри","Рівні звичайні","Правила","Лазерні далекоміри","Рулетки",
    "Кутники","Детектори проводки / металу","Мультиметри та тестери","Вологоміри","Тепловізори"
  ],
  "Ручний інструмент": [
    "Молотки та кувалди","Ножівки","Ножиці по металу","Кельми та терки","Шпателі","Плиткорізи ручні",
    "Викрутки","Ключі та головки","Плоскогубці / кусачки","Ломи та монтажки","Струбцини",
    "Степлери","Пістолети для піни / герметику","Ножі","Лопати / граблі","Тачки","Інше ручне"
  ],
  "Інше": ["Інше"]
};
const CAT_GROUP = {}; for (const g in CATS) for (const c of CATS[g]) CAT_GROUP[c]=g;
const STATUS = {ok:"Справний", repair:"У ремонті", broken:"Зламаний", lost:"Втрачений"};

// ---------- Стан ----------
const S = {
  tools:new Map(), people:new Map(), sites:new Map(), moves:[], fin:new Map(), fops:new Map(), clients:new Map(), docs:new Map(), contracts:new Map(),
  mtab:"journal", mSite:"", mOwner:"", mKind:"", mMonth:"", mType:"",
  tab:"money", q:"", holderType:"all", cat:"", site:"", person:"", status:"",
  select:false, selected:new Set(), loaded:{tools:false,people:false,sites:false,moves:false,fin:false,fops:false,clients:false,docs:false,contracts:false},
  canWrite:true, db:null, user:null, uid:null, offline:false,
  base:(()=>{try{return localStorage.getItem("oblikBase")==="duo"?"duo":"trio"}catch(_){return "trio"}})(),
  B:{trio:{fin:new Map(),sites:new Map()},duo:{fin:new Map(),sites:new Map()}}, duoOk:false, duoLoaded:false
};
// ---- Дві бази: «на трьох» (fin, sites) і «общак на двох» (duo_fin, duo_sites) ----
const DUO_OWNERS=["andriy","serhiy"];
const isDuo=()=>S.base==="duo"&&S.duoOk;
function applyBase(){ const k=isDuo()?"duo":"trio"; S.fin=S.B[k].fin; S.sites=S.B[k].sites; }
const R=c=>isDuo()&&(c==="fin"||c==="sites"||c==="del")?"duo_"+c:c;
const routed=db=>({collection:p=>db.collection(R(p)),doc:p=>{const i=p.indexOf("/");return db.doc(R(p.slice(0,i))+p.slice(i))}});
function setBase(b){ S.base=b; try{localStorage.setItem("oblikBase",b)}catch(_){}; applyBase(); Object.assign(S,{mSite:"",mOwner:"",mKind:"",mMonth:"",mType:"",sq:""});
  if(isDuo()&&S.tab==="tools") S.tab="money"; if(isDuo()&&S.mtab==="docs") S.mtab="journal"; render(); }
function baseSwitch(){ if(!S.duoOk) return ""; return `<div class="seg" style="margin-bottom:8px">${[["trio","👥 На трьох"],["duo","🤝 Общак на двох"]].map(([k,l])=>`<button type="button" data-base="${k}" class="${(isDuo()?"duo":"trio")===k?"on":""}">${l}</button>`).join("")}</div>`; }
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byName = (a,b)=>(a.name||"").localeCompare(b.name||"","uk");
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function fmtDate(ms){const d=new Date(ms);return d.toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"})}
function person(id){return S.people.get(id)}
function site(id){return S.sites.get(id)}
function holderTag(id){const p=person(id); if(!p) return `<span class="tag site">— не вказано</span>`; return `<span class="tag ${p.role==="owner"?"own":"wrk"}">${p.role==="owner"?"👤":"🔧"} ${esc(p.name)}</span>`}
function siteTag(id){const s=site(id); if(!s) return ""; return `<span class="tag site">${s.type==="warehouse"?"🏬":"🏗️"} ${esc(s.name)}</span>`}
function statusTag(st){if(!st||st==="ok")return""; return `<span class="tag ${st==="repair"?"rep":"bad"}">${STATUS[st]}</span>`}
function roleOf(t){return person(t.holder)?.role||""}

// ---------- Дані ----------
async function init(){
  render();
  let db=null,user=null;
  try{ [db,user]=await window.fbReady }catch(e){}
  S.db=db; S.user=user;
  if(!db){ S.offline=true; render(); return; }
  try{ S.uid=await user?.id?.() }catch(e){}
  try{ const c=await user?.can?.("data.write"); if(c===false) S.canWrite=false }catch(e){}
  try{ const me=await user?.me?.(); if(me?.name) $("#who").textContent=me.name }catch(e){}
  const timer=setTimeout(()=>{ if(!Object.values(S.loaded).every(Boolean)){ S.slow=true; render(); } },10000);
  const sub=(name,q,fn)=>q.onSnapshot(snap=>{fn(snap); if(!snap.metadata.fromCache){S.loaded[name]=true; if(Object.values(S.loaded).every(Boolean)){clearTimeout(timer);S.slow=false}} render();},
    err=>{S.loaded[name]=true; S.err=err?.code||"error"; render();});
  sub("tools",db.collection("tools"),snap=>{S.tools=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]))});
  sub("people",db.collection("people"),snap=>{S.people=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]))});
  sub("sites",db.collection("sites"),snap=>{S.B.trio.sites=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));applyBase()});
  sub("fin",db.collection("fin"),snap=>{S.B.trio.fin=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));applyBase()});
  // доступ до общаку на двох вирішують правила бази: якщо читати можна — показуємо перемикач
  db.doc("duo_meta/info").get().then(()=>{ S.duoOk=true;
    const mk=c=>snap=>{S.B.duo[c]=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));applyBase();render()};
    let n=0; const done=()=>{if(++n===2){S.duoLoaded=true;render()}};
    let f1=0,f2=0;
    db.collection("duo_sites").onSnapshot(s=>{mk("sites")(s);if(!s.metadata.fromCache&&!f1++)done()},()=>{});
    db.collection("duo_fin").onSnapshot(s=>{mk("fin")(s);if(!s.metadata.fromCache&&!f2++)done()},()=>{});
    applyBase(); render();
  }).catch(()=>{ S.duoOk=false; applyBase(); render(); });
  for(const c of ["fops","clients","docs","contracts"]) sub(c,db.collection(c),snap=>{S[c]=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]))});
  try{ db.doc("meta/backup").get().then(x=>{S.backupAt=x.exists?+x.data().at||0:0;S.backupLoaded=true;render()}).catch(()=>{}) }catch(_){}
  sub("moves",db.collection("moves").orderBy("at","desc").limit(500),snap=>{S.moves=snap.docs.map(d=>({id:d.id,...d.data()}))});
}
async function write(fn){
  if(!S.db){toast("Немає з'єднання з базою");return false}
  try{ await fn(routed(S.db)); return true }
  catch(e){
    if(e?.code==="permission-denied"){toast("У вас немає прав на зміни");}

// ---------- Кількість і переміщення частинами ----------
const qtyOf=t=>Math.max(1,+t.qty||1);
const normName=s=>String(s||"").toLowerCase().replace(/[«»"'’ʼ`.,()\-–—/]/g," ").replace(/\s+/g," ").trim();
function lotKey(t){return [normName(t.name),t.cat||"",normName(t.brand),normName(t.model)].join("|")}
const isLot=t=>!t.serial&&(qtyOf(t)>1||!t.inv);
function findLot(t,holder,siteId,exceptId){
  if(!isLot(t)) return null;
  const k=lotKey(t);
  return [...S.tools.values()].find(x=>x.id!==exceptId&&isLot(x)&&(x.status||"ok")==="ok"&&x.holder===holder&&(x.site||"")===(siteId||"")&&lotKey(x)===k)||null;
}
async function moveTool(db,t,qty,holder,siteId,note,byName){
  const all=qtyOf(t); qty=Math.min(Math.max(1,qty|0),all); const now=Date.now();
  const names={}; for(const pid of [t.holder,holder]) if(person(pid)) names[pid]=person(pid).name;
  for(const sid of [t.site,siteId]) if(site(sid)) names[sid]=site(sid).name;
  const lot=findLot(t,holder,siteId,t.id);
  if(qty>=all){
    if(lot){ await db.doc("tools/"+lot.id).update({qty:qtyOf(lot)+qty,updatedAt:now}); await db.doc("tools/"+t.id).delete(); }
    else await db.doc("tools/"+t.id).update({holder,site:siteId||"",updatedAt:now});
  } else {
    await db.doc("tools/"+t.id).update({qty:all-qty,updatedAt:now});
    if(lot) await db.doc("tools/"+lot.id).update({qty:qtyOf(lot)+qty,updatedAt:now});
    else { const c={...t}; delete c.id; Object.assign(c,{qty,holder,site:siteId||"",inv:"",createdAt:now,updatedAt:now}); await db.collection("tools").add(c); }
  }
  await db.collection("moves").add({tool:lot?.id||t.id,toolName:t.name,toolInv:t.inv||"",qty,fromHolder:t.holder||"",toHolder:holder,fromSite:t.site||"",toSite:siteId||"",note:note||"",at:now,by:S.uid||"",byName:byName||"",names});
}

async function shrinkImage(file,max=1280){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url});
    const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return {mime:"image/jpeg",b64:c.toDataURL("image/jpeg",0.85).split(",")[1],thumb:c.toDataURL("image/jpeg",0.4)};
  } finally { URL.revokeObjectURL(url) }
}

function toolScore(rec,t){
  const a=new Set(normName(rec.name).split(" ").filter(w=>w.length>1)), b=new Set(normName(t.name+" "+(t.brand||"")+" "+(t.model||"")).split(" ").filter(w=>w.length>1));
  let s=0; for(const w of a){ if(b.has(w)) s+=2; else for(const x of b){ if(x.length>3&&w.length>3&&(x.startsWith(w.slice(0,4))||w.startsWith(x.slice(0,4)))){s+=1;break} } }
  if(rec.cat&&rec.cat===t.cat) s+=2; if(rec.brand&&normName(rec.brand)===normName(t.brand)) s+=2; return s;
}

      <div class="m" style="color:var(--muted);font-size:13px;margin-bottom:8px">${mode==="add"?"Розкладіть інструмент рядами, щоб не перекривався, і сфотографуйте. Можна кілька фото.":"Сфотографуйте інструмент, який забираєте. Застосунок знайде його в базі й перемістить."}</div>
      <div class="row" style="margin-bottom:8px"><label class="btn" style="flex:1;text-align:center">📷 Камера<input type="file" class="pfFile" accept="image/*" capture="environment" style="display:none"></label><label class="btn ghost" style="flex:1;text-align:center">🖼️ Галерея<input type="file" class="pfFile" accept="image/*" multiple style="display:none"></label></div>
      <div id="pfThumbs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${imgs.map((x,i)=>`<div style="position:relative"><img src="${x.thumb}" style="width:72px;height:72px;object-fit:cover;border-radius:8px"><button type="button" data-rmimg="${i}" style="position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:22px;height:22px;background:var(--text);color:var(--bg)">✕</button></div>`).join("")}</div>
      ${imgs.length?`<button class="btn" id="pfGo" style="width:100%">🔍 Розпізнати (${imgs.length} фото)</button>`:""}
      ${rows.length&&imgs.some(x=>x.old)?`<div class="m" style="color:var(--muted);font-size:13px">Збережений результат попереднього розпізнавання. <a href="#" id="pfDrop">Почати заново</a></div>`:""}
      <div id="pfRes"></div>
      <div class="actions"><button class="btn ghost" data-close>Закрити</button></div>`);
    $("#pfMode").onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.v;rows=[];draw()};
    document.querySelectorAll(".pfFile").forEach(x=>x.onchange=async e=>{imgs=imgs.filter(x=>!x.old);for(const f of e.target.files){try{imgs.push(await shrinkImage(f))}catch(_){}}rows=[];draw()});
    $("#pfThumbs").onclick=e=>{const i=e.target.dataset.rmimg;if(i!=null){imgs.splice(+i,1);rows=[];draw()}};
    $("#pfGo")?.addEventListener("click",recognize);
    $("#pfDrop")?.addEventListener("click",e=>{e.preventDefault();try{localStorage.removeItem("pfDraft")}catch(_){};imgs=[];rows=[];draw()});
    if(rows.length) drawRows();
  };
  async function recognize(){
    if(!window.__fbAI){toast("Розпізнавання недоступне");return}
    if(imgs.some(x=>x.old)){toast("Додайте фото заново");return}
    const b=$("#pfGo"); b.disabled=true; const t0=Date.now(); let tr="";
    const tick=setInterval(()=>{const el=$("#pfGo"); if(el) el.textContent=`⏳ Розпізнаю… ${Math.round((Date.now()-t0)/1000)} с${tr}`},1000);
    try{ if(window.Notification&&Notification.permission==="default") Notification.requestPermission().catch(()=>{}) }catch(_){}
    try{
      const txt=await window.__fbAI(imgs,aiPrompt(),(n,all)=>{tr=n>1?` (спроба ${n}/${all})`:""});
      clearInterval(tick);
      const j=JSON.parse(txt.replace(/^```(json)?|```$/g,"").trim());
      const allCats=Object.values(CATS).flat();
      rows=(j.items||[]).filter(x=>x&&x.name).map(x=>({on:true,name:String(x.name).trim(),cat:allCats.includes(x.cat)?x.cat:"Інше",brand:String(x.brand||"").trim(),model:String(x.model||"").trim(),qty:Math.max(1,parseInt(x.qty)||1),conf:x.confidence||"medium",note:String(x.note||"").trim()}));
      if(!rows.length){toast("На фото інструмент не знайдено");b.disabled=false;b.textContent="🔍 Розпізнати";return}
      if(mode==="move") matchRows();
      saveDraft(); notifyDone(`Розпізнано ${rows.length} поз. — перевірте й збережіть`);
      if($("#pfRes")) drawRows();
    }catch(err){ clearInterval(tick); notifyDone("Не вдалося розпізнати фото");
      const m=String(err?.message||err);
      b.disabled=false; b.textContent="🔍 Розпізнати ще раз";
      $("#pfRes").innerHTML=`<div class="banner">Не вдалося розпізнати. Надішліть скрін цього повідомлення:<br><small style="word-break:break-all">${esc(m.slice(0,400))}</small></div>`;
    }
  }
  function matchRows(fromSite){
    const pool=[...S.tools.values()].filter(t=>!fromSite||t.site===fromSite);
    for(const r of rows){ const best=pool.map(t=>[toolScore(r,t),t]).filter(x=>x[0]>=2).sort((a,b)=>b[0]-a[0]); r.cands=best.slice(0,8).map(x=>x[1].id); r.match=r.cands[0]||""; if(r.match) r.qty=Math.min(r.qty,qtyOf(S.tools.get(r.match))); }
  }
  function drawRows(){
    const confTag=c=>c==="high"?"":`<span class="tag ${c==="low"?"bad":"rep"}">${c==="low"?"перевірте":"можливо"}</span>`;
    const tOpt=(id,sel)=>{const t=S.tools.get(id);return `<option value="${id}" ${sel===id?"selected":""}>${esc(t.name)}${t.inv?" #"+esc(t.inv):""} · ${qtyOf(t)} шт · ${esc(site(t.site)?.name||person(t.holder)?.name||"")}</option>`};
    const sum=rows.filter(r=>r.on).reduce((a,r)=>a+(+r.qty||0),0);
    $("#pfRes").innerHTML=`<div class="section-t" style="display:flex">Розпізнано<span class="count">${rows.filter(r=>r.on).length} поз. · ${sum} шт</span></div>
      ${mode==="move"?`<div class="field"><label>Звідки (щоб точніше знайти)</label><select id="pfFrom">${siteOptions(S.pfFrom||"","— будь-де")}</select></div>`:""}
      ${rows.map((r,i)=>`<div class="card" style="display:block;cursor:default;margin-bottom:6px;${r.on?"":"opacity:.5"}">
        <div class="row" style="align-items:center"><input type="checkbox" class="cb" data-i="${i}" data-k="on" ${r.on?"checked":""} style="flex:0 0 22px"><input data-i="${i}" data-k="name" value="${esc(r.name)}"><input data-i="${i}" data-k="qty" inputmode="numeric" value="${r.qty}" style="flex:0 0 64px;text-align:center"></div>
        <div class="row" style="margin-top:6px"><select data-i="${i}" data-k="cat">${catOptions(r.cat,false)}</select><input data-i="${i}" data-k="brand" value="${esc(r.brand)}" placeholder="марка" style="flex:.7"></div>
        ${mode==="move"?`<div class="field" style="margin:6px 0 0"><select data-i="${i}" data-k="match"><option value="">— не знайдено в базі (пропустити)</option>${(r.cands||[]).map(id=>tOpt(id,r.match)).join("")}</select></div>`:""}
        <div class="m" style="margin-top:4px">${confTag(r.conf)} ${esc(r.note)}</div></div>`).join("")}
      ${mode==="add"?`<div class="row"><div class="field"><label>У кого</label><select id="pfHolder">${personOptions(owners()[0]?.id||"","— не вказано")}</select></div><div class="field"><label>Де</label><select id="pfSite">${siteOptions("","— не вказано")}</select></div></div>`
        :`<div class="row"><div class="field"><label>Кому *</label><select id="pfHolder">${personOptions("","— виберіть")}</select></div><div class="field"><label>Куди</label><select id="pfSite">${siteOptions("","— не вказано")}</select></div></div>`}
      <button class="btn" id="pfSave" style="width:100%">${mode==="add"?"💾 Додати в облік":"🔄 Перемістити"}</button>`;
    $("#pfRes").oninput=e=>{const i=e.target.dataset.i,k=e.target.dataset.k;if(i==null)return;const r=rows[i];
      if(k==="on"){r.on=e.target.checked;drawRows();return} if(k==="qty") r.qty=Math.max(1,parseInt(e.target.value)||1); else r[k]=e.target.value;};
    $("#pfRes").onchange=e=>{if(e.target.id==="pfFrom"){S.pfFrom=e.target.value;matchRows(S.pfFrom);drawRows()} else if(e.target.dataset.k==="match"){const r=rows[e.target.dataset.i];r.match=e.target.value;if(r.match)r.qty=Math.min(r.qty,qtyOf(S.tools.get(r.match)));drawRows()}};
    $("#pfSave").onclick=save;
  }
  async function save(){
    const holder=$("#pfHolder").value, siteId=$("#pfSite").value, sel=rows.filter(r=>r.on&&r.name.trim());
    if(mode==="move"&&!holder){toast("Виберіть, кому передати");return}
    const btn=$("#pfSave"); btn.disabled=true; btn.textContent="Зачекайте…";
    let byName=""; try{byName=(await S.user?.me?.())?.name||""}catch(_){}
    let n=0, skip=0;
    const ok=await write(async db=>{
      for(const r of sel){
        if(mode==="add"){
          const t={name:r.name.trim(),cat:r.cat,brand:r.brand.trim(),model:r.model||"",qty:r.qty,holder:holder||"",site:siteId||"",status:"ok",note:r.note||"",inv:"",serial:""};
          const lot=findLot(t,t.holder,t.site);
          if(lot) await db.doc("tools/"+lot.id).update({qty:qtyOf(lot)+r.qty,updatedAt:Date.now()});
          else { if(r.qty===1&&CAT_GROUP[r.cat]!=="Ручний інструмент") t.inv=nextInv(); t.createdAt=t.updatedAt=Date.now(); await db.collection("tools").add(t); }
          n+=r.qty;
        } else {
          const t=r.match&&S.tools.get(r.match); if(!t){skip++;continue}
          await moveTool(db,t,r.qty,holder,siteId,"з фото",byName); n+=Math.min(r.qty,qtyOf(t));
        }
      }
    });
    if(ok){try{localStorage.removeItem("pfDraft")}catch(_){};closeSheet();toast(mode==="add"?`Додано ${n} шт`:`Переміщено ${n} шт${skip?`, пропущено ${skip} поз.`:""}`)} else {btn.disabled=false;btn.textContent="Спробувати ще раз"}
  }
  draw();
}

function nextInv(){ let m=0; for(const t of S.tools.values()){const n=parseInt(t.inv,10); if(n>m)m=n} return String(m+1).padStart(4,"0"); }

function moveForm(ids){
  const tools=ids.map(i=>S.tools.get(i)).filter(Boolean); if(!tools.length)return;
  const one=tools.length===1?tools[0]:null;
  openSheet(`<h2>Перемістити ${one?"«"+esc(one.name)+"»":tools.length+" од."}</h2>
    ${one?`<p style="margin:0 0 10px;color:var(--muted)">Зараз: ${esc(person(one.holder)?.name||"—")}, ${esc(site(one.site)?.name||"—")}${qtyOf(one)>1?`, ${qtyOf(one)} шт`:""}</p>`:""}
    <form id="mvForm">
      ${one&&qtyOf(one)>1?`<div class="field"><label>Скільки перемістити (з ${qtyOf(one)})</label><input name="qty" inputmode="numeric" value="${qtyOf(one)}"></div>`:""}
      <div class="field"><label>Кому передати *</label><select name="holder" required>${personOptions(one?.holder||"","— виберіть")}</select></div>
      <div class="field"><label>Куди (склад / об'єкт)</label><select name="site">${siteOptions(one?.site||"","— не вказано")}</select></div>
      <div class="field"><label>Коментар</label><input name="note" placeholder="необов'язково"></div>
      <div class="actions"><button type="button" class="btn ghost" data-close>Скасувати</button><button class="btn" type="submit">Перемістити</button></div>
    </form>`);
  $("#mvForm").addEventListener("submit",async e=>{
    e.preventDefault(); const f=Object.fromEntries(new FormData(e.target)); if(!f.holder)return;
    const btn=e.target.querySelector("[type=submit]"); btn.disabled=true; btn.textContent="Зачекайте…";
    let byName=""; try{const me=await S.user?.me?.(); byName=me?.name||""}catch(_){}
    let done=0;
    for(const t of tools){
      if(t.holder===f.holder&&(t.site||"")===(f.site||"")){done++;continue}
      const q=one&&f.qty?Math.max(1,parseInt(f.qty)||1):qtyOf(t);
      const ok=await write(db=>moveTool(db,t,q,f.holder,f.site||"",f.note.trim(),byName));
      if(!ok)break; done++;
    }
    closeSheet(); S.select=false; S.selected.clear(); render();
    toast(done===tools.length?"Переміщено":"Переміщено "+done+" з "+tools.length);
  });
}

      <div class="field"><div class="seg" id="segR"><button type="button" data-v="owner" class="${p.role==="owner"?"on":""}">👤 Власник</button><button type="button" data-v="worker" class="${p.role==="worker"?"on":""}">🔧 Виконавець</button></div></div>
      <div class="field"><label>Ім'я *</label><input name="name" required value="${esc(p.name)}"></div>
      <div class="field"><label>Телефон</label><input name="phone" type="tel" value="${esc(p.phone)}"></div>
      ${S.canWrite?`<div class="actions">${!isNew?`<button type="button" class="btn danger" id="delP">Видалити</button>`:""}<button type="button" class="btn ghost" data-close>Скасувати</button><button class="btn" type="submit">Зберегти</button></div>`:""}
    </form>`);
  let role=p.role;
  $("#segR").onclick=e=>{const b=e.target.closest("button");if(!b)return;role=b.dataset.v;[...$("#segR").children].forEach(x=>x.classList.toggle("on",x===b))};
  $("#showW")?.addEventListener("click",()=>workerSheet(p.id));
  $("#hoP")?.addEventListener("click",()=>handoverSheet("person",p.id));
  $("#showP")?.addEventListener("click",()=>{closeSheet();Object.assign(S,{tab:"tools",person:p.id,site:"",cat:"",holderType:"all",q:""});render()});
  $("#pForm").addEventListener("submit",async e=>{
    e.preventDefault(); const f=Object.fromEntries(new FormData(e.target)); const data={name:f.name.trim(),phone:f.phone.trim(),role};
    if(!data.name)return;
    if(await write(db=>isNew?db.collection("people").add(data):db.doc("people/"+p.id).update(data))){closeSheet();toast("Збережено")}
  });
  $("#delP")?.addEventListener("click",async()=>{
    if(cnt){toast("Спочатку заберіть у нього інструмент ("+cnt+")");return}
    const nf=[...S.fin.values()].filter(f=>f.worker===p.id||f.owner===p.id).length;
    if(nf){toast("На цю людину є "+nf+" фін. записів — видалити не можна");return}
    if(await write(db=>db.doc("people/"+p.id).delete())){closeSheet();toast("Видалено")}
  });
}

// ---------- Гроші ----------
const KINDS=["Матеріали","Зарплата","Інструменти","Доставка","Відкат","Інше"];
const money=n=>(Math.round((n||0)*100)/100).toLocaleString("uk-UA",{maximumFractionDigits:2})+" ₴";
const owners=()=>[...S.people.values()].filter(p=>p.role==="owner"&&(!isDuo()||DUO_OWNERS.includes(p.id))).sort(byName);
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDay=iso=>{if(!iso)return"без дати";const [y,m,d]=iso.split("-");return `${d}.${m}.${y}`};
const MONTHS=["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
function siteTotals(){const t={};for(const f of S.fin.values()){if(!f.site||f.type==="accrual")continue;const x=t[f.site]||(t[f.site]={in:0,out:0,n:0});x[f.type==="in"?"in":"out"]+=+f.amount||0;x.n++}return t}
function balancesFor(fin,sites,ows){
  const b={}; for(const o of ows) b[o.id]=0; const st={};
  for(const f of fin.values()){ if(f.type==="accrual")continue;
    if(f.owner){ if(!(f.owner in b))b[f.owner]=0; b[f.owner]+=(f.type==="in"?1:-1)*(+f.amount||0); }
    if(f.site){ st[f.site]=(st[f.site]||0)+(f.type==="in"?1:-1)*(+f.amount||0) } }
  let shared=0; for(const id in st) if(sites.get(id)?.split) shared+=st[id];
  const n=ows.length||1; for(const k in b) b[k]-=shared/n;
  return {b,shared};
}
function ownerBalances(){ return balancesFor(S.fin,S.sites,owners()) }
function bothBalances(){ if(!S.duoOk||!S.duoLoaded) return null;
  const all=[...S.people.values()].filter(p=>p.role==="owner"), duoO=all.filter(p=>DUO_OWNERS.includes(p.id));
  const t=balancesFor(S.B.trio.fin,S.B.trio.sites,all).b, d=balancesFor(S.B.duo.fin,S.B.duo.sites,duoO).b;
  return duoO.map(o=>({o,trio:t[o.id]||0,duo:d[o.id]||0,sum:(t[o.id]||0)+(d[o.id]||0)})); }
function workerTotals(){const t={};for(const f of S.fin.values()){if(!f.worker)continue;const x=t[f.worker]||(t[f.worker]={acc:0,paid:0,n:0});if(f.type==="accrual")x.acc+=+f.amount||0;else if(f.type==="out")x.paid+=+f.amount||0;x.n++}return t}
function customerRows(){const st=siteTotals();return [...S.sites.values()].filter(x=>(+x.contract||0)>0).map(x=>{const paid=st[x.id]?.in||0;return{s:x,contract:+x.contract,paid,debt:+x.contract-paid}}).sort((a,b)=>b.debt-a.debt)}
function finFiltered(){
  return [...S.fin.values()].filter(f=>{
    if(S.mSite&&f.site!==S.mSite)return false;
    if(S.mOwner&&f.owner!==S.mOwner)return false;
    if(S.mKind&&f.kind!==S.mKind)return false;
    if(S.mType&&f.type!==S.mType)return false;
    if(S.mMonth&&!(f.date||"").startsWith(S.mMonth))return false;
    return true;
  }).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
}
function renderMoney(){
  const {b,shared}=ownerBalances();
  const months=[...new Set([...S.fin.values()].map(f=>(f.date||"").slice(0,7)).filter(Boolean))].sort().reverse();
  const finSites=new Set([...S.fin.values()].map(f=>f.site).filter(Boolean));
  const siteOpts=[...S.sites.values()].filter(x=>finSites.has(x.id)||x.active!==false).sort(byName);
  const both=bothBalances();
  $("#headTools").innerHTML=`${baseSwitch()}
    <div class="bal">${owners().map(o=>`<div class="stat own" data-own="${o.id}" title="Скільки загальних грошей на руках"><b class="${b[o.id]<0?"out":""}">${money(b[o.id])}</b><span>у ${esc(o.name)}</span></div>`).join("")}</div>
    ${both?`<div class="sum" style="font-size:13px;margin-top:-2px">Разом в обох базах: ${both.map(x=>`${esc(x.o.name)} <b class="${x.sum<0?"out":""}">${money(x.sum)}</b>`).join(" · ")} <span style="color:var(--muted)">(на трьох + на двох)</span></div>`:""}
    <div class="tabs2">${[["journal","Журнал"],["sites","Об'єкти"],["workers","Виконавці"],["customers","Замовники"],["stats","📈 Аналітика"],...(isDuo()?[]:[["docs","Рахунки"]])].map(([k,l])=>`<button data-mt="${k}" class="${S.mtab===k?"on":""}">${l}</button>`).join("")}</div>
    ${S.mtab==="journal"?`<div class="filters">
      <select id="mMonth"><option value="">Весь час</option>${months.map(m=>`<option value="${m}" ${S.mMonth===m?"selected":""}>${MONTHS[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join("")}</select>
      <select id="mSite"><option value="">Усі об'єкти</option>${siteOpts.map(x=>`<option value="${x.id}" ${S.mSite===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
    </div><div class="filters">
      <select id="mOwner"><option value="">Усі власники</option>${owners().map(o=>`<option value="${o.id}" ${S.mOwner===o.id?"selected":""}>${esc(o.name)}</option>`).join("")}</select>
      <select id="mType"><option value="">Прихід і витрати</option><option value="in" ${S.mType==="in"?"selected":""}>Тільки прихід</option><option value="out" ${S.mType==="out"?"selected":""}>Тільки витрати</option><option value="accrual" ${S.mType==="accrual"?"selected":""}>Нарахування</option></select>
      <select id="mKind"><option value="">Усі види</option>${[...KINDS,"Взаємозалік"].map(k=>`<option ${S.mKind===k?"selected":""}>${k}</option>`).join("")}</select>
    </div>`:""}`;
  if(S.mtab==="docs") return renderMoneyDocs();
  if(S.mtab==="stats") return renderMoneyStats();
  if(!S.fin.size){$("#view").innerHTML=`<div class="empty">Записів ще немає. Натисніть «+», щоб додати прихід чи витрату.</div>`;return}
  if(S.mtab==="sites") return renderMoneySites(shared);
  if(S.mtab==="workers") return renderMoneyWorkers();
  if(S.mtab==="customers") return renderMoneyCustomers();
  const list=finFiltered();
  let tin=0,tout=0; for(const f of list) if(f.kind!=="Взаємозалік"&&f.type!=="accrual"){ if(f.type==="in")tin+=+f.amount||0; else tout+=+f.amount||0 }
  let h=`<div class="sum">Прихід <b class="in">${money(tin)}</b> · Витрати <b class="out">${money(tout)}</b> · Різниця <b>${money(tin-tout)}</b> <span class="count">${list.length} зап.</span></div>`;
  if(list.some(f=>f.kind==="Взаємозалік")) h+=`<div class="sum" style="margin-top:-4px;color:var(--muted)">взаємозаліки в суму не входять</div>`;
  let day=null;
  for(const f of list.slice(0,400)){
    if(f.date!==day){ if(day!==null)h+=`</div>`; day=f.date; h+=`<div class="daysep">${fmtDay(day)}</div><div class="list">`; }
    const o=person(f.owner), w=person(f.worker);
    h+=`<div class="card" data-fin="${f.id}"><div class="main">
      <div class="t">${f.site?esc(site(f.site)?.name||"—"):(f.kind==="Взаємозалік"?"Взаємозалік":"Без об'єкта")}</div>
      <div class="m">${f.type==="accrual"?`<span class="tag acc">нараховано</span>`:esc(o?.name||"—")}${f.kind&&f.kind!=="Взаємозалік"?" · "+esc(f.kind):""}${w?" · 🔧 "+esc(w.name):""}${f.note?" · "+esc(f.note):""}</div></div>
      <span class="amt ${f.type==="in"?"in":f.type==="accrual"?"acc":"out"}">${f.type==="in"?"+":f.type==="accrual"?"":"−"}${money(f.amount)}</span></div>`;
  }
  if(day!==null)h+=`</div>`;
  if(list.length>400)h+=`<div class="empty">Показано 400 останніх — звузьте фільтр</div>`;
  $("#view").innerHTML=h;
}
function renderMoneySites(shared){
  const st=siteTotals();
  const rows=Object.entries(st).map(([id,t])=>({id,...t,s:site(id)})).filter(r=>r.s).sort((a,b)=>(b.s.active!==false)-(a.s.active!==false)||(b.s.order||0)-(a.s.order||0));
  let h=`<div class="sum" style="color:var(--muted)">Поділено між власниками: <b>${money(shared)}</b></div><div class="list">`;
  for(const r of rows){ const p=r.in-r.out;
    h+=`<div class="card" data-msite="${r.id}"><div class="main"><div class="t">${esc(r.s.name)} ${r.s.split?`<span class="tag site">✓ поділено</span>`:""}</div>
      <div class="m">прихід <span class="in">${money(r.in)}</span> · витрати <span class="out">${money(r.out)}</span>${(+r.s.contract||0)>0?` · замовник винен <b>${money(+r.s.contract-r.in)}</b>`:""}</div></div>
      <span class="amt ${p<0?"out":""}">${money(p)}</span></div>`;
  }
  $("#view").innerHTML=h+`</div>`;
}
function renderMoneyWorkers(){
  const t=workerTotals();
  const rows=Object.entries(t).map(([id,x])=>({id,...x,p:person(id)})).filter(r=>r.p).sort((a,b)=>(b.acc-b.paid)-(a.acc-a.paid));
  let h=`<div class="sum" style="color:var(--muted)">Нарахування — домовлена сума за роботу. Виплата — зарплата з вибраним виконавцем. Різниця — борг.</div>`;
  if(!rows.length){$("#view").innerHTML=h+`<div class="empty">Поки немає записів з виконавцями.<br>Натисніть «+» → «Нарахування», або вкажіть виконавця при записі зарплати.</div>`;return}
  let owe=0; for(const r of rows) if(r.acc-r.paid>0) owe+=r.acc-r.paid;
  h+=`<div class="sum">Разом винні виконавцям: <b class="out">${money(owe)}</b></div><div class="list">`;
  for(const r of rows){const d=r.acc-r.paid;
    h+=`<div class="card" data-mworker="${r.id}"><div class="stripe wrk"></div><div class="main"><div class="t">${esc(r.p.name)}</div>
      <div class="m">нараховано ${money(r.acc)} · виплачено ${money(r.paid)}</div></div>
      <span class="amt ${d>0?"out":d<0?"acc":""}">${d>0?"винні "+money(d):d<0?"аванс "+money(-d):"0 ₴"}</span></div>`}
  $("#view").innerHTML=h+`</div>`;
}
function renderMoneyCustomers(){
  const rows=customerRows();
  let h=`<div class="sum" style="color:var(--muted)">Сума договору вказується в картці об'єкта. Борг = договір − отримано.</div>`;
  if(!rows.length){$("#view").innerHTML=h+`<div class="empty">Відкрийте об'єкт (вкладка «Об'єкти») і вкажіть замовника та суму договору.</div>`;return}
  const tot=rows.reduce((a,r)=>a+Math.max(0,r.debt),0);
  h+=`<div class="sum">Разом замовники винні: <b class="in">${money(tot)}</b></div><div class="list">`;
  for(const r of rows) h+=`<div class="card" data-site="${r.s.id}"><div class="main"><div class="t">${esc(r.s.name)}</div>
    <div class="m">${r.s.customer?"👤 "+esc(r.s.customer)+" · ":""}договір ${money(r.contract)} · отримано ${money(r.paid)}</div></div>
    <span class="amt ${r.debt>0?"in":""}">${r.debt>0?money(r.debt):r.debt<0?"переплата "+money(-r.debt):"оплачено"}</span></div>`;
  $("#view").innerHTML=h+`</div>`;
}
function workerSheet(id){
  const p=person(id); if(!p)return; const x=workerTotals()[id]||{acc:0,paid:0}; const d=x.acc-x.paid;
  const list=[...S.fin.values()].filter(f=>f.worker===id).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
  openSheet(`<h2>🔧 ${esc(p.name)}</h2>
    <div class="sum">Нараховано <b>${money(x.acc)}</b> · Виплачено <b>${money(x.paid)}</b></div>
    <div class="sum" style="font-size:16px">${d>0?`Винні йому: <b class="out">${money(d)}</b>`:d<0?`Аванс (переплата): <b class="acc">${money(-d)}</b>`:"Розраховані повністю"}</div>
    ${S.canWrite?`<div class="actions" style="margin-top:4px"><button class="btn ghost" id="wAcc">+ Нарахувати</button><button class="btn" id="wPay">+ Виплатити</button></div>`:""}
    <div class="section-t">Історія</div>
    ${list.length?list.map(f=>`<div class="hist" data-fin="${f.id}" style="display:flex;gap:8px;cursor:pointer"><div style="flex:1"><div class="when">${fmtDay(f.date)}${f.site?" · "+esc(site(f.site)?.name||""):""}</div><div>${f.type==="accrual"?"Нараховано":"Виплачено"+(person(f.owner)?" ("+esc(person(f.owner).name)+")":"")}${f.note?" · "+esc(f.note):""}</div></div><span class="amt ${f.type==="accrual"?"acc":"out"}">${money(f.amount)}</span></div>`).join(""):`<div class="m" style="color:var(--muted)">Записів немає</div>`}
    <div class="actions"><button class="btn ghost" data-close>Закрити</button></div>`);
  $("#wAcc")?.addEventListener("click",()=>finForm(null,{type:"accrual",worker:id}));
  $("#wPay")?.addEventListener("click",()=>finForm(null,{type:"out",kind:"Зарплата",worker:id}));
  document.querySelectorAll(".sheet [data-fin]").forEach(el=>el.addEventListener("click",()=>{ if(S.canWrite) finForm(S.fin.get(el.dataset.fin)) }));
}
function finForm(f,preset){
  const isNew=!f; f=f||Object.assign({type:"out",date:todayISO(),owner:owners()[0]?.id,kind:"Матеріали"},preset||{});
  const pair=f.pair?[...S.fin.values()].find(x=>x.pair===f.pair&&x.id!==f.id):null;
  let mode=f.kind==="Взаємозалік"?"xfer":f.type;
  const from=f.kind==="Взаємозалік"?(f.type==="out"?f:pair):null, to=f.kind==="Взаємозалік"?(f.type==="in"?f:pair):null;
  const ownOpts=sel=>owners().map(o=>`<option value="${o.id}" ${sel===o.id?"selected":""}>${esc(o.name)}</option>`).join("");
  const workers=[...S.people.values()].filter(p=>p.role==="worker").sort(byName);
  openSheet(`<h2>${isNew?"Новий запис":"Редагувати запис"}</h2>
    <form id="finForm">
      <div class="field"><div class="seg" id="segM"><button type="button" data-v="in">➕ Прихід</button><button type="button" data-v="out">➖ Витрата</button><button type="button" data-v="xfer">⇄ Залік</button><button type="button" data-v="accrual">🔧 Нарахув.</button></div></div>
      <div class="row"><div class="field"><label>Дата</label><input type="date" name="date" value="${esc(f.date||todayISO())}"></div>
        <div class="field"><label>Сума, ₴ *</label><input name="amount" inputmode="decimal" required value="${f.amount??""}" placeholder="0"></div></div>
      <div data-m="in out"><div class="field"><label id="ownLbl">Хто</label><select name="owner">${ownOpts(f.owner)}</select></div></div>
      <div data-m="in out accrual"><div class="field"><label>Об'єкт</label><select name="site">${siteOptions(f.site||"","— без об'єкта")}</select></div></div>
      <div data-m="out accrual"><div class="row"><div class="field" data-m="out"><label>Вид</label><select name="kind">${KINDS.map(k=>`<option ${f.kind===k?"selected":""}>${k}</option>`).join("")}</select></div>
        <div class="field"><label id="wLbl">Виконавець</label><select name="worker"><option value="">—</option>${workers.map(p=>`<option value="${p.id}" ${f.worker===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div></div></div>
      <div data-m="xfer"><div class="row"><div class="field"><label>Від кого</label><select name="from">${ownOpts(from?.owner||owners()[0]?.id)}</select></div>
        <div class="field"><label>Кому</label><select name="to">${ownOpts(to?.owner||owners()[1]?.id)}</select></div></div></div>
      <div class="field"><label>Коментар</label><input name="note" value="${esc(f.note)}"></div>
      <div class="actions">${!isNew?`<button type="button" class="btn danger" id="delF">Видалити</button>`:""}<button type="button" class="btn ghost" data-close>Скасувати</button><button class="btn" type="submit">Зберегти</button></div>
    </form>`);
  const setMode=m=>{mode=m;[...$("#segM").children].forEach(x=>x.classList.toggle("on",x.dataset.v===m));document.querySelectorAll("#finForm [data-m]").forEach(el=>el.style.display=el.dataset.m.split(" ").includes(m)?"":"none");$("#ownLbl").textContent=m==="in"?"Хто отримав":"Хто заплатив";$("#wLbl").textContent=m==="accrual"?"Кому нараховано *":"Виконавець"};
  setMode(mode);
  $("#segM").onclick=e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.v)};
  $("#finForm").addEventListener("submit",async e=>{
    e.preventDefault(); const v=Object.fromEntries(new FormData(e.target));
    const amount=parseFloat(String(v.amount).replace(/\s/g,"").replace(",","."));
    if(!(amount>0)){toast("Вкажіть суму");return}
    const btn=e.target.querySelector("[type=submit]"); btn.disabled=true;
    let byName=f.byName||""; if(isNew){ try{byName=(await S.user?.me?.())?.name||""}catch(_){} }
    const now=Date.now(), base={date:v.date,amount,note:v.note.trim(),updatedAt:now,by:f.by||S.uid||"",byName};
    let ok;
    if(mode==="xfer"){
      if(v.from===v.to){toast("Виберіть різних людей");btn.disabled=false;return}
      const pid=f.pair||("x"+now);
      ok=await write(async db=>{
        const outRef=from?db.doc("fin/"+from.id):db.collection("fin").doc(), inRef=to?db.doc("fin/"+to.id):db.collection("fin").doc();
        // if editing a non-transfer entry into a transfer, reuse its doc for the outgoing side
        const outR=(!from&&!isNew)?db.doc("fin/"+f.id):outRef;
        await outR.set({...base,type:"out",owner:v.from,site:"",kind:"Взаємозалік",worker:"",pair:pid,createdAt:f.createdAt||now});
        await inRef.set({...base,type:"in",owner:v.to,site:"",kind:"Взаємозалік",worker:"",pair:pid,createdAt:f.createdAt||now});
      });
    } else if(mode==="accrual"){
      if(!v.worker){toast("Виберіть виконавця");btn.disabled=false;return}
      const data={...base,type:"accrual",owner:"",site:v.site||"",kind:"",worker:v.worker,createdAt:f.createdAt||now};
      ok=await write(async db=>{
        if(isNew) await db.collection("fin").add(data);
        else { await db.doc("fin/"+f.id).set(data); if(pair) await db.doc("fin/"+pair.id).delete(); }
      });
    } else {
      const data={...base,type:mode,owner:v.owner,site:v.site||"",kind:mode==="out"?v.kind:"",worker:mode==="out"?(v.worker||""):"",createdAt:f.createdAt||now};
      ok=await write(async db=>{
        if(isNew) await db.collection("fin").add(data);
        else { await db.doc("fin/"+f.id).set(data); if(pair) await db.doc("fin/"+pair.id).delete(); }
      });
    }

// ---------- Аналітика: скільки заробив кожен за місяць ----------
// Прибуток місяця = прихід − витрати (без взаємозаліків і нарахувань); частка = прибуток / кількість власників бази.
function monthStats(fin,ows){
  const m={};
  for(const f of fin.values()){ if(f.type==="accrual"||f.kind==="Взаємозалік"||!f.date) continue;
    const k=f.date.slice(0,7), x=m[k]||(m[k]={in:0,out:0,p:{}}), a=+f.amount||0;
    if(f.type==="in") x.in+=a; else x.out+=a;
    if(f.owner){ const q=x.p[f.owner]||(x.p[f.owner]={in:0,out:0}); if(f.type==="in") q.in+=a; else q.out+=a } }
  for(const k in m){ m[k].profit=m[k].in-m[k].out; m[k].share=m[k].profit/(ows.length||1) }
  return m;
}

const UA_MON=["Січня","Лютого","Березня","Квітня","Травня","Червня","Липня","Серпня","Вересня","Жовтня","Листопада","Грудня"];
const dLong=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return `${d} ${UA_MON[+m-1]} ${y} р.`};
const dShort=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return `${d}.${m}.${y.slice(2)}`};
const n2=n=>(Math.round((+n||0)*100)/100).toFixed(2);
const nApo=n=>{const[a,b]=n2(n).split(".");return a.replace(/\B(?=(\d{3})+(?!\d))/g,"'")+"."+b};
function uaWords(num){
  const ones=[["","один","два","три","чотири","п'ять","шість","сім","вісім","дев'ять"],["","одна","дві","три","чотири","п'ять","шість","сім","вісім","дев'ять"]];
  const teens=["десять","одинадцять","дванадцять","тринадцять","чотирнадцять","п'ятнадцять","шістнадцять","сімнадцять","вісімнадцять","дев'ятнадцять"];
  const tens=["","","двадцять","тридцять","сорок","п'ятдесят","шістдесят","сімдесят","вісімдесят","дев'яносто"];
  const hund=["","сто","двісті","триста","чотириста","п'ятсот","шістсот","сімсот","вісімсот","дев'ятсот"];
  const form=(n,f)=>{n%=100;if(n>10&&n<20)return f[2];n%=10;return n===1?f[0]:(n>=2&&n<=4?f[1]:f[2])};
  const tri=(n,fem)=>{const w=[];w.push(hund[Math.floor(n/100)]);const t=n%100;if(t>=10&&t<20)w.push(teens[t-10]);else{w.push(tens[Math.floor(t/10)]);w.push(ones[fem?1:0][t%10])}return w.filter(Boolean).join(" ")};
  const groups=[[1e9,0,["мільярд","мільярди","мільярдів"]],[1e6,0,["мільйон","мільйони","мільйонів"]],[1e3,1,["тисяча","тисячі","тисяч"]]];
  let n=Math.floor(num),out=[];
  for(const[d,fem,f]of groups){const g=Math.floor(n/d);if(g){out.push(tri(g,fem)+" "+form(g,f));n%=d}}
  if(n||!out.length)out.push(n?tri(n,1):"нуль");
  const kop=Math.round((num-Math.floor(num))*100);
  const s=out.join(" ")+" "+form(Math.floor(num),["гривня","гривні","гривень"])+" "+String(kop).padStart(2,"0")+" "+form(kop,["копійка","копійки","копійок"]);
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function loadXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>ok(window.XLSX);s.onerror=()=>bad(new Error("no xlsx"));document.head.appendChild(s)}); }
function estNum(v){ if(typeof v==="number") return v; const s=String(v??"").replace(/\s| /g,"").replace(",","."); if(!/^-?\d+(\.\d+)?$/.test(s)) return NaN; return parseFloat(s); }
function parseEstimateRows(rows,withVat){
  const RX={name:/найменув|назва|наимен|вид(и)? робіт|вид(ы)? работ|робот|работ|опис|товар|послуг|матеріал|материал/i,unit:/^од\.?|одиниц|ед\.?\s*изм|^ед\.?$|од\.\s*вим/i,qty:/к-?сть|кільк|колич|обсяг|об[''’]?[єе]м|объ[её]м/i,price:/ціна|цена|за\s*од|вартість\s*од|стоимость\s*ед/i,sum:/сума|сумма|вартість|стоимость|всього|итого/i};
  let hdr=-1,col={};
  for(let r=0;r<Math.min(rows.length,40);r++){
    const c={};rows[r].forEach((v,i)=>{const t=String(v).trim();if(!t)return;for(const k of ["qty","price","unit","name","sum"]){if(c[k]==null&&RX[k].test(t)){c[k]=i;break}}});
    if(c.name!=null&&(c.price!=null||c.sum!=null)){hdr=r;col=c;
      if(withVat){let vp=null,vs=null;rows[r].forEach((v,i)=>{const t=String(v);if(/(^|[^а-яіїєґ])(з|с)\s+(пдв|ндс)/i.test(t)){if(RX.price.test(t))vp=i;else if(RX.sum.test(t))vs=i}});
        if(vs!=null){col.sum=vs;col.price=vp}else if(vp!=null)col.price=vp}
      break}
  }
  if(hdr<0){ // без заголовка: перша текстова колонка + числа праворуч
    const cnt={};rows.slice(0,60).forEach(r=>r.forEach((v,i)=>{if(typeof v==="string"&&v.trim().length>3&&isNaN(estNum(v)))cnt[i]=(cnt[i]||0)+1}));
    const nameCol=+Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0]; if(isNaN(nameCol)) return [];
    col={name:nameCol}; hdr=-1;
  }
  const items=[];
  for(let r=hdr+1;r<rows.length;r++){
    const row=rows[r]; const name=String(row[col.name]??"").replace(/\s+/g," ").trim();
    if(!name||/^(всього|усього|разом|итого|всего|пдв|ндс|в т\.?ч|загалом)/i.test(name)) continue;
    let qty=col.qty!=null?estNum(row[col.qty]):NaN, price=col.price!=null?estNum(row[col.price]):NaN, sum=col.sum!=null?estNum(row[col.sum]):NaN;
    let unit=col.unit!=null?String(row[col.unit]??"").trim():"";
    if(col.qty==null&&col.price==null&&col.sum==null){ // без заголовка
      const nums=row.map((v,i)=>i>col.name?estNum(v):NaN).map((v,i)=>[v,i]).filter(([v])=>!isNaN(v));
      if(!nums.length) continue;
      const txt=row.find((v,i)=>i>col.name&&typeof v==="string"&&v.trim()&&isNaN(estNum(v))&&v.trim().length<=8); if(txt)unit=txt.trim();
      if(nums.length>=3){qty=nums[0][0];price=nums[1][0];sum=nums[2][0]} else if(nums.length===2){qty=nums[0][0];price=nums[1][0]} else {sum=nums[0][0]}
    }
    if(isNaN(price)&&!isNaN(sum)&&!isNaN(qty)&&qty) price=sum/qty;
    if(isNaN(qty)&&!isNaN(sum)){qty=1;price=sum}
    if(isNaN(qty)&&!isNaN(price)) qty=1;
    if(!(qty>0)||!(price>0)) continue;
    items.push({name,unit:unit||"посл.",qty:Math.round(qty*1000)/1000,price:Math.round(price*100)/100});
  }
  return items;
}
async function importEstimate(file,withVat){
  const XLSX=await loadXLSX();
  const buf=await file.arrayBuffer();let wb=XLSX.read(buf,{type:"array"});
  const moj=w=>/[À-ÿ]{4,}/.test(w.SheetNames.map(n=>XLSX.utils.sheet_to_csv(w.Sheets[n])).join(" ").slice(0,5000));
  if(moj(wb)) wb=XLSX.read(buf,{type:"array",codepage:1251});
  const res=[];
  for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""});const it=parseEstimateRows(rows,withVat);if(it.length)res.push({sheet:sn,items:it})}
  return res;
}

const CHUNK=700000;
async function saveFile(file){
  if(file.size>8*1024*1024) throw new Error("big");
  const b64=await new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=bad;r.readAsDataURL(file)});
  const id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); const n=Math.ceil(b64.length/CHUNK);
  await write(async db=>{ for(let i=0;i<n;i++) await db.doc("files/"+id+"_"+i).set({d:b64.slice(i*CHUNK,(i+1)*CHUNK)}); await db.doc("files/"+id).set({name:file.name,type:file.type||"application/octet-stream",size:file.size,chunks:n}); });
  return {id,name:file.name};
}
async function openFile(id){
  toast("Завантажую файл…");
  try{ const m=await S.db.doc("files/"+id).get(); if(!m.exists){toast("Файл не знайдено");return} const meta=m.data(); let b64="";
    for(let i=0;i<meta.chunks;i++){const c=await S.db.doc("files/"+id+"_"+i).get(); b64+=c.data().d}
    const bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([arr],{type:meta.type}));a.download=meta.name;document.body.appendChild(a);a.click();a.remove();
  }catch(e){toast("Не вдалося відкрити файл")}
}

  if(e<0) throw new Error("не docx");
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true), ent=null;
  for(let k=0;k<n;k++){ const m=dv.getUint16(p+10,true), cs=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.slice(p+46,p+46+nl)); if(name==="word/document.xml"){ent={m,cs,lo};break} p+=46+nl+xl+cl }
  if(!ent) throw new Error("немає document.xml");
  const ls=ent.lo+30+dv.getUint16(ent.lo+26,true)+dv.getUint16(ent.lo+28,true), raw=u8.slice(ls,ls+ent.cs);
  let xml; if(ent.m===0) xml=new TextDecoder().decode(raw);
  else { const ds=new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw")); xml=await new Response(ds).text() }
  return xml.replace(/<w:tab\/>/g,"\t").replace(/<w:br[^>]*\/>/g,"\n").replace(/<\/w:tc>/g," | ").replace(/<\/w:p>/g,"\n").replace(/<[^>]+>/g,"")
    .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&").replace(/\n{3,}/g,"\n\n").trim();

async function aiParts(name,type,buf){
  const ext=(name.split(".").pop()||"").toLowerCase(), b64=()=>{let b="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b)};
  if(type==="application/pdf"||ext==="pdf") return [{b64:b64(),mime:"application/pdf"}];
  if(/^image\//.test(type)||["jpg","jpeg","png","webp","heic"].includes(ext)) return [{b64:b64(),mime:/^image\//.test(type)?type:"image/"+(ext==="jpg"?"jpeg":ext)}];
  if(ext==="docx") return [{text:"ТЕКСТ ДОГОВОРУ:\n"+await docxText(buf)}];
  throw new Error("Формат не підтримується. Потрібен PDF, фото або Word (.docx)");
}
function itemsPrompt(){

{"items":[{"name":"назва роботи/матеріалу","unit":"од. виміру (м², м.п., шт., посл. тощо)","qty":кількість числом,"price":ціна за одиницю числом}]}
Правила: не вигадуй; пропускай заголовки, підсумки, «Всього», ПДВ-рядки. Якщо є колонки з ПДВ і без ПДВ — бери ціну без ПДВ. Якщо є лише сума по рядку й кількість — price = сума / кількість. Якщо ціни немає — price 0. Числа без пробілів, десятковий роздільник — крапка.`;
}
function contractPrompt(){

{"no":"№ договору","date":"YYYY-MM-DD","until":"YYYY-MM-DD або null (до якої дати діє)",
 "client":{"name":"назва замовника (організація або ФОП/ПІБ)","edrpou":"ЄДРПОУ або ІПН (лише цифри)","phone":"","address":"юридична адреса","signerTitle":"посада підписанта замовника","signerName":"ПІБ підписанта у форматі Прізвище І.Б.","repText":"фраза з договору «в особі …, що діє на підставі …» для замовника"},

 "items":[{"name":"назва роботи/матеріалу","unit":"од. виміру","qty":число,"price":ціна за одиницю числом}],

Правила: Замовник — сторона, яка замовляє й оплачує роботи; Підрядник — яка їх виконує. Не вигадуй: чого немає в документі — став null або "". Усі суми та кількості — числа без пробілів. Дати — лише у форматі YYYY-MM-DD. Якщо є кошторис (додаток) — заповни items усіма рядками, а total залиш, лише якщо кошторису немає.`;
}

// ---------- Резервна копія на Google Диск ----------
const BACKUP_DAYS=7;
async function driveBackup(silent){
  if(!window.__fbDump||!window.__driveToken){toast("Недоступно");return false}
  const bar=$("#bkMsg"); const say=t=>{ if(bar) bar.textContent=t };
  try{
    say("⏳ Вхід у Google Диск…"); const tok=await window.__driveToken();
    say("⏳ Збираю дані…"); const data=await window.__fbDump();
    const H={Authorization:"Bearer "+tok}, api="https://www.googleapis.com/drive/v3/files";
    const q=encodeURIComponent("name='Облік — резервні копії' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    let r=await fetch(api+"?q="+q+"&fields=files(id)",{headers:H}); if(!r.ok) throw new Error("Drive "+r.status+": "+(await r.text()).slice(0,200));
    let folder=(await r.json()).files?.[0]?.id;
    if(!folder){ r=await fetch(api+"?fields=id",{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({name:"Облік — резервні копії",mimeType:"application/vnd.google-apps.folder"})}); if(!r.ok) throw new Error("Drive "+r.status); folder=(await r.json()).id }
    say("⏳ Завантажую на Диск…");
    const name="oblik-backup-"+todayISO()+".json", body=JSON.stringify(data), b="oblik"+Date.now();
    const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name,parents:[folder]})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
    r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{...H,"Content-Type":"multipart/related; boundary="+b},body:mp}); if(!r.ok) throw new Error("Drive "+r.status+": "+(await r.text()).slice(0,200));
    // залишаємо 12 останніх копій
    r=await fetch(api+"?q="+encodeURIComponent(`'${folder}' in parents and trashed=false`)+"&orderBy=createdTime desc&fields=files(id)&pageSize=100",{headers:H});
    if(r.ok){ const old=((await r.json()).files||[]).slice(12); for(const f of old) await fetch(api+"/"+f.id,{method:"DELETE",headers:H}).catch(()=>{}) }
    await write(db=>db.doc("meta/backup").set({at:Date.now(),by:window.__fbEmail||"",size:body.length}));
    S.backupAt=Date.now(); say(""); toast("✅ Копію збережено на Google Диск ("+Math.round(body.length/1024)+" КБ)"); render(); return true;
  }catch(e){ const m=String(e?.message||e); say(""); if(!/popup-closed|cancelled/i.test(m)) toast("Не вдалося зберегти копію: "+m.slice(0,150)); return false }
}


// ---------- Імпорт з Google-таблиці (Excel): «общак» на двох і «ОБЩАК НА 3» ----------
const SHEET_CFG={
  duo:{title:"общак на двох",fin:"duo_fin",sites:"duo_sites",B:()=>S.B.duo,own:{"андрей":"andriy","сергей":"serhiy"},ows:["andriy","serhiy"],col:{name:4,H:7,flag:8},bal:{andriy:1,serhiy:2},pre:"d",pad:5,fold:"2026-01-01"},
  trio:{title:"на трьох",fin:"fin",sites:"sites",B:()=>S.B.trio,own:{"андрей":"andriy","сергей":"serhiy","діма":"dmytro","дима":"dmytro","дмитро":"dmytro"},ows:["andriy","serhiy","dmytro"],col:{name:5,H:8,flag:9},bal:{andriy:1,serhiy:2,dmytro:3},pre:"g",pad:4,fold:""}};
const OWN_NAME={andriy:"Андрій",serhiy:"Сергій",dmytro:"Дмитро"};
function sheetParse(XLSX,wb,cutoff,cfg){
  // Рахуємо так само, як формули таблиці: SUMIFS порівнює текст без урахування регістру, але з пробілами; сумує лише числові клітинки.
  const sh=n=>wb.Sheets[wb.SheetNames.find(x=>x.trim().toLowerCase()===n)];
  const J=sh("журнал"), O=sh("отчет")||sh("отчёт"); if(!J) throw new Error("У файлі немає аркуша «журнал»");
  const rows=XLSX.utils.sheet_to_json(J,{header:1,raw:true,defval:""});
  const num=x=>typeof x==="number"?x:NaN;
  const date=x=>{ if(typeof x==="number"){const d=XLSX.SSF.parse_date_code(x); return d?`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`:""}
    const m=String(x).trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/); if(!m) return ""; let y=m[3]; if(y.length===2) y="20"+y; y=y.padStart(4,"0"); return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}` };
  const low=x=>String(x??"").toLowerCase();
  const own=x=>cfg.own[low(x)]||"";
  const KIND={"з\\п":"Зарплата","з/п":"Зарплата","зп":"Зарплата","материалы":"Матеріали","матеріали":"Матеріали","доставка":"Доставка","инструменты":"Інструменти","інструменти":"Інструменти","инструмент":"Інструменти"};
  const rep={}, order=[], exp={}; const dupl=[]; const C=cfg.col;
  if(O){ const r=XLSX.utils.sheet_to_json(O,{header:1,raw:true,defval:""});
    for(const k in cfg.bal){ const v=num(r[1]?.[cfg.bal[k]]); exp[k]=isNaN(v)?null:v }
    for(const x of r.slice(1)){ const raw=String(x[C.name]??""); if(!raw.trim()) continue; const k=low(raw), fl=String(x[C.flag]).trim()==="1";
      if(rep[k]){ rep[k].mult+=fl?1:0; dupl.push(raw.trim()); continue }
      rep[k]={name:raw.trim(),raw,split:fl,mult:fl?1:0,expH:typeof x[C.H]==="number"?x[C.H]:null}; order.push(k) } }
  const ent=[]; const ign={type:0,amount:0}; let noOwner=0;
  rows.slice(1).forEach((r,i)=>{ const row=i+2, t=low(r[2]), a=num(r[5]);
    if(t!=="приход"&&t!=="расход"){ if(String(r[5]).trim()!==""||String(r[2]).trim()!=="") ign.type++; return }
    if(isNaN(a)){ if(String(r[5]).trim()!=="") ign.amount++; return }
    if(!a) return;
    const o=own(r[4]); if(!o) noOwner++;
    const g=String(r[6]||"").trim(), k=KIND[g.toLowerCase()];
    const note=[String(r[3]||"").trim()&&"🔧 "+String(r[3]).trim(), !k&&g&&g.toLowerCase()!=="расход"?g:"", String(r[7]||"").trim(), !o&&String(r[4]).trim()?"платник: "+String(r[4]).trim():""].filter(Boolean).join(" · ");
    const sk=String(r[1]??"").trim()?low(r[1]):"";
    if(sk&&!rep[sk]){ rep[sk]={name:String(r[1]).trim(),raw:String(r[1]),split:false,mult:0,expH:null,extra:true}; order.push(sk) }
    const id=String(r[8]??"").trim();
    ent.push({row,id:/^[\w-]{2,40}$/.test(id)?id:"",date:date(r[0]),site:sk,type:t==="приход"?"in":"out",owner:o,amount:Math.round(a*100)/100,kind:k||"",note}); });
  for(let i=0;i<ent.length-1;i++){ const a=ent[i],b=ent[i+1]; if(!a.site&&!b.site&&!a.pair&&a.date===b.date&&a.amount===b.amount&&a.type!==b.type&&a.owner&&b.owner&&a.owner!==b.owner){ a.pair=b.pair=cfg.pre+a.row; a.kind=b.kind="Взаємозалік"; i++ } }
  const raw={}; for(const k of cfg.ows) raw[k]=0; const st={};
  for(const e of ent){ if(e.owner) raw[e.owner]=(raw[e.owner]||0)+(e.type==="in"?1:-1)*e.amount; if(e.site) st[e.site]=(st[e.site]||0)+(e.type==="in"?1:-1)*e.amount }
  let shared=0; for(const k in rep) if(rep[k].split) shared+=(st[k]||0);
  const bal={}; for(const k of cfg.ows) bal[k]=(raw[k]||0)-shared/cfg.ows.length;
  const diffs=order.filter(k=>rep[k].expH!=null&&Math.abs((st[k]||0)-rep[k].expH)>=0.5).map(k=>({name:rep[k].name,app:st[k]||0,sheet:rep[k].expH}));
  let out=ent, folded=0;
  if(cutoff){ const isOld=e=>e.date&&e.date<cutoff&&!e.pair&&!(e.id&&!/^[dg]\d{4,5}$/.test(e.id)); const old=ent.filter(isOld), keep=ent.filter(e=>!isOld(e)); const agg={};
    for(const e of old){ const k=e.site+"|"+e.owner+"|"+e.type; (agg[k]=agg[k]||{...e,amount:0,n:0,kind:"",note:""}).amount+=e.amount; agg[k].n++ }
    const prev=new Date(cutoff); prev.setDate(prev.getDate()-1); const pd=prev.toISOString().slice(0,10);
    out=[...Object.values(agg).map((a,i)=>({...a,row:"z"+i,id:"",date:pd,amount:Math.round(a.amount*100)/100,note:`залишок: ${a.n} зап. до ${fmtDay(cutoff)}`})),...keep]; folded=old.length; }
  return {cfg,ent:out,all:ent.length,folded,ign,noOwner,bal,exp,rep,order,diffs,dupl};
}

        ${r.diffs.length?`<div class="banner">Розходиться з «отчет» по об'єктах:<br>${r.diffs.slice(0,8).map(d=>`${esc(d.name)}: тут ${money(d.app)}, у таблиці ${money(d.sheet)}`).join("<br>")}</div>`:""}
        <div class="field"><label style="display:flex;align-items:center;gap:8px;color:var(--text);font-size:15px"><input type="checkbox" id="duoFold" style="width:22px;height:22px" ${cut?"checked":""}> Згорнути записи до 2026 року в залишки по об'єктах</label>
        <div class="m" style="color:var(--muted);font-size:12.5px">${cut?`${r.folded} старих записів → ${r.ent.length-(r.all-r.folded)} рядків залишку. Баланси й суми по об'єктах не зміняться.`:"Усі записи імпортуються окремо."} Буде записано: <b>${r.ent.length}</b>. Записи, внесені в застосунку й ще не перенесені в таблицю, залишаться.</div></div>
        <div class="actions"><button class="btn ghost" data-close>Скасувати</button><button class="btn" id="duoGo">Імпортувати</button></div>`);
      $("#duoFold").onchange=e=>draw(e.target.checked?"2026-01-01":"");
      $("#duoGo").onclick=()=>sheetImportRun(r); };
    draw(cfg.fold);
  }catch(e){ const el=$("#duoMsg"); if(el) el.textContent="Не вдалося прочитати: "+String(e?.message||e).slice(0,200) }
}
async function sheetImportRun(r){
  const cfg=r.cfg, B=cfg.B();
  openSheet(`<h2>Імпорт…</h2><p id="impProg">Підготовка</p>`); const prog=t=>{const el=$("#impProg"); if(el) el.textContent=t};
  const byName=new Map(); for(const x of B.sites.values()){ if(x.key) byName.set(x.key,x.id); if(!byName.has(String(x.name).trim().toLowerCase())) byName.set(String(x.name).trim().toLowerCase(),x.id) }
  const lastUse={}; for(const e of r.ent) if(e.site&&(!lastUse[e.site]||e.date>lastUse[e.site])) lastUse[e.site]=e.date;
  const recent=new Date(); recent.setDate(recent.getDate()-120); const rIso=recent.toISOString().slice(0,10);
  const sites=[]; let k=0; const sid={}; const used=new Set(); const maxOrd=Math.max(0,...[...B.sites.values()].map(x=>+x.order||0));
  r.order.forEach((key,i)=>{ const x=r.rep[key]; let ex=byName.get(key)||byName.get(x.name.toLowerCase()); if(ex&&used.has(ex)) ex=null;
    const id=ex||(cfg.pre+"s"+Date.now().toString(36)+(k++)); used.add(id); sid[key]=id; const old=B.sites.get(id);
    if(old){ if(!!old.split!==x.split||old.key!==key||old.raw!==x.raw) sites.push({...old,id,split:x.split,key,raw:x.raw}) }
    else if(lastUse[key]||x.split||!x.extra) sites.push({id,name:x.name,raw:x.raw,key,type:"site",split:x.split,active:(lastUse[key]||"")>=rIso,order:maxOrd+i+1}); });
  const fin=r.ent.map(e=>{ const d={id:e.id||(cfg.pre+String(e.row).padStart(cfg.pad,"0")),date:e.date,type:e.type,owner:e.owner,amount:e.amount,site:e.site?sid[e.site]:"",kind:e.kind,worker:"",note:e.note,createdAt:typeof e.row==="number"?e.row:0}; if(e.pair) d.pair=e.pair; return d });
  const keep=new Set(fin.map(f=>f.id)); const del=[...B.fin.values()].filter(f=>(+f.createdAt||0)<1e12&&!keep.has(f.id)).map(f=>[cfg.fin,f.id]);
  try{ prog("Видалення застарілих: "+del.length); await window.__fbDelete(del);
    const items=[...sites.map(x=>[cfg.sites,x]),...fin.map(x=>[cfg.fin,x])];
    await window.__fbBulk(items,n=>prog("Запис: "+n+" / "+items.length));
    if(cfg===SHEET_CFG.duo){ let old={}; try{ const m=await S.db.doc("duo_meta/info").get(); if(m.exists) old=m.data() }catch(_){}
      await window.__fbBulk([["duo_meta",{...old,id:"info",importedAt:Date.now(),rows:r.all}]]); }
    closeSheet(); toast("Імпортовано: "+fin.length+" записів"+(sites.length?", об'єктів оновлено/додано: "+sites.length:""));
  }catch(e){ closeSheet(); toast("Помилка імпорту: "+String(e?.code||e?.message||e).slice(0,100)) }
}


// ---------- Пряме читання Google-таблиці (без Excel) ----------
async function gsheetWB(XLSX,id){
  const tok=await window.__sheetsToken();
  const u=`https://sheets.googleapis.com/v4/spreadsheets/${id}/values:batchGet?ranges=${encodeURIComponent("журнал!A:I")}&ranges=${encodeURIComponent("отчет!A:J")}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`;
  const r=await fetch(u,{headers:{Authorization:"Bearer "+tok}});
  if(!r.ok){ const t=await r.text(); if(/SERVICE_DISABLED|has not been used|is disabled/i.test(t)) throw new Error("Google Sheets API не увімкнено в проєкті (Андрій отримав інструкцію)"); if(r.status===403||r.status===404) throw new Error("Немає доступу до таблиці цим акаунтом"); throw new Error("Sheets "+r.status+": "+t.slice(0,150)) }

  for(const v of j.valueRanges||[]){ const name=String(v.range).split("!")[0].replace(/'/g,""); wb.SheetNames.push(name); wb.Sheets[name]=XLSX.utils.aoa_to_sheet(v.values||[]) }

async function driveFolder(H){
  const api="https://www.googleapis.com/drive/v3/files", q=encodeURIComponent("name='Облік — резервні копії' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  let r=await fetch(api+"?q="+q+"&fields=files(id)",{headers:H}); if(!r.ok) throw new Error("Drive "+r.status+": "+(await r.text()).slice(0,200));
  let id=(await r.json()).files?.[0]?.id; if(id) return id;
  r=await fetch(api+"?fields=id",{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({name:"Облік — резервні копії",mimeType:"application/vnd.google-apps.folder"})}); if(!r.ok) throw new Error("Drive "+r.status); return (await r.json()).id;
}
async function driveSave(name,body,H){
  const folder=await driveFolder(H), api="https://www.googleapis.com/drive/v3/files";
  const r=await fetch(api+"?q="+encodeURIComponent(`name='${name}' and '${folder}' in parents and trashed=false`)+"&fields=files(id)",{headers:H}); const ex=r.ok?(await r.json()).files?.[0]?.id:null;
  const b="oblik"+Date.now(), meta=ex?{}:{name,parents:[folder]};
  const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  const u=ex?`https://www.googleapis.com/upload/drive/v3/files/${ex}?uploadType=multipart`:"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
  const w=await fetch(u,{method:ex?"PATCH":"POST",headers:{...H,"Content-Type":"multipart/related; boundary="+b},body:mp}); if(!w.ok) throw new Error("Drive "+w.status+": "+(await w.text()).slice(0,200));
}

let drvTok=null, drvExp=0;
window.__driveToken=async()=>{ if(drvTok&&Date.now()<drvExp) return drvTok;
  const p=new GoogleAuthProvider(); p.addScope("https://www.googleapis.com/auth/drive.file"); if(auth.currentUser?.email) p.setCustomParameters({login_hint:auth.currentUser.email});
  const r=await reauthenticateWithPopup(auth.currentUser,p); const c=GoogleAuthProvider.credentialFromResult(r); if(!c?.accessToken) throw new Error("Немає доступу до Google Диска");
  drvTok=c.accessToken; drvExp=Date.now()+50*60e3; return drvTok; };
let shTok=null, shExp=0;
window.__sheetsToken=async()=>{ if(shTok&&Date.now()<shExp) return shTok;
  const p=new GoogleAuthProvider(); p.addScope("https://www.googleapis.com/auth/spreadsheets.readonly"); p.addScope("https://www.googleapis.com/auth/drive.file"); if(auth.currentUser?.email) p.setCustomParameters({login_hint:auth.currentUser.email});
  const r=await reauthenticateWithPopup(auth.currentUser,p); const c=GoogleAuthProvider.credentialFromResult(r); if(!c?.accessToken) throw new Error("Немає доступу до Google-таблиць");
  shTok=drvTok=c.accessToken; shExp=drvExp=Date.now()+50*60e3; return shTok; };
window.__fbList=async c=>{ const sn=await getDocs(collection(fs,px(c))); return sn.docs.map(d=>({id:d.id,...d.data()})) };
window.__fbSignOut=async()=>{ await signOut(auth); location.reload(); };

document.getElementById("loginBtn").onclick=async()=>{
  const p=new GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
  msg.textContent="";
  try{ await signInWithPopup(auth,p) }catch(e){ if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment") await signInWithRedirect(auth,p); else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request") msg.textContent="Не вдалося увійти: "+e.code; }
};
lo2.onclick=()=>window.__fbSignOut();
getRedirectResult(auth).catch(e=>{ msg.textContent="Не вдалося увійти: "+(e.code||e.message)+". Спробуйте відкрити посилання в Chrome (не з іконки) і увійти ще раз."; });

let started=false;
onAuthStateChanged(auth,async u=>{
  if(!u){ L.style.display="flex"; return; }
  const email=(u.email||"").toLowerCase();
  if(ALLOWED.length&&!ALLOWED.includes(email)){ L.style.display="flex"; msg.innerHTML="Пошта <b>"+email+"</b> не має доступу.<br>Попросіть Андрія додати її."; document.getElementById("loginBtn").style.display="none"; lo2.style.display=""; return; }
  L.style.display="none"; window.__fbEmail=email;
  if(started) return; started=true;
  try{ DEMO=DEMO_EMAILS.includes(email)||DEMO_HASHES.includes(await sha(email))||new URLSearchParams(location.search).has("demo") }catch(_){ DEMO=new URLSearchParams(location.search).has("demo") }
  window.__demo=DEMO;
  const name=u.displayName||email;
  const user={ id:async()=>u.uid, me:async()=>({name}), can:async()=>true };
  (DEMO?demoPrepare():Promise.resolve()).then(()=>window.__fbResolve([db,user]));
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
