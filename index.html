function priceList(){ if(!S.price?.items) return PRICE_SEED;
  if((S.price.seedVer||1)>=PRICE_VER) return S.price.items;
  if(!S.priceMerged){ const l=S.price.items.map(x=>({...x})), by=new Map(l.map(x=>[x.name,x]));
    for(const it of PRICE_SEED){ const o=by.get(it.name); if(!o) l.push({...it}); else if(!o.alt&&it.alt) o.alt=it.alt }
    S.priceMerged=l; if(S.canWrite) savePrice(l) }
  return S.priceMerged }
// ---- навчання відповідностей: «як пишуть хлопці/замовник» → наша робота ----
const normW=t=>String(t||"").toLowerCase().replace(/ё/g,"е").replace(/[’'`"«»().,;:!?\-–—/\\]+/g," ").replace(/\s+/g," ").trim();
function aliasOf(name){ return (S.aliases||{})[normW(name)]||"" }
// пошук: кожне слово запиту має збігтися з початком якогось слова (окно → окна, арміров → армування)
function wordHit(text,q){ const h=normW(text), ws=normW(q).split(" ").filter(Boolean), ts=h.split(" ");
  return ws.every(w=>h.includes(w)||ts.some(t=>t.startsWith(w.slice(0,Math.min(w.length,Math.max(3,w.length-2)))))) }
let aliasTimer=null;
function learnAlias(from,to){ const k=normW(from); if(!k||!to||normW(to)===k) return; S.aliases={...(S.aliases||{}),[k]:to};
  clearTimeout(aliasTimer); aliasTimer=setTimeout(()=>{ if(S.canWrite) write(db=>db.doc("meta/aliases").set({map:S.aliases,updatedAt:Date.now()})).catch(()=>{}) },800) }
function loadAliases(){ if(S.aliasesLoaded) return; S.aliasesLoaded=true; S.db.doc("meta/aliases").get().then(x=>{ if(x.exists) S.aliases={...(x.data().map||{}),...(S.aliases||{})} }).catch(()=>{}) }

async function updateMatPrices(list){
  if(!window.__fbAIWeb){ toast("ШІ недоступний"); return } if(S.mpRun) return;
  await loadMatPricesP(); const now=Date.now();
  // спершу ті, що давно не оновлювались; ручні ціни не чіпаємо
  const todo=list.filter(x=>{ const p=(S.matprices||{})[normName(x.name)]; return !p||(p.src!=="вручну"&&(p.mode!=="max"||now-(p.at||0)>3*864e5)) });
  if(!todo.length){ toast("Усі ціни цього списку свіжі (оновлені за останні 3 дні) або вписані вручну"); return }
  S.mpRun={done:0,total:todo.length,stop:false,found:0}; const rr=()=>{ if(S.tab==="money"&&S.mtab==="price"&&S.priceMode==="mat") renderMoneyMat() }; rr();
  // не даємо екрану згаснути, поки оновлюються ціни
  let wl=null; const lock=async()=>{ try{ if(navigator.wakeLock&&!wl&&document.visibilityState==="visible"){ wl=await navigator.wakeLock.request("screen"); wl.addEventListener?.("release",()=>{ wl=null }) } }catch(_){} };
  const onVis=()=>{ if(document.visibilityState==="visible") lock() }; document.addEventListener("visibilitychange",onVis); await lock();
  try{ localStorage.setItem("mpResume",JSON.stringify(todo.map(x=>x.name))) }catch(_){}
  let errs=0;
  for(let k=0;k<todo.length&&!S.mpRun.stop;k+=15){ const b=todo.slice(k,k+15);
    while(document.visibilityState==="hidden"&&!S.mpRun.stop) await new Promise(r=>setTimeout(r,1500)); // у фоні чекаємо, а не втрачаємо запити
    try{ const r=await epicentrPrices(b.map(x=>({name:x.name,unit:x.unit}))); S.mpRun.found+=r.n; errs=0 }
    catch(e){ if(document.visibilityState==="hidden"){ k-=15; continue } if(++errs>=3){ toast("Пошук цін зупинено: "+String(e?.message||e).slice(0,60)); break } }
    S.mpRun.done=Math.min(todo.length,k+15); rr() }
  const f=S.mpRun.found, d=S.mpRun.done, fin=d>=todo.length; S.mpRun=null; document.removeEventListener("visibilitychange",onVis); try{ wl&&wl.release() }catch(_){}
  try{ if(fin) localStorage.removeItem("mpResume") }catch(_){}
  rr(); toast(`Оновлено цін: ${f} з ${d}${fin?"":" — решту можна дооновити кнопкою «Продовжити»"}`);
}

// ---- вибір роботи з пошуком (замість довгого списку) ----
function pickWork(list,cur,cb,noneLabel){ // list: [{name,unit,price,cat,alt,tag}]
  const ov=document.createElement("div"); ov.className="overlay"; ov.style.zIndex="1100";
  ov.innerHTML=`<div class="sheet" style="max-height:88vh;display:flex;flex-direction:column"><h2 style="margin-bottom:8px">Виберіть роботу</h2>
    <input id="pwQ" type="search" placeholder="Пошук: напр. армування, плитка, ГКЛ…" autocomplete="off" style="margin-bottom:8px">
    <div id="pwL" style="overflow:auto;flex:1;min-height:200px"></div>
    <div class="actions"><button class="btn ghost" id="pwNone">${noneLabel||"— немає (ціна вручну)"}</button><button class="btn ghost" id="pwX">Скасувати</button></div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  const idx=list.map((x,i)=>({i,x,h:normW([x.name,x.alt,x.cat].filter(Boolean).join(" "))}));
  const draw=()=>{ const q=normW($("#pwQ").value), words=q.split(" ").filter(Boolean);
    // кожне слово має збігтися з початком якогось слова назви (арм → армування) — так знаходяться й скорочення
    const hit=h=>words.every(w=>h.includes(w)||h.split(" ").some(t=>t.startsWith(w.slice(0,Math.min(w.length,Math.max(3,w.length-4))))));
    const l=idx.filter(o=>!words.length||hit(o.h)).slice(0,120);
    $("#pwL").innerHTML=l.length?l.map(o=>`<div data-pw="${o.i}" style="padding:10px 4px;border-bottom:1px solid var(--line,#2a2f38);cursor:pointer;${o.i===cur?"background:rgba(45,212,191,.12)":""}">
      <div>${o.x.tag?o.x.tag+" ":""}${esc(o.x.name)}</div><div class="m" style="font-size:12px;color:var(--muted)">${o.x.cat?esc(o.x.cat):""}${o.x.price?" · "+money(o.x.price)+"/"+esc(o.x.unit||""):""}${o.x.alt?" · "+esc(o.x.alt):""}</div></div>`).join(""):`<div class="empty">Нічого не знайдено</div>`; };
  $("#pwQ").oninput=draw; draw(); setTimeout(()=>$("#pwQ")?.focus(),50);
  $("#pwL").onclick=e=>{ const d=e.target.closest("[data-pw]"); if(d){ close(); cb(+d.dataset.pw) } };
  $("#pwNone").onclick=()=>{ close(); cb(-1) }; $("#pwX").onclick=close; ov.onclick=e=>{ if(e.target===ov) close() };
}
function printDoc(html,title){
  let p=$("#printArea"); if(!p){p=document.createElement("div");p.id="printArea";document.body.appendChild(p)}
  p.innerHTML=html; const t=document.title; document.title=title;
  setTimeout(()=>{window.print();document.title=t},50);
}

// 📤 Надіслати документ одразу (PDF-файлом через Viber/Telegram/пошту), без збереження й друку
function loadPDFLib(){ if(window.html2pdf) return Promise.resolve(window.html2pdf);
  return new Promise((ok,bad)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"; s.onload=()=>ok(window.html2pdf); s.onerror=()=>bad(new Error("Немає інтернету для PDF")); document.head.appendChild(s) }) }
async function sharePdf(html,title,text){ toast("⏳ Готую PDF…");
  try{ const H=await loadPDFLib(); const css=`.pdfwrap{background:#fff;color:#000;width:690px;box-sizing:border-box}.pdfwrap .doc{font:10.5pt/1.35 Arial,Helvetica,sans-serif;color:#000}.pdfwrap .doc h3{text-align:center;font-size:12pt;margin:18px 0 12px}.pdfwrap .doc table{width:100%;border-collapse:collapse}.pdfwrap .doc .hdr td{vertical-align:top;padding:3px 6px}.pdfwrap .doc .hdr .lbl{width:120px;font-weight:bold}.pdfwrap .doc .items th{background:#ccc;border:1px solid #000;padding:2px 4px;font-size:9.5pt}.pdfwrap .doc .items td{border:1px solid #000;padding:2px 4px}.pdfwrap .doc .items .tot td{border:none}.pdfwrap .doc .items .tot td.box{border:1px solid #000}.pdfwrap .doc .r{text-align:right}.pdfwrap .doc .b{font-weight:bold}.pdfwrap tr{page-break-inside:avoid}`;
    const box=document.createElement("div"); box.style.cssText="position:fixed;left:-10000px;top:0;z-index:-1"; box.innerHTML=`<style>${css}</style><div class="pdfwrap">${html}</div>`; document.body.appendChild(box);
    const name=String(title||"документ").replace(/[\\/:*?"<>|]/g,"")+".pdf";
    const blob=await H().set({margin:[12,12,12,12],filename:name,image:{type:"jpeg",quality:.88},html2canvas:{scale:2,backgroundColor:"#fff"},jsPDF:{unit:"mm",format:"a4"},pagebreak:{mode:["css","legacy"]}}).from(box.querySelector(".pdfwrap")).outputPdf("blob");
    box.remove(); const file=new File([blob],name,{type:"application/pdf"});
    try{ if(navigator.canShare?.({files:[file]})){ await navigator.share({files:[file],title:name,text:text||""}); return } }catch(e){ if(e?.name==="AbortError") return }
    const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove() },4000); toast("PDF завантажено — надішліть з «Завантажень»") }
  catch(e){ toast("Не вдалося: "+String(e?.message||e).slice(0,60)) } }

function estNum(v){ if(typeof v==="number") return v; const s=String(v??"").replace(/\s| /g,"").replace(",","."); if(!/^-?\d+(\.\d+)?$/.test(s)) return NaN; return parseFloat(s); }
function parseEstimateRows(rows,withVat){
  const RX={name:/найменув|назва|наимен|вид(и)? робіт|вид(ы)? работ|робот|работ|опис|товар|послуг|матеріал|материал/i,unit:/^од\.?|одиниц|ед\.?\s*изм|^ед\.?$|од\.\s*вим/i,qty:/к-?сть|кільк|колич|обсяг|об[''’]?[єе]м|объ[её]м/i,price:/ціна|цена|за\s*од|вартість\s*од|стоимость\s*ед/i,sum:/сума|сумма|вартість|стоимость|всього|итого/i};
  let hdr=-1,col={};
  for(let r=0;r<Math.min(rows.length,40);r++){
    const c={};rows[r].forEach((v,i)=>{const t=String(v).trim();if(!t)return;for(const k of ["qty","price","unit","name","sum"]){if(c[k]==null&&RX[k].test(t)){c[k]=i;break}}});
    if(c.name!=null&&(c.price!=null||c.sum!=null)){hdr=r;col=c;
      if(withVat){let vp=null,vs=null;rows[r].forEach((v,i)=>{const t=String(v);if(/(^|[^а-яіїєґ])(з|с)\s+(пдв|ндс)/i.test(t)){if(RX.price.test(t))vp=i;else if(RX.sum.test(t))vs=i}});
        if(vs!=null){col.sum=vs;col.price=vp}else if(vp!=null)col.price=vp}
      break}
  }
  if(hdr<0){ // без заголовка: перша текстова колонка + числа праворуч
    const cnt={};rows.slice(0,60).forEach(r=>r.forEach((v,i)=>{if(typeof v==="string"&&v.trim().length>3&&isNaN(estNum(v)))cnt[i]=(cnt[i]||0)+1}));
    const nameCol=+Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0]; if(isNaN(nameCol)) return [];
    col={name:nameCol}; hdr=-1;
  }
  const items=[];
  for(let r=hdr+1;r<rows.length;r++){
    const row=rows[r]; const name=String(row[col.name]??"").replace(/\s+/g," ").trim();
    if(!name||/^(всього|усього|разом|итого|всего|пдв|ндс|в т\.?ч|загалом)/i.test(name)) continue;
    let qty=col.qty!=null?estNum(row[col.qty]):NaN, price=col.price!=null?estNum(row[col.price]):NaN, sum=col.sum!=null?estNum(row[col.sum]):NaN;
    let unit=col.unit!=null?String(row[col.unit]??"").trim():"";
    if(col.qty==null&&col.price==null&&col.sum==null){ // без заголовка
      const nums=row.map((v,i)=>i>col.name?estNum(v):NaN).map((v,i)=>[v,i]).filter(([v])=>!isNaN(v));
      if(!nums.length) continue;
      const txt=row.find((v,i)=>i>col.name&&typeof v==="string"&&v.trim()&&isNaN(estNum(v))&&v.trim().length<=8); if(txt)unit=txt.trim();
      if(nums.length>=3){qty=nums[0][0];price=nums[1][0];sum=nums[2][0]} else if(nums.length===2){qty=nums[0][0];price=nums[1][0]} else {sum=nums[0][0]}
    }
    if(isNaN(price)&&!isNaN(sum)&&!isNaN(qty)&&qty) price=sum/qty;
    if(isNaN(qty)&&!isNaN(sum)){qty=1;price=sum}
    if(isNaN(qty)&&!isNaN(price)) qty=1;
    if(!(qty>0)||!(price>0)) continue;
    items.push({name,unit:unit||"посл.",qty:Math.round(qty*1000)/1000,price:Math.round(price*100)/100});
  }
  return items;
}
async function importEstimate(file,withVat){
  const XLSX=await loadXLSX();
  const buf=await file.arrayBuffer();let wb=XLSX.read(buf,{type:"array"});
  const moj=w=>/[À-ÿ]{4,}/.test(w.SheetNames.map(n=>XLSX.utils.sheet_to_csv(w.Sheets[n])).join(" ").slice(0,5000));
  if(moj(wb)) wb=XLSX.read(buf,{type:"array",codepage:1251});
  const res=[];
  for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""});const it=parseEstimateRows(rows,withVat);if(it.length)res.push({sheet:sn,items:it})}
  return res;
}

        document.body.appendChild(box); box.onclick=e=>{const k=e.target.closest("[data-k]");if(k){apply(res[+k.dataset.k].items);box.remove()}else if(e.target===box||e.target.closest("[data-x]"))box.remove()}; }
    }catch(err){toast("Не вдалося прочитати файл"+(err?.message?": "+String(err.message).slice(0,80):""))}
    e.target.value="";};
}

const CHUNK=700000;
async function saveFile(file){
  if(file.size>8*1024*1024) throw new Error("big");
  const b64=await new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=bad;r.readAsDataURL(file)});
  const id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); const n=Math.ceil(b64.length/CHUNK);
  await write(async db=>{ for(let i=0;i<n;i++) await db.doc("files/"+id+"_"+i).set({d:b64.slice(i*CHUNK,(i+1)*CHUNK)}); await db.doc("files/"+id).set({name:file.name,type:file.type||"application/octet-stream",size:file.size,chunks:n}); });
  return {id,name:file.name};
}
async function fileBlob(id){ const F=R("files"); const m=await S.db.doc(F+"/"+id).get(); if(!m.exists) return null; const meta=m.data(); let b64="";
  for(let i=0;i<meta.chunks;i++){const c=await S.db.doc(F+"/"+id+"_"+i).get(); b64+=c.data().d}
  const bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return {meta,blob:new Blob([arr],{type:meta.type})} }
async function viewFile(id){
  toast("Відкриваю чек…");
  try{ const r=await fileBlob(id); if(!r){toast("Файл не знайдено");return} const url=URL.createObjectURL(r.blob);
    const ov=document.createElement("div"); ov.style.cssText="position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px";
    ov.innerHTML=`<img src="${url}" style="max-width:100%;max-height:82vh;object-fit:contain;border-radius:6px"><div style="display:flex;gap:10px;margin-top:12px"><a class="btn" href="${url}" download="${esc(r.meta.name)}">⬇️ Завантажити</a><button class="btn ghost" style="color:#fff">Закрити</button></div>`;
    ov.querySelector("button").onclick=()=>{ov.remove();URL.revokeObjectURL(url)}; ov.onclick=e=>{if(e.target===ov){ov.remove();URL.revokeObjectURL(url)}}; document.body.appendChild(ov);
  }catch(e){ toast("Не вдалося відкрити: "+String(e?.message||e).slice(0,80)) } }
async function openFile(id){
  toast("Завантажую файл…");
  try{ const F=R("files"); const m=await S.db.doc(F+"/"+id).get(); if(!m.exists){toast("Файл не знайдено");return} const meta=m.data(); let b64="";
    for(let i=0;i<meta.chunks;i++){const c=await S.db.doc(F+"/"+id+"_"+i).get(); b64+=c.data().d}
    const bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([arr],{type:meta.type}));a.download=meta.name;document.body.appendChild(a);a.click();a.remove();
  }catch(e){toast("Не вдалося відкрити файл")}
}
async function deleteFile(id){ const F=R("files"); const m=await S.db.doc(F+"/"+id).get(); const n=m.exists?m.data().chunks:0; await window.__fbDelete([[F,id],...Array.from({length:n},(_,i)=>[F,id+"_"+i])]); }

async function docxText(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf); let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-70000);i--) if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0) throw new Error("не docx");
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true), ent=null;
  for(let k=0;k<n;k++){ const m=dv.getUint16(p+10,true), cs=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.slice(p+46,p+46+nl)); if(name==="word/document.xml"){ent={m,cs,lo};break} p+=46+nl+xl+cl }
  if(!ent) throw new Error("немає document.xml");
  const ls=ent.lo+30+dv.getUint16(ent.lo+26,true)+dv.getUint16(ent.lo+28,true), raw=u8.slice(ls,ls+ent.cs);
  let xml; if(ent.m===0) xml=new TextDecoder().decode(raw);
  else { const ds=new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw")); xml=await new Response(ds).text() }
  xml=xml.replace(/<w:tc[ >][\s\S]*?<\/w:tc>/g,m=>m.replace(/<\/w:p>/g," "));
  return xml.replace(/<w:tab\/>/g,"\t").replace(/<w:br[^>]*\/>/g,"\n").replace(/<\/w:tc>/g," | ").replace(/<\/w:tr>/g,"\n").replace(/<\/w:p>/g,"\n").replace(/<[^>]+>/g,"")
    .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&").replace(/\n{3,}/g,"\n\n").trim();
}
async function aiParts(name,type,buf){
  const ext=(name.split(".").pop()||"").toLowerCase(), b64=()=>{let b="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b)};
  if(type==="application/pdf"||ext==="pdf") return [{b64:b64(),mime:"application/pdf"}];
  if(/^image\//.test(type)||["jpg","jpeg","png","webp","heic"].includes(ext)) return [{b64:b64(),mime:/^image\//.test(type)?type:"image/"+(ext==="jpg"?"jpeg":ext)}];
  if(ext==="docx") return [{text:"ТЕКСТ ДОГОВОРУ:\n"+await docxText(buf)}];
  throw new Error("Формат не підтримується. Потрібен PDF, фото або Word (.docx)");
}

// ---------- Резервна копія на Google Диск ----------
const BACKUP_DAYS=7;
async function driveBackup(silent){
  if(!window.__fbDump||!window.__driveToken){toast("Недоступно");return false}
  const bar=$("#bkMsg"); const say=t=>{ if(bar) bar.textContent=t };
  try{
    say("⏳ Вхід у Google Диск…"); const tok=await window.__driveToken();
    say("⏳ Збираю дані…"); const data=await window.__fbDump();
    const H={Authorization:"Bearer "+tok}, api="https://www.googleapis.com/drive/v3/files";
    const q=encodeURIComponent("name='Облік — резервні копії' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    let r=await fetch(api+"?q="+q+"&fields=files(id)",{headers:H}); if(!r.ok) throw new Error("Drive "+r.status+": "+(await r.text()).slice(0,200));
    let folder=(await r.json()).files?.[0]?.id;
    if(!folder){ r=await fetch(api+"?fields=id",{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({name:"Облік — резервні копії",mimeType:"application/vnd.google-apps.folder"})}); if(!r.ok) throw new Error("Drive "+r.status); folder=(await r.json()).id }
    say("⏳ Завантажую на Диск…");
    const name="oblik-backup-"+todayISO()+".json", body=JSON.stringify(data), b="oblik"+Date.now();
    const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name,parents:[folder]})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;

const SHEET_CFG={
  duo:{title:"общак на двох",fin:"duo_fin",sites:"duo_sites",B:()=>S.B.duo,own:{"андрей":"andriy","сергей":"serhiy"},ows:["andriy","serhiy"],col:{name:4,H:7,flag:8},bal:{andriy:1,serhiy:2},pre:"d",pad:5,fold:"2026-01-01"},
  trio:{title:"на трьох",fin:"fin",sites:"sites",B:()=>S.B.trio,own:{"андрей":"andriy","сергей":"serhiy","діма":"dmytro","дима":"dmytro","дмитро":"dmytro"},ows:["andriy","serhiy","dmytro"],col:{name:5,H:8,flag:9},bal:{andriy:1,serhiy:2,dmytro:3},pre:"g",pad:4,fold:""}};
const OWN_NAME={andriy:"Андрій",serhiy:"Сергій",dmytro:"Дмитро"};
function sheetParse(XLSX,wb,cutoff,cfg){
  // Рахуємо так само, як формули таблиці: SUMIFS порівнює текст без урахування регістру, але з пробілами; сумує лише числові клітинки.
  const sh=n=>wb.Sheets[wb.SheetNames.find(x=>x.trim().toLowerCase()===n)];
  const J=sh("журнал"), O=sh("отчет")||sh("отчёт"); if(!J) throw new Error("У файлі немає аркуша «журнал»");
  const rows=XLSX.utils.sheet_to_json(J,{header:1,raw:true,defval:""});
  const num=x=>typeof x==="number"?x:NaN;
  const date=x=>{ if(typeof x==="number"){const d=XLSX.SSF.parse_date_code(x); return d?`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`:""}
    const m=String(x).trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/); if(!m) return ""; let y=m[3]; if(y.length===2) y="20"+y; y=y.padStart(4,"0"); return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}` };
  const low=x=>String(x??"").toLowerCase();
  const own=x=>cfg.own[low(x)]||"";
  const KIND={"з\\п":"Зарплата","з/п":"Зарплата","зп":"Зарплата","материалы":"Матеріали","матеріали":"Матеріали","доставка":"Доставка","инструменты":"Інструменти","інструменти":"Інструменти","инструмент":"Інструменти","податки":"Податки","налоги":"Податки"};
  const rep={}, order=[], exp={}; const dupl=[]; const C=cfg.col;
  if(O){ const r=XLSX.utils.sheet_to_json(O,{header:1,raw:true,defval:""});
    for(const k in cfg.bal){ const v=num(r[1]?.[cfg.bal[k]]); exp[k]=isNaN(v)?null:v }
    for(const x of r.slice(1)){ const raw=String(x[C.name]??""); if(!raw.trim()) continue; const k=low(raw), fl=String(x[C.flag]).trim()==="1";
      if(rep[k]){ rep[k].mult+=fl?1:0; dupl.push(raw.trim()); continue }
      rep[k]={name:raw.trim(),raw,split:fl,mult:fl?1:0,expH:typeof x[C.H]==="number"?x[C.H]:null}; order.push(k) } }
  const ent=[]; const ign={type:0,amount:0}; let noOwner=0;
  rows.slice(1).forEach((r,i)=>{ const row=i+2, t=low(r[2]), a=num(r[5]);
    if(t!=="приход"&&t!=="расход"){ if(String(r[5]).trim()!==""||String(r[2]).trim()!=="") ign.type++; return }
    if(isNaN(a)){ if(String(r[5]).trim()!=="") ign.amount++; return }
    if(!a) return;
    const o=own(r[4]); if(!o) noOwner++;
    const g=String(r[6]||"").trim(), k=KIND[g.toLowerCase()];
    const note=[String(r[3]||"").trim()&&"🔧 "+String(r[3]).trim(), !k&&g&&g.toLowerCase()!=="расход"?g:"", String(r[7]||"").trim(), !o&&String(r[4]).trim()?"платник: "+String(r[4]).trim():""].filter(Boolean).join(" · ");
    const sk=String(r[1]??"").trim()?low(r[1]):"";
    if(sk&&!rep[sk]){ rep[sk]={name:String(r[1]).trim(),raw:String(r[1]),split:false,mult:0,expH:null,extra:true}; order.push(sk) }
    const id=String(r[8]??"").trim();
    ent.push({row,id:/^[\w-]{2,40}$/.test(id)?id:"",date:date(r[0]),site:sk,type:t==="приход"?"in":"out",owner:o,amount:Math.round(a*100)/100,kind:k||"",note}); });
  for(let i=0;i<ent.length-1;i++){ const a=ent[i],b=ent[i+1]; if(!a.site&&!b.site&&!a.pair&&a.date===b.date&&a.amount===b.amount&&a.type!==b.type&&a.owner&&b.owner&&a.owner!==b.owner){ a.pair=b.pair=cfg.pre+a.row; a.kind=b.kind="Взаємозалік"; i++ } }
  const raw={}; for(const k of cfg.ows) raw[k]=0; const st={};
  for(const e of ent){ if(e.owner) raw[e.owner]=(raw[e.owner]||0)+(e.type==="in"?1:-1)*e.amount; if(e.site) st[e.site]=(st[e.site]||0)+(e.type==="in"?1:-1)*e.amount }
  let shared=0; for(const k in rep) if(rep[k].split) shared+=(st[k]||0);
  const bal={}; for(const k of cfg.ows) bal[k]=(raw[k]||0)-shared/cfg.ows.length;
  const diffs=order.filter(k=>rep[k].expH!=null&&Math.abs((st[k]||0)-rep[k].expH)>=0.5).map(k=>({name:rep[k].name,app:st[k]||0,sheet:rep[k].expH}));
  let out=ent, folded=0;
  if(cutoff){ const isOld=e=>e.date&&e.date<cutoff&&!e.pair&&!(e.id&&!/^[dg]\d{4,5}$/.test(e.id)); const old=ent.filter(isOld), keep=ent.filter(e=>!isOld(e)); const agg={};
    for(const e of old){ const k=e.site+"|"+e.owner+"|"+e.type; (agg[k]=agg[k]||{...e,amount:0,n:0,kind:"",note:""}).amount+=e.amount; agg[k].n++ }
    const prev=new Date(cutoff); prev.setDate(prev.getDate()-1); const pd=prev.toISOString().slice(0,10);
    out=[...Object.values(agg).map((a,i)=>({...a,row:"z"+i,id:"",date:pd,amount:Math.round(a.amount*100)/100,note:`залишок: ${a.n} зап. до ${fmtDay(cutoff)}`})),...keep]; folded=old.length; }
  return {cfg,ent:out,all:ent.length,folded,ign,noOwner,bal,exp,rep,order,diffs,dupl};
}

        <div class="field"><label style="display:flex;align-items:center;gap:8px;color:var(--text);font-size:15px"><input type="checkbox" id="duoFold" style="width:22px;height:22px" ${cut?"checked":""}> Згорнути записи до 2026 року в залишки по об'єктах</label>

        <div class="actions"><button class="btn ghost" data-close>Скасувати</button><button class="btn" id="duoGo">Імпортувати</button></div>`);
      $("#duoFold").onchange=e=>draw(e.target.checked?"2026-01-01":"");
      $("#duoGo").onclick=()=>sheetImportRun(r); };
    draw(cfg.fold);
  }catch(e){ const el=$("#duoMsg"); if(el) el.textContent="Не вдалося прочитати: "+String(e?.message||e).slice(0,200) }

async function sheetImportRun(r){
  const cfg=r.cfg, B=cfg.B();
  openSheet(`<h2>Імпорт…</h2><p id="impProg">Підготовка</p>`); const prog=t=>{const el=$("#impProg"); if(el) el.textContent=t};
  const byName=new Map(); for(const x of B.sites.values()){ if(x.key) byName.set(x.key,x.id); if(!byName.has(String(x.name).trim().toLowerCase())) byName.set(String(x.name).trim().toLowerCase(),x.id) }
  const lastUse={}; for(const e of r.ent) if(e.site&&(!lastUse[e.site]||e.date>lastUse[e.site])) lastUse[e.site]=e.date;
  const recent=new Date(); recent.setDate(recent.getDate()-120); const rIso=recent.toISOString().slice(0,10);
  const sites=[]; let k=0; const sid={}; const used=new Set(); const maxOrd=Math.max(0,...[...B.sites.values()].map(x=>+x.order||0));
  r.order.forEach((key,i)=>{ const x=r.rep[key]; let ex=byName.get(key)||byName.get(x.name.toLowerCase()); if(ex&&used.has(ex)) ex=null;
    const id=ex||(cfg.pre+"s"+Date.now().toString(36)+(k++)); used.add(id); sid[key]=id; const old=B.sites.get(id);
    if(old){ if(!!old.split!==x.split||old.key!==key||old.raw!==x.raw) sites.push({...old,id,split:x.split,key,raw:x.raw}) }
    else if(lastUse[key]||x.split||!x.extra) sites.push({id,name:x.name,raw:x.raw,key,type:"site",split:x.split,active:(lastUse[key]||"")>=rIso,order:maxOrd+i+1}); });
  const fin=r.ent.map(e=>{ const d={id:e.id||(cfg.pre+String(e.row).padStart(cfg.pad,"0")),date:e.date,type:e.type,owner:e.owner,amount:e.amount,site:e.site?sid[e.site]:"",kind:e.kind,worker:"",note:e.note,createdAt:typeof e.row==="number"?e.row:0}; if(e.pair) d.pair=e.pair; return d });
  const keep=new Set(fin.map(f=>f.id)); const del=[...B.fin.values()].filter(f=>(+f.createdAt||0)<1e12&&!keep.has(f.id)).map(f=>[cfg.fin,f.id]);
  try{ prog("Видалення застарілих: "+del.length); await window.__fbDelete(del);
    const items=[...sites.map(x=>[cfg.sites,x]),...fin.map(x=>[cfg.fin,x])];
    await window.__fbBulk(items,n=>prog("Запис: "+n+" / "+items.length));
    if(cfg===SHEET_CFG.duo){ let old={}; try{ const m=await S.db.doc("duo_meta/info").get(); if(m.exists) old=m.data() }catch(_){}
      await window.__fbBulk([["duo_meta",{...old,id:"info",importedAt:Date.now(),rows:r.all}]]); }
    closeSheet(); toast("Імпортовано: "+fin.length+" записів"+(sites.length?", об'єктів оновлено/додано: "+sites.length:""));
  }catch(e){ closeSheet(); toast("Помилка імпорту: "+String(e?.code||e?.message||e).slice(0,100)) }
}

async function gsheetWB(XLSX,id){
  const tok=await window.__sheetsToken();
  const u=`https://sheets.googleapis.com/v4/spreadsheets/${id}/values:batchGet?ranges=${encodeURIComponent("журнал!A:I")}&ranges=${encodeURIComponent("отчет!A:J")}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`;
  const r=await fetch(u,{headers:{Authorization:"Bearer "+tok}});
  if(!r.ok){ const t=await r.text(); if(/SERVICE_DISABLED|has not been used|is disabled/i.test(t)) throw new Error("Google Sheets API не увімкнено в проєкті (Андрій отримав інструкцію)"); if(r.status===403||r.status===404) throw new Error("Немає доступу до таблиці цим акаунтом"); throw new Error("Sheets "+r.status+": "+t.slice(0,150)) }
  const j=await r.json(), wb={SheetNames:[],Sheets:{}};
  for(const v of j.valueRanges||[]){ const name=String(v.range).split("!")[0].replace(/'/g,""); wb.SheetNames.push(name); wb.Sheets[name]=XLSX.utils.aoa_to_sheet(v.values||[]) }
  return wb;
}

// ---------- Вивантаження змін із застосунку для перенесення в Google-таблиці ----------
async function driveFolder(H){
  const api="https://www.googleapis.com/drive/v3/files", q=encodeURIComponent("name='Облік — резервні копії' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  let r=await fetch(api+"?q="+q+"&fields=files(id)",{headers:H}); if(!r.ok) throw new Error("Drive "+r.status+": "+(await r.text()).slice(0,200));
  let id=(await r.json()).files?.[0]?.id; if(id) return id;
  r=await fetch(api+"?fields=id",{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({name:"Облік — резервні копії",mimeType:"application/vnd.google-apps.folder"})}); if(!r.ok) throw new Error("Drive "+r.status); return (await r.json()).id;
}
async function driveSave(name,body,H){
  const folder=await driveFolder(H), api="https://www.googleapis.com/drive/v3/files";
  const r=await fetch(api+"?q="+encodeURIComponent(`name='${name}' and '${folder}' in parents and trashed=false`)+"&fields=files(id)",{headers:H}); const ex=r.ok?(await r.json()).files?.[0]?.id:null;
  const b="oblik"+Date.now(), meta=ex?{}:{name,parents:[folder]};
  const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  const u=ex?`https://www.googleapis.com/upload/drive/v3/files/${ex}?uploadType=multipart`:"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
  const w=await fetch(u,{method:ex?"PATCH":"POST",headers:{...H,"Content-Type":"multipart/related; boundary="+b},body:mp}); if(!w.ok) throw new Error("Drive "+w.status+": "+(await w.text()).slice(0,200));
}
function syncPayload(Bk,delCol){
  const own=id=>({andriy:"Андрей",serhiy:"Сергей",dmytro:"Діма"})[id]||(person(id)?.name||"");
  const KIND_S={"Зарплата":"З\\п","Матеріали":"материалы","Доставка":"доставка","Інструменти":"инструменты","Податки":"податки"};
  const rows=[...Bk.fin.values()].filter(f=>f.type!=="accrual"&&((+f.createdAt||0)>1e12||(+f.updatedAt||0)>1e12)).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.createdAt||0)-(b.createdAt||0)).map(f=>{ const [y,m,d]=(f.date||"").split("-");
    return {id:f.id,fromSheet:(+f.createdAt||0)<1e12,date:d?`${d}.${m}.${y}`:"",object:f.kind==="Взаємозалік"?"":(Bk.sites.get(f.site)?.raw??Bk.sites.get(f.site)?.name??""),type:f.type==="in"?"приход":"расход",people:person(f.worker)?.name||"",payer:own(f.owner),amount:f.amount,kind:KIND_S[f.kind]||"",comment:f.note||""} });
  return {rows,deleted:delCol};
}

// ✅ Справи на сьогодні: вручну, з виконавцем, часом «до» або «з–до» і галочкою
const dISO=(d=new Date())=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const tasksNow=()=>isDuo()?(S.tasksD||[]):(S.tasksT||[]);
function taskTime(t){ return t.from&&t.to?`${t.from}–${t.to}`:t.to?"до "+t.to:t.from?"з "+t.from:"" }
function taskLate(t){ if(t.done) return false; const td=dISO(); if(t.date<td) return true; if(t.date>td) return false;
  const n=new Date(), hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"); return !!(t.to&&t.to<hm) }
function tasksHTML(){ const td=dISO(), tm=dISO(new Date(Date.now()+864e5)), me=meId();
  const all=tasksNow(), cut=Date.now()-36e5*12;
  const l=all.filter(t=>t.date<=td&&(!t.done||(t.date===td||(+t.doneAt||0)>cut))).sort((a,b)=>(a.done-b.done)||(taskLate(b)-taskLate(a))||String(a.to||a.from||"99").localeCompare(String(b.to||b.from||"99"))||(+a.createdAt||0)-(+b.createdAt||0));
  const lTm=all.filter(t=>t.date===tm).sort((a,b)=>(a.done-b.done)||String(a.to||a.from||"99").localeCompare(String(b.to||b.from||"99"))), nOpen=l.filter(t=>!t.done).length;
  const row=t=>{ const p=person(t.who), late=taskLate(t), tt=taskTime(t);
    return `<div class="card" data-task="${t.id}" style="gap:10px;${t.done?"opacity:.55;":""}${late?"border-color:#ef4444;":""}">
      <input type="checkbox" data-tdone="${t.id}" ${t.done?"checked":""} style="width:24px;height:24px;flex:none" ${S.canWrite?"":"disabled"}>
      <div class="main"><div class="t" style="${t.done?"text-decoration:line-through":""}">${esc(t.title)}</div>
        <div class="m">${tt?`<span style="color:${late?"#ef4444":"var(--accent)"}">${late?"⏰ ":"🕒 "}${tt}</span>`:""}${t.date<td&&!t.done?` <span style="color:#ef4444">· з ${fmtDay(t.date)}</span>`:""}${site(t.site)?` · 🏗️ ${esc(site(t.site).name)}`:""}${t.done&&t.doneByName?` · ✅ ${esc(uaName(t.doneByName))}`:""}</div>${t.tools?`<div class="m" style="font-size:12.5px">🧰 ${esc(t.tools.replace(/\n+/g,", "))}${t.moved?" · 🚚 переїхав ✓":""}</div>`:""}${t.mats?`<div class="m" style="font-size:12.5px">🧱 ${esc(t.mats.replace(/\n+/g,", "))}${t.done?" · привезено ✓":""}</div>`:""}${t.done&&t.tools&&!t.moved&&S.canWrite&&!isDuo()?`<button class="btn ghost sm" data-tmove="${t.id}" style="margin-top:4px">🚚 Записати переїзд інструменту</button>`:""}</div>
      ${p?`<span style="font-size:12.5px;padding:2px 8px;border-radius:10px;border:1px solid var(--line,#2a2f38);white-space:nowrap">${t.who===me?"✋ я":"👤 "+esc(uaName(p.name)||p.name)}</span>`:(!t.done&&S.canWrite&&me?`<button class="btn ghost" data-ttake="${t.id}" style="padding:4px 8px;font-size:12.5px;white-space:nowrap">✋ Візьму</button>`:"")}
    </div>` };
  return `<div class="section-t" style="display:flex;align-items:center">✅ Справи на сьогодні<span class="count">${nOpen||""}</span>${S.canWrite?`<button class="btn ghost" id="tkAdd" style="margin-left:auto;padding:4px 10px">＋ Справа</button>`:""}</div>
    <div class="list" style="margin-bottom:10px">${l.length?l.map(row).join(""):`<div class="empty" style="padding:8px">Немає справ на сьогодні</div>`}
    ${lTm.length?`<div class="m" style="padding:6px 2px 2px;font-weight:600">📅 Завтра</div>`+lTm.map(row).join(""):""}</div>` }
function tasksBind(){ const v=$("#view");

    if(ok&&d&&t?.tools&&!t.moved&&t.site&&!isDuo()) taskMove(t) });
  v.querySelectorAll("[data-tmove]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const t=tasksNow().find(x=>x.id===b.dataset.tmove); if(t) taskMove(t) });
  v.querySelectorAll("[data-ttake]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); write(db=>db.collection(R("tasks")).doc(b.dataset.ttake).update({who:meId(),updatedAt:Date.now()})).then(ok=>ok&&toast("✋ Справа ваша")) });

// 🚚 справа «привезти інструмент» виконана → переміщення на об'єкт (звичне вікно перевірки: що саме, скільки, звідки)
// 🧰 справа з інструментом ↔ «📝 Потрібно» об'єкта: позиції з міткою tid (одна справа — свої рядки)
const tkToolLines=txt=>String(txt||"").split(/\n|,|;/).map(x=>x.trim()).filter(Boolean).map(line=>{ const m=line.match(/^(.*?)[\s,—–-]*(?:[xх×]\s*)?(\d+)\s*(?:шт\.?|штук[и]?)?\s*$/i); return m&&m[1].trim()?{name:m[1].trim(),qty:+m[2]}:{name:line,qty:1} });
const tkMatLines=txt=>String(txt||"").split(/\n|;/).map(x=>x.trim()).filter(Boolean).map(line=>{ const m=line.match(/^(.*?)[\s,—–-]+(\d+(?:[.,]\d+)?)\s*([a-zа-яіїєґ²³.]*)\s*$/i);
  if(!m||!m[1].trim()) return {name:line,qty:1,unit:"шт",kind:"material"}; const u=(m[3]||"шт").replace(/\.$/,"").toLowerCase(); return {name:m[1].trim(),qty:+m[2].replace(",","."),unit:/^міш/.test(u)?"мішок":/^шт|^штук/.test(u)||!u?"шт":u,qtySet:true,kind:"material"} });
async function taskNeedsSync(tid,d,oldSite){ if(isDuo()) return; const ids=[...new Set([oldSite,d?.site].filter(Boolean))]; if(!ids.length) return;
  await write(async db=>{ for(const sid of ids){ const st=S.sites.get(sid); if(!st) continue; let l=(st.needs||[]).map(({_here,...x})=>({...x}));
    const keep=l.filter(n=>n.tid===tid&&n.done), kT=keep.some(n=>n.kind!=="material"), kM=keep.some(n=>n.kind==="material"); l=l.filter(n=>n.tid!==tid||n.done);
    const ex={tid,req:1,...(d?.who?{who:d.who}:{}),note:"зі справи"};
    if(d&&d.site===sid&&d.tools&&!d.moved&&!kT) l.push(...tkToolLines(d.tools).map(x=>({...x,kind:"tool",...ex})));
    if(d&&d.site===sid&&d.mats&&!kM) l.push(...tkMatLines(d.mats).map(x=>({...x,...ex,...(d.done?{done:true,got:x.qty}:{})})));
    if(JSON.stringify(l)!==JSON.stringify((st.needs||[]).map(({_here,...x})=>x))){ await db.doc("sites/"+sid).update({needs:l}); st.needs=l } } }) }
// справи з інструментом, створені до зв'язку з «Потрібно», — доносимо один раз
function taskNeedsFix(){ if(S.canWrite===false||!S.sites?.size) return; S._tnf=S._tnf||{};
  for(const t of S.tasksT||[]){ if(!(t.tools||t.mats)||!t.site||t.done||S._tnf[t.id]) continue; S._tnf[t.id]=1; const st=S.sites.get(t.site); if(st&&!(st.needs||[]).some(n=>n.tid===t.id)) taskNeedsSync(t.id,t,t.site) } }
function taskMove(t){ if(!site(t.site)){ toast("Об'єкт справи не знайдено"); return }
  const lines=String(t.tools).split(/\n|,|;/).map(x=>x.trim()).filter(Boolean).map(x=>/\d\s*(шт|од)?\.?$/.test(x)?x:x+" 1 шт").join("\n");
  photoFlow({mode:"move",text:true,auto:true,noTask:true,to:t.site,listText:lines,onDone:async n=>{ if(!n) return; await write(db=>db.collection(R("tasks")).doc(t.id).update({moved:true,movedAt:Date.now()}));
    const st=S.sites.get(t.site); if(st?.needs?.some(n=>n.tid===t.id&&!n.done)){ const l=st.needs.map(({_here,...n})=>n.tid===t.id?{...n,done:true}:n); await write(db=>db.doc("sites/"+st.id).update({needs:l})); st.needs=l } }}) }

function micStart(btn,field){

    field.value=base+fin+interim; field.dispatchEvent(new Event("input",{bubbles:true})) };

  if(/\.docx$/i.test(f.name)) return [{text:"Документ Word:\n"+await docxText(await f.arrayBuffer())}];
  if(/^image\//.test(f.type)) return [await shrinkImage(f,1800)];

  shTok=drvTok=c.accessToken; shExp=drvExp=Date.now()+50*60e3; return shTok; };
window.__fbList=async c=>{ const sn=await getDocs(collection(fs,px(c))); return sn.docs.map(d=>({id:d.id,...d.data()})) };
window.__fbSignOut=async()=>{ try{ localStorage.removeItem("oblikSnap") }catch(_){} try{ await window.cacheClear?.() }catch(_){} await signOut(auth); location.reload(); };

document.getElementById("loginBtn").onclick=async()=>{
  const p=new GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
  msg.textContent="";
  try{ await signInWithPopup(auth,p) }catch(e){ if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment") await signInWithRedirect(auth,p); else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request") msg.textContent="Не вдалося увійти: "+e.code; }
};
lo2.onclick=()=>window.__fbSignOut();
getRedirectResult(auth).catch(e=>{ msg.textContent="Не вдалося увійти: "+(e.code||e.message)+". Спробуйте відкрити посилання в Chrome (не з іконки) і увійти ще раз."; });

let started=false;
onAuthStateChanged(auth,async u=>{
  if(!u){ L.style.display="flex"; try{ localStorage.removeItem("oblikSnap") }catch(_){} try{ window.cacheClear?.() }catch(_){} document.body.classList.remove("snap"); document.getElementById("view").innerHTML=""; return; }
  const email=(u.email||"").toLowerCase();
  if(ALLOWED.length&&!ALLOWED.includes(email)){ L.style.display="flex"; msg.innerHTML="Пошта <b>"+email+"</b> не має доступу.<br>Попросіть Андрія додати її."; document.getElementById("loginBtn").style.display="none"; lo2.style.display=""; return; }
  L.style.display="none"; window.__fbEmail=email;
  if(started) return; started=true;
  try{ DEMO=DEMO_EMAILS.includes(email)||DEMO_HASHES.includes(await sha(email))||new URLSearchParams(location.search).has("demo") }catch(_){ DEMO=new URLSearchParams(location.search).has("demo") }
  window.__demo=DEMO;
  const name=u.displayName||email;
  const user={ id:async()=>u.uid, me:async()=>({name}), can:async()=>true };
  (DEMO?demoPrepare():Promise.resolve()).then(()=>window.__fbResolve([db,user]));
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
</script>
