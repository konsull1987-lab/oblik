<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Облік</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#16181d; --muted:#6b7280; --line:#e5e7eb;
  --accent:#0f766e; --accent-ink:#fff;
  --own:#1d4ed8; --own-bg:#dbeafe; --wrk:#c2410c; --wrk-bg:#ffedd5;
  --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --card:#191c22; --text:#eef0f3; --muted:#9aa1ad; --line:#2a2f38;
    --accent:#14b8a6; --accent-ink:#04201d;
    --own:#93c5fd; --own-bg:#1e2b4a; --wrk:#fdba74; --wrk-bg:#43260f;
    --warn:#fcd34d; --warn-bg:#3d2f0b; --bad:#fca5a5; --bad-bg:#451a1a; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 8px}
h1{font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h1 .sub{font-size:12px;font-weight:500;color:var(--muted);margin-left:auto}
main{padding:0 14px calc(90px + env(safe-area-inset-bottom))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.stat{background:var(--card);border-radius:10px;padding:6px 8px;text-align:center;cursor:pointer;border:2px solid transparent}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--muted)}
.stat.on{border-color:var(--accent)}
.stat.own b{color:var(--own)} .stat.wrk b{color:var(--wrk)} .stat.rep b{color:var(--warn)}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:60px;resize:vertical}
.search{display:flex;gap:6px}
.filters{display:flex;gap:6px;margin-top:6px}
.filters select{padding:7px 8px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.chip.x::after{content:" ✕"}
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.card{background:var(--card);border-radius:var(--radius);padding:11px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.card .main{flex:1;min-width:0}
.card .t{font-weight:600}
.card .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.tag.own{background:var(--own-bg);color:var(--own)}
.tag.wrk{background:var(--wrk-bg);color:var(--wrk)}
.tag.site{background:var(--bg);color:var(--text);font-weight:500}
.tag.rep{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.stripe{width:5px;align-self:stretch;border-radius:4px;background:var(--line)}
.stripe.own{background:var(--own)} .stripe.wrk{background:var(--wrk)}
.cb{width:22px;height:22px;margin-top:2px;accent-color:var(--accent)}
.inv{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:9px 0 8px;font:inherit;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.bulkbar{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:7;background:var(--text);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.bulkbar .sp{flex:1}
.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:inherit;border:1px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
body.dock .sheet{max-height:57vh}
#imgDock{position:fixed;top:0;left:0;right:0;height:42vh;z-index:30;background:#000;display:flex;flex-direction:column;border-bottom:2px solid var(--accent)}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:18px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .btn{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:6px 0 10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.hist{font-size:13px;border-top:1px solid var(--line);padding:8px 0}
.hist .when{color:var(--muted);font-size:12px}
.section-t{font-size:13px;color:var(--muted);font-weight:600;margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.03em}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:8px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
#segM button{font-size:12.5px;padding:8px 2px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font:inherit;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:30;font-size:14px}
.in{color:#15803d}.out{color:var(--bad)}
@media (prefers-color-scheme: dark){.in{color:#4ade80}}
.acc{color:#7c3aed}.tag.acc{background:#ede9fe;color:#6d28d9}
@media (prefers-color-scheme: dark){.acc{color:#c4b5fd}.tag.acc{background:#2e1f5e;color:#c4b5fd}}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.bal .stat b{font-size:15px}
.sum{display:flex;gap:10px;font-size:13px;margin:8px 2px;flex-wrap:wrap}
.sum b{font-variant-numeric:tabular-nums}
.tabs2{display:flex;gap:6px;margin-bottom:8px}
.tabs2{overflow-x:auto}.tabs2 button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px;font:inherit;font-size:13px;color:var(--muted)}
.tabs2 button.on{border-color:var(--accent);color:var(--text);font-weight:600}
.daysep{font-size:12px;color:var(--muted);font-weight:600;margin:10px 2px 4px}
.count{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
#printArea{display:none}
/* ---- Общак на двох: теплий бурштиновий відтінок замість бірюзового ---- */
body.duo{--accent:#b45309;--accent-ink:#fff;--bg:#faf6ee}
@media (prefers-color-scheme: dark){ body.duo{--accent:#f59e0b;--accent-ink:#2a1a03;--bg:#14110b} }
body.duo header{box-shadow:inset 0 4px 0 var(--accent)}
body.duo .bal .stat{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
body.duo .card{border-left:3px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.seg [data-base].on{background:var(--accent);color:var(--accent-ink)}
.basebadge{display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
@media print{
  @page{size:A4;margin:14mm 16mm}
  body{background:#fff!important;color:#000!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .doc{font:10.5pt/1.35 Arial,Helvetica,sans-serif;color:#000}
  .doc h3{text-align:center;font-size:12pt;margin:18px 0 12px}
  .doc table{width:100%;border-collapse:collapse}
  .doc .hdr td{vertical-align:top;padding:3px 6px}.doc .hdr .lbl{width:120px;font-weight:bold}
  .doc .items th{background:#ccc;border:1px solid #000;padding:2px 4px;font-size:9.5pt}
  .doc .items td{border:1px solid #000;padding:2px 4px}
  .doc .items .tot td{border:none}.doc .items .tot td.box{border:1px solid #000}
  .doc .r{text-align:right}.doc .b{font-weight:bold}
  .doc .two td{width:50%;vertical-align:top;padding:4px 8px 4px 0}
  .doc .acti td{padding:3px 0}.doc .acti .sm{font-size:8.5pt;text-align:center}
  .doc .line{display:inline-block;width:170px;border-bottom:1px solid #000;height:14px}
  .doc .sign{text-align:right;margin-top:30px}
  .doc.ct{font-size:10pt;text-align:justify}.doc.ct p{margin:3px 0}.doc.ct h4{text-align:center;font-size:10pt;margin:10px 0 4px}
  .doc .req{page-break-inside:avoid;break-inside:avoid}.doc.ct h4{break-after:avoid}.doc .req td{font-size:9.5pt;text-align:left}.doc .pb{page-break-before:always}
}
button.card{color:var(--text);background:var(--card);font:inherit}
#nav{display:flex;flex-wrap:nowrap}#nav button{flex:1 1 0;min-width:0;font-size:11px;padding-left:2px;padding-right:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.micBtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font-size:18px;padding:6px 9px;margin-left:6px;cursor:pointer;flex:0 0 auto}
.micBtn.area{position:absolute;right:6px;bottom:6px;margin:0}
.micBtn.rec{background:#e11d48;color:#fff;border-color:#e11d48;animation:micp 1s infinite}
@keyframes micp{50%{opacity:.6}}
</style>
</head>
<body>
<header>
  <h1>🧰 Облік <span class="sub" id="who"></span><button id="searchBtn" class="btn ghost sm" style="padding:4px 10px;margin-left:auto" title="Пошук">🔍</button><button id="menuBtn" class="btn ghost sm" style="padding:4px 10px">⋯</button></h1>
  <div id="banner"></div>
  <div id="headTools"></div>
</header>
<main id="view"></main>
<script>
// ⚡ миттєвий старт: показати останній знімок «Сьогодні», поки база й вхід ще піднімаються (1–3 с)
try{ const sn=JSON.parse(localStorage.getItem("oblikSnap")||"null"); if(sn&&sn.html&&Date.now()-sn.at<7*864e5){ document.getElementById("view").innerHTML=sn.html; document.body.classList.add("snap"); setTimeout(()=>{ if(document.body.classList.contains("snap")){ document.body.classList.remove("snap"); try{ window.render&&render() }catch(_){} } },8000) } }catch(_){}
</script>
<style>body.snap #view{opacity:.6;pointer-events:none}body.snap #view::before{content:"⏳ Оновлюю дані…";display:block;text-align:center;font-size:13px;color:var(--muted);padding:6px 0}</style>
<button class="fab" id="fab" aria-label="Додати">+</button>
<div id="bulk"></div>
<nav id="nav">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Сьогодні</button>
  <button data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19M7 15h3"/></svg>Гроші</button>
  <button data-tab="sites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-6h6v6"/></svg>Об'єкти</button>
  <button data-tab="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Інструмент</button>
  <button data-tab="people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3 0 4 1.5 4.6 4"/></svg>Люди</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Історія</button>
</nav>
<div id="modal"></div>
<div id="login" style="display:none;position:fixed;inset:0;z-index:50;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center">
  <div style="font-size:54px">🧰</div><h2 style="margin:0">Облік</h2>
  <div id="loginMsg" style="color:var(--muted);max-width:320px">Увійдіть своїм Google-акаунтом</div>
  <button class="btn" id="loginBtn" style="min-width:220px">Увійти через Google</button>
  <div style="color:var(--muted);font-size:12.5px;max-width:320px">Якщо посилання відкрилось у Telegram, Viber чи іншому месенджері — натисніть ⋯ і виберіть «Відкрити в Safari / Chrome», там вхід через Google працює.</div>
  <button class="btn ghost" id="logoutBtn2" style="display:none">Вийти й увійти іншим акаунтом</button>
</div>

<script>
window.fbReady=new Promise(r=>window.__fbResolve=r);
// ---------- Категорії ----------
const CATS = {
  "Електроінструмент": [
    "Шуруповерти акумуляторні","Дрилі мережеві","Перфоратори","Відбійні молотки","Болгарки (КШМ)",
    "Штроборізи","Пили дискові (циркулярні)","Пили торцювальні","Лобзики","Шабельні пили","Ланцюгові пили",
    "Фрезери","Рубанки","Шліфмашини (ексцентрикові, стрічкові)","Шліфмашини по бетону / жирафи",
    "Міксери будівельні","Гайковерти / імпакти","Реноватори (МФІ)","Фени будівельні",
    "Плиткорізи електричні","Алмазне свердління","Вібратори для бетону","Пилососи будівельні",
    "Акумулятори та зарядки"
  ],
  "Обладнання": [
    "Генератори","Компресори","Зварювальні апарати","Бетонозмішувачі","Віброплити / трамбовки",
    "Мийки високого тиску","Обігрівачі / теплові гармати","Фарбопульти / агрегати","Подовжувачі та кабелі",
    "Прожектори","Драбини та стрем'янки","Риштування / вишки"
  ],
  "Вимірювальний": [
    "Лазерні рівні / нівеліри","Рівні звичайні","Правила","Лазерні далекоміри","Рулетки",
    "Кутники","Детектори проводки / металу","Мультиметри та тестери","Вологоміри","Тепловізори"
  ],
  "Ручний інструмент": [
    "Молотки та кувалди","Ножівки","Ножиці по металу","Кельми та терки","Шпателі","Плиткорізи ручні",
    "Викрутки","Ключі та головки","Плоскогубці / кусачки","Ломи та монтажки","Струбцини",
    "Степлери","Пістолети для піни / герметику","Ножі","Лопати / граблі","Тачки","Інше ручне"
  ],
  "Інше": ["Інше"]
};
const CAT_GROUP = {}; for (const g in CATS) for (const c of CATS[g]) CAT_GROUP[c]=g;
const STATUS = {ok:"Справний", repair:"У ремонті", broken:"Зламаний", lost:"Втрачений"};

// ---------- Стан ----------
const S = {
  tools:new Map(), people:new Map(), sites:new Map(), moves:[], fin:new Map(), fops:new Map(), clients:new Map(), docs:new Map(), contracts:new Map(),
  mtab:"journal", mSite:"", mOwner:"", mKind:"", mMonth:"", mType:"",
  tab:"today", q:"", holderType:"all", cat:"", site:"", person:"", status:"",
  select:false, selected:new Set(), loaded:{tools:false,people:false,sites:false,moves:false,fin:false,fops:false,clients:false,docs:false,contracts:false},
  canWrite:true, db:null, user:null, uid:null, offline:false,
  base:(()=>{try{return localStorage.getItem("oblikBase")==="duo"?"duo":"trio"}catch(_){return "trio"}})(),
  B:{trio:{fin:new Map(),sites:new Map()},duo:{fin:new Map(),sites:new Map()}}, duoOk:false, duoLoaded:false
};
// ---- Дві бази: «на трьох» (fin, sites) і «общак на двох» (duo_fin, duo_sites) ----
const DUO_OWNERS=["andriy","serhiy"];
const isDuo=()=>S.base==="duo"&&S.duoOk;
// 🧪 Тестовий об'єкт (пісочниця): його платежі не входять у жодні підсумки, баланси, борги й аналітику
const isTestSite=x=>!!x&&(x.test===true||(x.test!==false&&/^\s*(тест|test|пісочниця)(\s|$)/i.test(x.name||"")));
function testFilter(k){ const b=S.B[k]; if(!b.finRaw) b.finRaw=b.fin; const t=new Set([...b.sites.values()].filter(isTestSite).map(x=>x.id)); b.testIds=t; b.fin=t.size?new Map([...b.finRaw].filter(([,f])=>!t.has(f.site))):b.finRaw }
function applyBase(){ testFilter("trio"); if(S.B.duo.sites) testFilter("duo"); const k=isDuo()?"duo":"trio"; S.fin=S.B[k].fin; S.finAll=S.B[k].finRaw||S.B[k].fin; S.sites=S.B[k].sites; }
const R=c=>isDuo()&&(c==="fin"||c==="sites"||c==="del"||c==="log"||c==="files"||c==="offers"||c==="photos"||c==="tasks")?"duo_"+c:c;
// ---- Журнал змін: кожне додавання / зміна / видалення зберігається повністю (як було → як стало) ----
const LOGGED=["fin","tools","sites","people","docs","contracts","fops","clients"];
const MOVE_KEYS=new Set(["holder","site","qty","updatedAt"]);
const localOf=(c,id)=>{ const m=S[c]; const v=m&&m.get?m.get(id):null; if(!v) return null; const {id:_,...r}=v; return JSON.parse(JSON.stringify(r)) };
async function logChange(db,c,id,op,before,after){
  if(c==="tools"&&op==="edit"&&after&&before&&Object.keys(after).every(k=>MOVE_KEYS.has(k)||JSON.stringify(after[k])===JSON.stringify(before[k]))) return; // переміщення — у своїй історії
  let byName=""; try{byName=(await S.user?.me?.())?.name||""}catch(_){}
  try{ await db.collection(R("log")).add({at:Date.now(),by:S.uid||"",byName,op,col:c,id,before:before||null,after:after||null}) }catch(e){ console.warn("log",e) }
}
const routed=db=>({
  collection:p=>{ const c=db.collection(R(p)); if(!LOGGED.includes(p)) return c;
    return {...c,add:async d=>{ const r=await c.add(d); await logChange(db,p,r.id,"add",null,JSON.parse(JSON.stringify(d))); return r },
      doc:id=>{ const d=c.doc(id); return wrapLogged(db,p,d) }} },

function filteredTools(){

function personOptions(sel,emptyLabel){
  const all=[...S.people.values()].sort(byName);
  let h=`<option value="">${emptyLabel}</option>`;
  for(const [role,label] of [["owner","👤 Власники"],["worker","🔧 Виконавці"]]){
    const l=all.filter(p=>p.role===role); if(!l.length)continue;
    h+=`<optgroup label="${label}">`+l.filter(p=>p.active!==false||sel===p.id).map(p=>`<option value="${p.id}" ${sel===p.id?"selected":""}>${p.crew?"👥 ":""}${esc(p.name)}</option>`).join("")+`</optgroup>`;
  }
  return h;
}

function renderTools(){

    <div class="stats">${st("all","",sq(all),"Усього")}${st("owner","own",nOwn,"У власників")}${st("worker","wrk",nW,"У виконавців")}${st("repair","rep",nR,"Ремонт/інше")}${nL?st("lost","bad",nL,"❌ Втрачено"):""}</div>

    <div class="filters">

  const tcard=t=>{ const r=roleOf(t); return `<div class="card" data-tool="${t.id}">
      ${S.select?`<input type="checkbox" class="cb" ${S.selected.has(t.id)?"checked":""} tabindex="-1">`:`<div class="stripe ${r==="owner"?"own":r==="worker"?"wrk":""}"></div>`}
      <div class="main"><div class="t">${esc(t.name)} ${t.inv?`<span class="inv">#${esc(t.inv)}</span>`:""}</div>
      <div class="m">${esc(t.cat||"")}${t.brand||t.model?" · "+esc([t.brand,t.model].filter(Boolean).join(" ")):""}</div>
      <div class="tags">${holderTag(t.holder)}${siteTag(t.site)}${statusTag(t.status)}</div></div>${qtyOf(t)>1?`<span class="count">${qtyOf(t)} шт</span>`:""}</div>`; };
  const flat=(S.q||"").trim()||S.site||S.person||S.cat||S.holderType!=="all"||S.toolFlat;
  const modeBtn=`<div style="display:flex;justify-content:flex-end;margin:-2px 0 6px"><button class="btn ghost sm" id="tlMode">${S.toolFlat?"🗂 Групами":"☰ Одним списком"}</button></div>`;
  if(flat){ let h=((S.q||"").trim()||S.site||S.person||S.cat||S.holderType!=="all"?"":modeBtn)+`<div class="section-t" style="display:flex">Знайдено<span class="count">${list.length}</span></div><div class="list">`+list.map(tcard).join("")+`</div>`;
    $("#view").innerHTML=h; $("#tlMode")?.addEventListener("click",()=>{ S.toolFlat=!S.toolFlat; renderTools() }); return }
  // 🗂 групами: склад / об'єкт / бригада / людина — відкривається по натисканню
  S.toolOpen=S.toolOpen||new Set(); const G=new Map();

    const k=p?(p.crew?"c:":"p:")+p.id:s2?(s2.type==="warehouse"?"w:":"s:")+s2.id:"none"; if(!G.has(k)) G.set(k,[]); G.get(k).push(t) }
  const meta=k=>{ if(k==="none") return {ic:"❓",nm:"Без місця",ord:9}; const [ty,id]=k.split(":");
    if(ty==="w") return {ic:"🏬",nm:site(id)?.name||"Склад",ord:1}; if(ty==="s") return {ic:"🏗️",nm:site(id)?.name||"Об'єкт",ord:2,sub:site(id)?.active===false?"архів":""};
    const p=person(id); return {ic:ty==="c"?"👥":p?.role==="owner"?"👤":"🔧",nm:p?.name||"—",ord:ty==="c"?3:p?.role==="owner"?4:5,sub:site(G.get(k)[0]?.site)?.name?("на: "+[...new Set(G.get(k).map(t=>site(t.site)?.name).filter(Boolean))].slice(0,2).join(", ")):""} };
  const SEC={1:"🏬 Склади",2:"🏗️ Об'єкти",3:"👥 Бригади",4:"👤 Власники",5:"🔧 Виконавці",9:"Інше"};
  const keys=[...G.keys()].map(k=>({k,...meta(k),n:G.get(k).reduce((a,t)=>a+qtyOf(t),0)})).sort((a,b)=>a.ord-b.ord||b.n-a.n||a.nm.localeCompare(b.nm,"uk"));
  let h=modeBtn, last=0;
  for(const g of keys){ if(g.ord!==last){ h+=`<div class="section-t">${SEC[g.ord]}</div>`; last=g.ord } const op=S.toolOpen.has(g.k);

  $("#view").innerHTML=h;
  $("#tlMode")?.addEventListener("click",()=>{ S.toolFlat=!S.toolFlat; renderTools() });
  $("#view").querySelectorAll("[data-tg]").forEach(el=>el.addEventListener("click",e=>{ if(e.target.closest("[data-tool]")) return; const k=el.dataset.tg; S.toolOpen.has(k)?S.toolOpen.delete(k):S.toolOpen.add(k); renderTools() }));
}

// ✨ Автопошук тендерів: стрічка змін Prozorro → Полтавська обл. → деталі → фільтр (роботи, 40 тис–3 млн, ≤60 км, подача ще триває)
const TZ_RULES={min:40000,max:3000000,km:60,days:2};
const TZ_GOOD=["ремонт","реконстр","капітальн","поточн","будівниц","покрівл","дах","фасад","утеплен","термомодерн","вікон","вікна","двер","електр","освітлен","сантех","водопост","каналіз","опален","плитк","підлог","стел","оздобл","укрит","бомбосхов","огорож","благоустр","тротуар","ганок","пандус","санвузл","туалет","штукатур","фарбув","гідроізол"];
const TZ_BAD=["доріг","дорожн","асфальт","мост","газопровод","теплотрас","проєктн","проектн","технагляд","технічний нагляд","експертиз","ліфт","свердловин"];
function tzScore(t){ const txt=normW([t.title,...(t.items||[]).map(i=>i.d)].join(" ")); const good=TZ_GOOD.filter(w=>txt.includes(w)), bad=TZ_BAD.filter(w=>txt.includes(w));
  return {score:bad.length&&!good.length?1:good.length>=2&&!bad.length?3:good.length?2:1, why:good.slice(0,4).join(", ")+(bad.length?" · ⚠️ "+bad.slice(0,2).join(", "):"")} }
async function loadCfg(){ if(S.cfg) return S.cfg; try{ const x=await S.db.doc("meta/config").get(); S.cfg=x.exists?x.data():{} }catch(_){ S.cfg={} } return S.cfg }
function pzSetup(){ const raw="https://github.com/konsull1987-lab/oblik/blob/main/prozorro-proxy.gs";
  openSheet(`<h2>⚙️ Підключити автопошук тендерів</h2>

      <li>Скопіюйте <b>URL вебзастосунку</b> (закінчується на /exec) і вставте сюди.</li></ol>
    <button class="btn ghost" id="pzCode" style="width:100%;margin-bottom:8px">📋 Скопіювати код посередника</button>
    <div class="field"><label>URL вебзастосунку</label><input id="pzUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.cfg?.pzProxy||"")}"></div>
    <div class="actions"><button class="btn ghost" data-close>Скасувати</button><button class="btn" id="pzOk">Зберегти й перевірити</button></div>`);
  $("#pzCode").onclick=async()=>{ try{ const t=await (await fetch("prozorro-proxy.gs",{cache:"no-cache"})).text(); await navigator.clipboard.writeText(t); toast("Код скопійовано") }catch(_){ window.open(raw,"_blank") } };
  $("#pzOk").onclick=async()=>{ const u=$("#pzUrl").value.trim(); if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)){ toast("Вставте URL, що починається з https://script.google.com/"); return }
    const b=$("#pzOk"); b.disabled=true; b.textContent="⏳ Перевіряю…";
    try{ const j=await (await fetch(u)).json(); if(!j.ok&&!j.hint) throw new Error(j.error||"незрозуміла відповідь");
      await loadCfg(); const c={...S.cfg,pzProxy:u}; if(await write(db=>db.doc("meta/config").set(c))){ S.cfg=c; closeSheet(); toast("✅ Підключено — шукаю тендери"); tzScan({force:true}); renderTenders() } }
    catch(e){ b.disabled=false; b.textContent="Зберегти й перевірити"; toast("Не відповідає: "+String(e?.message||e).slice(0,60)+". Перевірте «Доступ: Усі»") } } }
async function loadSugg(force){ if(S.tzs&&!force) return; try{ const a=await S.db.collection("tzsugg").get(); S.tzs=new Map(a.docs.map(d=>[d.id,{id:d.id,...d.data()}])) }catch(_){ S.tzs=S.tzs||new Map() } }
const suggNew=()=>[...(S.tzs||new Map()).values()].filter(x=>x.state==="new"&&(!x.tEnd||tzDays(x.tEnd)>=0));
async function tzScan(opts){ opts=opts||{}; if(S.tzScanning) return; if(!S.canWrite) return;
  try{ const lk=+localStorage.getItem("tzScanLock")||0; if(!opts.force&&Date.now()-lk<5*60e3) return; localStorage.setItem("tzScanLock",String(Date.now())) }catch(_){}
  S.tzScanning={pages:0,found:0,checked:0}; const upd=()=>{ if(S.tab==="sites"&&S.sitesMode==="tz"&&S.tzMode==="sugg") renderTenders() };
  try{ await Promise.all([loadTenders(),loadSugg()]); let meta={}; try{ const x=await S.db.doc("meta/tzscan").get(); if(x.exists) meta=x.data() }catch(_){}
    if(!opts.force&&meta.at&&Date.now()-meta.at<3*3600e3){ S.tzScanning=null; return }
    let offset=meta.offset||String(Math.floor(Date.now()/1000-3*86400)); const t0=Date.now(), cand=new Map(), full=new Map();
    await loadCfg(); if(!S.cfg.pzProxy){ S.tzScanning=null; if(opts.force) pzSetup(); render(); return }
    if(S.cfg.pzProxy){ const j=await (await fetch(`${S.cfg.pzProxy}?a=scan&offset=${encodeURIComponent(offset)}`)).json(); if(j.error) throw new Error(j.error);
      S.tzScanning.pages=j.pages||0; for(const d of j.tenders||[]){ cand.set(d.id,1); full.set(d.id,d) } S.tzScanning.found=cand.size; if(j.offset) offset=j.offset }
    else for(let pg=0;pg<60&&Date.now()-t0<150e3;pg++){
      const r=await fetch(`${PZ_API}/tenders?limit=1000&opt_fields=status,procuringEntity&offset=${encodeURIComponent(offset)}`); if(!r.ok) throw new Error("Prozorro "+r.status);
      const j=await r.json(); S.tzScanning.pages++; for(const d of j.data||[]){ const reg=String(d.procuringEntity?.address?.region||""); if(!/полтав/i.test(reg)) continue; if(d.status&&d.status!=="active.tendering") continue; cand.set(d.id,1) }
      S.tzScanning.found=cand.size; upd(); if(!(j.data||[]).length||!j.next_page?.offset||j.next_page.offset===offset) break; offset=j.next_page.offset }
    const known=new Set([...S.tz.values()].map(t=>t.pid).filter(Boolean)); let added=0;
    for(const id of cand.keys()){ if(known.has(id)||S.tzs.has(id)) continue; S.tzScanning.checked++; upd();
      let d=full.get(id); if(!d) try{ const r=await fetch(`${PZ_API}/tenders/${id}`); if(!r.ok) continue; d=(await r.json()).data }catch(_){ continue }
      if(d.status!=="active.tendering") continue; const works=d.mainProcurementCategory==="works"||(d.items||[]).some(i=>String(i.classification?.id||"").startsWith("45"));
      const t=tzFromApi(d); if(!works||t.value<TZ_RULES.min||t.value>TZ_RULES.max) continue; if(t.tEnd&&tzDays(t.tEnd)<TZ_RULES.days) continue;
      if(t.locality){ const g=await tzGeo(t.locality); t.km=tzKm(g); if(t.km!=null&&t.km>TZ_RULES.km) continue }
      const sc=tzScore(t); const data={pid:t.pid,tid:t.tid,title:t.title,buyer:t.buyer,locality:t.locality,km:t.km??null,value:t.value,tEnd:t.tEnd,method:t.method,score:sc.score,why:sc.why,state:"new",at:Date.now()};
      if(await write(db=>db.doc("tzsugg/"+id).set(data))){ S.tzs.set(id,{id,...data}); added++ } }
    await write(db=>db.doc("meta/tzscan").set({offset,at:Date.now()}));
    S.tzScanning=null; if(added&&notifCfg().tz&&!opts.force) notify(`✨ Нові тендери: ${added}`,"Відкрийте «Тендери → ✨ Нові»","tz"); else if(opts.force||added) toast(added?`✨ Нових тендерів: ${added}`:"Нових підходящих тендерів немає"); render();
  }catch(e){ S.tzScanning=null; if(opts.force) toast("Пошук не вдався: "+String(e?.message||e).slice(0,70)); render() } }
async function suggAdd(x){ toast("⏳ Додаю тендер…"); try{ const d=await tzFetch(x.pid); d.km=x.km; const data={...d,fop:S.tzLastFop||"",stage:"work",createdAt:Date.now(),updatedAt:Date.now(),checks:{},note:"",by:window.__fbEmail||""}; let id="";
  if(await write(async db=>{ const r=await db.collection("tenders").add(data); id=r.id; await db.doc("tzsugg/"+x.id).update({state:"added"}) })&&id){ S.tz.set(id,{id,...data}); x.state="added"; renderTenders(); tzView(S.tz.get(id)) } }catch(e){ toast("Не вдалося: "+String(e?.message||e).slice(0,60)) } }
const tzDays=iso=>{ if(!iso) return null; return Math.ceil((new Date(iso).getTime()-Date.now())/864e5) };
const tzWhen=iso=>{ if(!iso) return ""; const d=new Date(iso); return fmtDay(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"))+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0") };
const tzLeft=iso=>{ const d=tzDays(iso); if(d==null) return ""; return d<0?`<span style="color:var(--muted)">минуло</span>`:d===0?`<b style="color:var(--red,#e5534b)">сьогодні!</b>`:`<b style="color:${d<=3?"var(--red,#e5534b)":d<=7?"var(--accent)":"inherit"}">${d} дн.</b>` };
const tzLoc=s=>String(s||"").replace(/^(м\.|с\.|смт\.?|сел\.|село|місто)\s*/i,"").trim();
async function tzGeo(loc){ const k="geo:"+loc; try{ const c=localStorage.getItem(k); if(c) return JSON.parse(c) }catch(_){}
  try{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ua&accept-language=uk&q=${encodeURIComponent(loc+", Полтавська область")}`); const j=await r.json();
    const g=j[0]?{lat:+j[0].lat,lon:+j[0].lon}:null; try{ localStorage.setItem(k,JSON.stringify(g)) }catch(_){} return g }catch(_){ return null } }
function tzKm(g){ if(!g) return null; const R=6371,a=49.5883,b=34.5514,toR=x=>x*Math.PI/180; const dLa=toR(g.lat-a),dLo=toR(g.lon-b);
  const h=Math.sin(dLa/2)**2+Math.cos(toR(a))*Math.cos(toR(g.lat))*Math.sin(dLo/2)**2; return Math.round(2*R*Math.asin(Math.sqrt(h))) }
// дані тендера з Prozorro (якщо в посиланні є внутрішній id) — інакше через ШІ з пошуком
async function tzFetch(input){ const s=String(input||"").trim(), hex=(s.match(/[0-9a-f]{32}/i)||[])[0], uaid=(s.match(/UA-\d{4}-\d{2}-\d{2}-\d{6}-[a-z]/i)||[])[0];
  if(hex){ await loadCfg(); const r=await fetch(S.cfg.pzProxy?`${S.cfg.pzProxy}?a=t&id=${hex}`:`${PZ_API}/tenders/${hex}`); if(!r.ok) throw new Error("Prozorro: "+r.status); const d=(await r.json()).data; if(!d) throw new Error("Prozorro: немає даних"); return tzFromApi(d) }

  const out=[]; const seen=new Set(); for(const arr of [...Object.values(g),...Object.values(byName)]) if(arr.length>1){ const key=arr.map(x=>x.id).sort().join(); if(!seen.has(key)){ seen.add(key); out.push(arr) } } return out }
async function mergeFops(arr){ const score=f=>Object.values(f).filter(v=>v!==""&&v!=null).length; const keep=[...arr].sort((a,b)=>score(b)-score(a))[0], drop=arr.filter(f=>f.id!==keep.id);
  if(!confirm(`Об'єднати ${arr.length} записи «${keep.name}» в один?\nУсі документи, рахунки, договори й тендери перейдуть на нього.`)) return;
  const fill={}; for(const d of drop) for(const [k,v] of Object.entries(d)) if(k!=="id"&&v!==""&&v!=null&&(keep[k]===""||keep[k]==null)) fill[k]=v;
  // правильний український варіант назви (Козирєв, а не Козырев)
  const ua=n=>(/[єії]/i.test(n)?2:0)-(/[ыэё]/i.test(n)?3:0); const bestName=arr.map(f=>String(f.name||"")).sort((x,y)=>ua(y)-ua(x))[0]; if(bestName&&bestName!==keep.name) fill.name=bestName;
  await loadTenders(); let offs=[]; try{ const sn=await S.db.collection(R("offers")).get(); offs=sn.docs.map(d=>({id:d.id,...d.data()})) }catch(_){}
  const ids=new Set(drop.map(d=>d.id));
  await write(async db=>{ if(Object.keys(fill).length){ await db.doc("fops/"+keep.id).update(fill); Object.assign(keep,fill) }
    for(const x of S.docs.values()) if(ids.has(x.fop)){ await db.doc("docs/"+x.id).update({fop:keep.id}); x.fop=keep.id }
    for(const x of S.contracts.values()) if(ids.has(x.fop)){ await db.doc("contracts/"+x.id).update({fop:keep.id}); x.fop=keep.id }
    for(const x of S.fd.values()) if(ids.has(x.fop)){ await db.doc("firmdocs/"+x.id).update({fop:keep.id}); x.fop=keep.id }
    for(const x of S.tz.values()) if(ids.has(x.fop)){ await db.doc("tenders/"+x.id).update({fop:keep.id}); x.fop=keep.id }
    for(const x of offs) if(ids.has(x.fop)) await db.doc(R("offers")+"/"+x.id).update({fop:keep.id});
    for(const d of drop){ await db.doc("fops/"+d.id).delete(); S.fops.delete(d.id) } });
  if(S.fdFop&&ids.has(S.fdFop)) S.fdFop=keep.id; toast("✅ Об'єднано"); renderTenders() }

    for(const [i,f] of (d.firmdocs||[]).entries()){ if([...S.fd.values()].some(x=>x.title===f.title)) continue; const fo=f.fop?fopBy(f.fop):null;

const SKIP_F=new Set(["updatedAt","createdAt","by","byName","pair","key","raw","order","items","view","short","orig"]);
function fmtVal(k,v){ if(v==null||v==="") return "—"; if(k==="amount"||k==="contract"||k==="total") return money(v); if(k==="owner"||k==="worker"||k==="holder") return person(v)?.name||v; if(k==="site") return site(v)?.name||v;
  if(k==="type") return {in:"прихід",out:"витрата",accrual:"нарахування"}[v]||v; if(typeof v==="boolean") return v?"так":"ні"; return String(v) }
// зрозумілий опис змін у списку «Потрібно» (замість [object Object])
function needsDiff(a,b){ a=Array.isArray(a)?a:[]; b=Array.isArray(b)?b:[]; const k=n=>normName(n?.name), A=new Map(a.map(n=>[k(n),n])), B=new Map(b.map(n=>[k(n),n])), out=[];
  const q=n=>`${+n.qty||1} ${n.kind==="material"?(n.unit||"шт"):"шт"}`;
  for(const [key,n] of B) if(!A.has(key)) out.push(`➕ додано: <b>${esc(n.name)}</b> — ${esc(q(n))}`);
  for(const [key,n] of A) if(!B.has(key)) out.push(`➖ прибрано: <s>${esc(n.name)}</s>`);
  for(const [key,n] of B){ const o=A.get(key); if(!o) continue; const ch=[];
    if((+o.qty||1)!==(+n.qty||1)||(o.unit||"")!==(n.unit||"")) ch.push(`кількість ${esc(q(o))} → <b>${esc(q(n))}</b>`);
    if((+o.got||0)!==(+n.got||0)) ch.push(`привезено ${+o.got||0} → <b>${+n.got||0}</b>`);
    if(!!o.done!==!!n.done) ch.push(n.done?"<b>✅ позначено «привезено»</b>":"знято позначку «привезено»");
    if(!!o.ordered!==!!n.ordered) ch.push(n.ordered?"<b>🛒 замовлено</b>":"знято «замовлено»");
    if((o.kind||"tool")!==(n.kind||"tool")) ch.push(n.kind==="material"?"тепер матеріал":"тепер інструмент");
    if(JSON.stringify(o.match||[])!==JSON.stringify(n.match||[])&&(n.match||[]).length>(o.match||[]).length) ch.push(`прив'язано до: ${esc((n.match||[]).filter(x=>!(o.match||[]).includes(x)).join(", "))}`);
    if(o.name!==n.name) ch.push(`назва: <s>${esc(o.name)}</s> → ${esc(n.name)}`);
    if(ch.length) out.push(`• ${esc(n.name)}: ${ch.join(", ")}`) }
  return out.length?out.map(x=>`<div class="m" style="font-size:13px">${x}</div>`).join(""):`<div class="m" style="color:var(--muted)">дрібні уточнення в списку «Потрібно»</div>` }
function fmtAny(k,v){ if(v&&typeof v==="object"){ if(Array.isArray(v)) return v.length+" поз."; return Object.entries(v).filter(([,x])=>x!=null&&typeof x!=="object").slice(0,4).map(([a,x])=>`${a}: ${x}`).join(", ")||"…" } return fmtVal(k,v) }
function logTitle(e){ const x=e.after||e.before||{}; if(e.col==="fin") return `${fmtVal("type",x.type)} ${money(x.amount)}${x.site?" · "+(site(x.site)?.name||""):""}`; return x.name||x.invNo||x.no||e.id }

// ---------- Модальні вікна ----------
// Вікна з історією: свайп «назад» (кнопка назад Android) повертає на попередній крок, а не закриває все.
// Перемальовування того самого вікна (пошук, галочки) крок не додає; перемикання вкладок об'єкта — додає.
const sheetStack=[]; let popIgnore=0;
const sheetKey=()=>{ const m=$("#modal"); return (m.querySelector(".sheet h2")?.textContent||"")+"|"+(m.querySelector("#segS button.on")?.dataset.v||"") };
function openSheet(html){ const m=$("#modal"), had=m.firstElementChild, oldKey=had?sheetKey():"";
  const tmp=document.createElement("div"); tmp.innerHTML=`<div class="overlay"><div class="sheet">${html}</div></div>`; const node=tmp.firstElementChild;
  const newKey=(node.querySelector(".sheet h2")?.textContent||"")+"|"+(node.querySelector("#segS button.on")?.dataset.v||"");
  if(had&&newKey!==oldKey){ sheetStack.push({node:had,onclick:m.onclick,onchange:m.onchange,oninput:m.oninput,scroll:had.querySelector(".sheet")?.scrollTop||0}); had.remove(); try{history.pushState({sheet:sheetStack.length+1},"")}catch(_){} }
  else if(!had){ try{history.pushState({sheet:1},"")}catch(_){} }
  if(had&&newKey===oldKey){ const sc=had.querySelector(".sheet")?.scrollTop||0; had.remove(); m.appendChild(node); siteSelSearch(node); const sh=node.querySelector(".sheet"); if(sh) sh.scrollTop=sc; return }
  if(had) { m.onclick=null; m.onchange=null; m.oninput=null }
  m.appendChild(node); siteSelSearch(node); taAutosave(node); }
function closeSheet(){ const m=$("#modal"); taClear(m.firstElementChild); const n=sheetStack.length+(m.firstElementChild?1:0); sheetStack.length=0; m.innerHTML=""; m.onclick=null; m.onchange=null; m.oninput=null;
  if(n>0&&history.state&&history.state.sheet){ popIgnore+=n; try{history.go(-n)}catch(_){ popIgnore=0 } } }
function sheetBack(){ const m=$("#modal"), prev=sheetStack.pop(); m.innerHTML="";
  if(prev){ m.appendChild(prev.node); m.onclick=prev.onclick; m.onchange=prev.onchange; m.oninput=prev.oninput; const sh=prev.node.querySelector(".sheet"); if(sh) sh.scrollTop=prev.scroll }
  else { m.onclick=null; m.onchange=null; m.oninput=null } }
window.addEventListener("popstate",()=>{
  if(popIgnore>0){ popIgnore--; return }
  const ov=[...document.body.children].filter(x=>x.classList?.contains("overlay")); // вікна вибору (пошук, вибір роботи) — закриваємо першими
  if(ov.length){ ovPop=true; ov[ov.length-1].remove(); return }
  if($("#modal").firstElementChild) sheetBack();
});
// вікна вибору/пошуку поверх усього: відкрили — крок в історії; закрили кнопкою — прибираємо цей крок
let ovPop=false;
new MutationObserver(ms=>{ for(const m of ms){
  for(const n of m.addedNodes) if(n.classList?.contains("overlay")) try{history.pushState({ov:1},"")}catch(_){}
  for(const n of m.removedNodes) if(n.classList?.contains("overlay")){ if(ovPop){ ovPop=false } else { popIgnore++; try{history.back()}catch(_){ popIgnore-- } } } } }).observe(document.body,{childList:true});
$("#modal").addEventListener("click",e=>{ if(e.target.classList.contains("overlay")||e.target.closest("[data-close]")) closeSheet(); });


// ---------- Кількість і переміщення частинами ----------
const qtyOf=t=>Math.max(1,+t.qty||1);
// «Шабашка» та подібні: постійний об'єкт для дрібних разових робіт — прибуток ділиться одразу, об'єкт не закривається
const isPerm=st=>!!st&&(st.perm===true||(st.perm!==false&&/шабаш/i.test(st.name||"")));
const normName=s=>String(s||"").toLowerCase().replace(/[«»"'’ʼ`.,()\-–—/]/g," ").replace(/\s+/g," ").trim();
function lotKey(t){return [normName(t.name),t.cat||"",normName(t.brand),normName(t.model)].join("|")}
const isLot=t=>!t.serial&&(qtyOf(t)>1||!t.inv);
function findLot(t,holder,siteId,exceptId){
  if(!isLot(t)) return null;
  const k=lotKey(t);
  return [...S.tools.values()].find(x=>x.id!==exceptId&&isLot(x)&&(x.status||"ok")==="ok"&&x.holder===holder&&(x.site||"")===(siteId||"")&&lotKey(x)===k)||null;
}
async function moveTool(db,t,qty,holder,siteId,note,byName){
  const all=qtyOf(t); qty=Math.min(Math.max(1,qty|0),all); const now=Date.now();
  const names={}; for(const pid of [t.holder,holder]) if(person(pid)) names[pid]=person(pid).name;
  for(const sid of [t.site,siteId]) if(site(sid)) names[sid]=site(sid).name;
  const lot=findLot(t,holder,siteId,t.id);
  if(qty>=all){
    if(lot){ await db.doc("tools/"+lot.id).update({qty:qtyOf(lot)+qty,updatedAt:now}); await db.doc("tools/"+t.id).delete(); }
    else await db.doc("tools/"+t.id).update({holder,site:siteId||"",updatedAt:now});
  } else {
    await db.doc("tools/"+t.id).update({qty:all-qty,updatedAt:now});
    if(lot) await db.doc("tools/"+lot.id).update({qty:qtyOf(lot)+qty,updatedAt:now});
    else { const c={...t}; delete c.id; Object.assign(c,{qty,holder,site:siteId||"",inv:"",createdAt:now,updatedAt:now}); await db.collection("tools").add(c); }
  }
  await db.collection("moves").add({tool:lot?.id||t.id,toolName:t.name,toolInv:t.inv||"",qty,fromHolder:t.holder||"",toHolder:holder,fromSite:t.site||"",toSite:siteId||"",note:note||"",at:now,by:S.uid||"",byName:byName||"",names});
}

// ---------- Розпізнавання інструменту з фото ----------
async function shrinkImage(file,max=1280){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url});
    const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return {mime:"image/jpeg",b64:c.toDataURL("image/jpeg",0.85).split(",")[1],thumb:c.toDataURL("image/jpeg",0.4)};
  } finally { URL.revokeObjectURL(url) }
}
function aiPrompt(){

  return `Ти помічник з інвентаризації будівельного інструменту. На фото інструмент, розкладений для обліку. Кожне фото — окрема купа; однакові позиції з різних фото підсумуй.

Для кожної позиції поверни:

    ${doneL.length?`<details style="margin:4px 0 10px"><summary class="m" style="cursor:pointer;font-size:13px">✅ Уже привезено (${doneL.length}) — історія</summary><div style="margin-top:6px">${doneL.map(([n,i])=>row(n,i)).join("")}</div></details>`:""}
    ${S.canWrite&&(mats.length||tools.length)&&buyGroups(s.id).length?`<button class="btn sm" id="nBought" style="width:100%;margin-bottom:8px">🧾 Купив у магазині → витрата</button>`:""}
    ${l.some(isMat)?`<button class="btn ghost sm" id="nMatDoc" style="width:100%;margin-bottom:8px">📄 Список матеріалів (замовнику / менеджеру, з цінами)</button>`:""}
    ${S.canWrite?`${l.length&&window.__fbAI?`<button class="btn ghost sm" id="nAI" style="width:100%;margin-bottom:8px">🔄 Перевірити наявність</button>`:""}
      ${missT.length?`<button class="btn sm" id="nBring" style="width:100%;margin-bottom:8px">🚚 Завезти потрібний інструмент</button>`:""}
      ${miss.length?`<button class="btn ghost sm" id="nBuy" style="width:100%;margin-bottom:8px">🛒 Список на закупівлю для менеджера</button>`:""}`:""}` }
function bindNeeds(s){ loadToolCat(); loadMatCat(); loadMatPrices(()=>{ if(!S._mpDrawn){ S._mpDrawn=1; const b=$("#needsBox"); if(b&&s.needs?.some(n=>n.kind==="material")){ b.innerHTML=needsHTML(s); bindNeeds(s) } } });
  const box=$("#needsBox"); if(!box) return; const re=()=>{ box.innerHTML=needsHTML(s); bindNeeds(s) };
  const save=async l=>{ l=l.map(({_here,...x})=>x); if(await write(db=>db.doc("sites/"+s.id).update({needs:l}))){ s.needs=l; re() } };
  box.querySelectorAll("[data-wmv]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const ids=b.dataset.wmv.split(","); moveForm([ids[0]],{site:b.dataset.wto,back:()=>{ const st=S.sites.get(s.id); if(st){ S.siteTab="needs"; siteForm(st) } }}) });
  $("#nBought")?.addEventListener("click",()=>buyList(s.id));
  box.querySelectorAll("[data-nbuy]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.nbuy, g=buyGroups(s.id)[0], x=g?.l.find(x=>x.i===i); if(x) boughtSheet([{site:g.site,l:[x]}],()=>{ const st=S.sites.get(s.id); if(st){ S.siteTab="needs"; siteForm(st) } }) });
  box.querySelectorAll("[data-nwf]").forEach(b=>b.onclick=()=>{ S.needWho=b.dataset.nwf; re() });
  const setWho=(i,w)=>{ const l=s.needs.map(x=>({...x})); if(w) l[i].who=w; else delete l[i].who; save(l) };
  box.querySelectorAll("[data-nme]").forEach(b=>b.onclick=()=>{ const me=meId(); if(!me){ whoAmISheet(); return } setWho(+b.dataset.nme,me) });
  box.querySelectorAll("[data-nwho]").forEach(b=>b.onclick=()=>{ if(!S.canWrite) return; const i=+b.dataset.nwho, cur=s.needs[i]?.who||"";
    const ppl=[...S.people.values()].filter(p=>p.role==="owner").sort(byName).concat([...S.people.values()].filter(p=>p.role!=="owner"&&!p.helper&&p.active!==false).sort(byName));
    const ov=document.createElement("div"); ov.style.cssText="position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center";
    ov.innerHTML=`<div style="background:var(--card,#1b1f27);color:inherit;border-radius:14px 14px 0 0;padding:14px;width:100%;max-width:520px;max-height:70vh;overflow:auto"><b>Хто везе «${esc(s.needs[i].name)}»?</b><div class="list" style="margin-top:8px">${ppl.map(p=>`<div class="card" data-pw="${p.id}"><div class="main"><div class="t">${cur===p.id?"✅ ":""}${p.role==="owner"?"👤 ":"🔧 "}${esc(p.name)}</div></div></div>`).join("")}${cur?`<div class="card" data-pw=""><div class="main"><div class="t">✕ Зняти відповідального</div></div></div>`:""}</div><button class="btn ghost" style="width:100%;margin-top:8px" data-x>Скасувати</button></div>`;
    ov.onclick=e=>{ const c=e.target.closest("[data-pw]"); if(c){ ov.remove(); setWho(i,c.dataset.pw) } else if(e.target===ov||e.target.closest("[data-x]")) ov.remove() }; document.body.appendChild(ov) });
  box.querySelectorAll("[data-ndel]").forEach(b=>b.onclick=()=>save((s.needs||[]).filter((_,i)=>i!==+b.dataset.ndel)));
  box.querySelectorAll("[data-nq]").forEach(el=>el.onchange=()=>{ const v=parseFloat(String(el.value).replace(",",".")); if(!(v>0)){ el.value=s.needs[+el.dataset.nq].qty||1; return } const l=s.needs.map(x=>({...x})); l[+el.dataset.nq].qty=v; save(l) });
  box.querySelectorAll("[data-npr]").forEach(el=>el.onchange=()=>{ const l=s.needs.map(x=>({...x})), x=l[+el.dataset.npr], v=parseFloat(String(el.value).replace(",","."))||0; x.price=v; x.priceSrc=v?"вручну":""; save(l) });
  box.querySelectorAll("[data-nu]").forEach(el=>el.onchange=()=>{ const l=s.needs.map(x=>({...x})); l[+el.dataset.nu].unit=el.value.trim()||"шт"; save(l) });
  box.querySelectorAll("[data-nkind]").forEach(b=>b.onclick=()=>{ const l=s.needs.map(x=>({...x})), x=l[+b.dataset.nkind]; x.kind=x.kind==="material"?"tool":"material"; if(x.kind==="material"&&!x.unit) x.unit="шт"; save(l) });
  // натиснув ⬜ — позначено «привезено»; натиснув ✅, поставлену вручну, — знято
  box.querySelectorAll("[data-ngot]").forEach(el=>el.onchange=()=>{ const v=Math.max(0,parseFloat(String(el.value).replace(",","."))||0), l=s.needs.map(x=>({...x})), x=l[+el.dataset.ngot]; x.got=v; x.done=v>=(+x.qty||1); save(l) });
  box.querySelectorAll("[data-ntog]").forEach(b=>b.onclick=()=>{ if(!S.canWrite) return; const i=+b.dataset.ntog, l=s.needs.map(x=>({...x})), x=l[i];
    if(x.done||(x.kind==="material"&&(+x.got||0)>=(+x.qty||1))){ x.done=false; if(x.kind==="material") x.got=0; save(l); return }
    if(x.kind==="material"){ x.got=+x.qty||1; x.done=true; save(l); return }
    if(haveOnSite(s.needs[i],s.id)>=(+x.qty||1)){ toast("Вже є на об'єкті: "+(s.needs[i]._here||[]).slice(0,2).join(", ")); return }
    x.done=true; save(l) });
  // вручну прив'язати позицію до інструменту, який уже є на об'єкті (якщо ШІ не зрозумів назву)
  box.querySelectorAll("[data-nlink]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.nlink, n=s.needs[i];
    const here=[...S.tools.values()].filter(t=>t.site===s.id).sort((a,b)=>a.name.localeCompare(b.name,"uk"));
    pickTool(here,n,res=>{ const l=s.needs.map(x=>({...x})), x=l[i];
      if(res==="done"){ x.done=true } else if(res==="undo"){ x.done=false; x.match=[] } else { x.done=false; x.match=[...new Set([...(Array.isArray(x.match)?x.match:[]),normName(res.name)])] }
      save(l) }) });
  $("#nAdd")?.addEventListener("click",()=>{
    let nImgs=[]; const pre=S.needsPrefill; S.needsPrefill=null;
    $("#nAdd").insertAdjacentHTML("afterend",`<div id="nForm" style="margin-bottom:10px"><div class="row" style="margin-bottom:6px"><label class="btn ghost sm" style="flex:1;text-align:center">📷 Фото списку<input type="file" id="nCam" accept="image/*" capture="environment" style="display:none"></label><label class="btn ghost sm" style="flex:1;text-align:center">🖼️ Скріни (кілька)<input type="file" id="nGal" accept="image/*" multiple style="display:none"></label></div><div id="nThumbs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px"></div><textarea id="nTxt" rows="4" placeholder="Інструмент і матеріали — кожне з нового рядка, можна з кількістю:\nперфоратор 2\nрівень 2м\nболгарка 125 — 3 шт"></textarea>
      <div class="row" style="margin-top:6px"><button class="btn ghost sm" id="nCancel" style="flex:1">Скасувати</button><button class="btn sm" id="nOk" style="flex:1">Додати</button></div></div>`);
    $("#nAdd").style.display="none"; $("#nTxt").focus(); if(pre){ $("#nTxt").value=pre.text||""; nImgs=pre.imgs||[] }
    const drawT=()=>{ $("#nThumbs").innerHTML=nImgs.map((x,i)=>`<div style="position:relative"><img src="${x.thumb}" style="width:64px;height:64px;object-fit:cover;border-radius:8px"><button type="button" data-nri="${i}" style="position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:22px;height:22px;background:#e11d48;color:#fff">×</button></div>`).join("") };
    const addImgs=async fl=>{ for(const f of fl){ try{ nImgs.push(await shrinkImage(f,1600)) }catch(_){} } drawT() };
    drawT(); $("#nCam").onchange=e=>{addImgs(e.target.files);e.target.value=""}; $("#nGal").onchange=e=>{addImgs(e.target.files);e.target.value=""};
    $("#nThumbs").onclick=e=>{ const i=e.target.dataset.nri; if(i!=null){ nImgs.splice(+i,1); drawT() } };
    $("#nCancel").onclick=re;
    $("#nOk").onclick=async()=>{ const raw=$("#nTxt").value.trim(); if(!raw&&!nImgs.length){re();return}
      const simple=()=>raw.split(/\n|;/).map(x=>x.trim().replace(/^\d+[.)]\s*/,"")).filter(Boolean).map(line=>{
        const m=line.match(/^(.*?)[\s,—–-]*(?:[xх×]\s*)?(\d+)\s*(?:шт\.?|штук[и]?|pcs)?\s*$/i);
        return m&&m[1].trim()?{name:m[1].trim(),qty:+m[2]}:{name:line,qty:1} });
      const old=(s.needs||[]).map(({_here,...x})=>({...x}));
      let add=null; if(window.__fbAI){ const b=$("#nOk"); b.disabled=true; b.textContent="⏳ Розбираю…"; try{ add=await aiNeeds(raw,nImgs,old) }catch(e){ toast("ШІ не відповів — додаю як є") } }
      if(!add||!add.length){ if(!raw){ toast("Не вдалося прочитати фото"); re(); return } add=simple() }
      // об'єднуємо з уже замовленим: та сама річ — не дублюємо, а уточнюємо кількість
      let merged=0; const l=old;
      for(const a of add){ let i=a.e>=0?a.e:l.findIndex(x=>normName(x.name)===normName(a.name)); delete a.e;
        if(i<0){ l.push({...a,req:1}); continue }
        const x=l[i]; merged++; x.req=(x.req||1)+1;
        if(a.qtySet){ x.qty=x.qtySet?Math.max(+x.qty||1,+a.qty):a.qty; x.qtySet=true; if(a.kind==="material"&&a.unit&&(!x.unit||x.unit==="шт")) x.unit=a.unit }
        if(x.kind!=="material"&&a.kind==="material"){ x.kind="material"; x.unit=a.unit||x.unit }
        if(a.match?.length) x.match=[...new Set([...(x.match||[]),...a.match])];
        if(x.done&&a.qtySet&&+a.qty>(+x.qty||1)) x.done=false }
      if(merged) toast(`Об'єднано з уже замовленим: ${merged} поз.`);
      save(l) };
  });
  $("#nAI")?.addEventListener("click",async()=>{ const b=$("#nAI"); b.disabled=true; b.textContent="⏳ Перевіряю…";
    try{ const old=s.needs||[]; const r=await aiNeeds(old.map(n=>`${n.name} ${+n.qty||1} шт`).join("\n"));
      // зберігаємо наші позиції, лише оновлюємо відповідності (за порядком/назвою)
      const l=old.map((n,i)=>{ const x=r.find(y=>normName(y.name)===normName(n.name))||r[i]; return x?{...n,name:n.name.replace(/^\s*\d+\s*[.)]\s*[,.]?\s*/,"")||n.name,match:x.match,kind:x.kind,unit:n.unit||x.unit}:n });
      save(l); toast("Перевірено") }catch(e){ toast("Не вдалося: "+String(e?.message||e).slice(0,60)); re() } });
  $("#nBuy")?.addEventListener("click",()=>buyList(s.id));
  $("#nMatDoc")?.addEventListener("click",()=>matListDoc(s));
  $("#nBring")?.addEventListener("click",()=>{ const l=(s.needs||[]).filter(n=>n.kind!=="material"&&haveOnSite(n,s.id)<(+n.qty||1));
    photoFlow({mode:"move",text:true,to:s.id,listText:l.map(n=>`${n.name} ${Math.max(1,(+n.qty||1)-haveOnSite(n,s.id))} шт`).join("\n")}) });
}

function tcItemForm(i,cat,back){
  const items=toolCat().map(x=>({...x})), it=i>=0?items[i]:{cat,name:"",alt:""};
  const ov=document.createElement("div"); ov.className="overlay"; ov.style.zIndex="1100";
  ov.innerHTML=`<div class="sheet"><h2>${i>=0?"Назва в довіднику":"Нова назва"}</h2>
    <div class="field"><label>Правильна назва *</label><input id="tcN" value="${esc(it.name)}"></div>
    <div class="field"><label>Як ще називають (через кому)</label><input id="tcA" value="${esc(it.alt||"")}" placeholder="напр. стремянка, лесничка"></div>
    <div class="field"><label>Категорія</label><select id="tcC">${catOptions(it.cat,false)}</select></div>
    <div class="actions">${i>=0?`<button class="btn danger" id="tcDel">Видалити</button>`:""}<button class="btn ghost" id="tcX">Скасувати</button><button class="btn" id="tcOk">Зберегти</button></div></div>`;
  document.body.appendChild(ov); const close=()=>ov.remove(); $("#tcX").onclick=close;
  $("#tcOk").onclick=async()=>{ const n=$("#tcN").value.trim(); if(!n){toast("Вкажіть назву");return} const x={name:n,alt:$("#tcA").value.trim(),cat:$("#tcC").value}; if(i>=0) items[i]=x; else items.push(x); if(await saveToolCat(items)){ close(); back() } };
  $("#tcDel")?.addEventListener("click",async()=>{ items.splice(i,1); if(await saveToolCat(items)){ close(); back() } });
}
// ШІ підбирає правильну назву з довідника для кожної «неправильної» назви в базі; ви підтверджуєте, і інструмент перейменовується
async function tcNormalize(names){
  if(!window.__fbAI){toast("ШІ недоступний");return}
  const cat=toolCat(); let rows=[];
  openSheet(`<h2>✨ Назви до довідника</h2><div id="tnBody"><div class="empty">⏳ ШІ підбирає правильні назви для ${names.length} позицій…</div></div>`);
  try{ const prompt=`Ось назви інструменту з нашої бази (написані як завгодно) і довідник правильних назв (номер. назва (так пишуть: …)). Для кожної назви з бази вкажи номер з довідника, що означає ТОЙ САМИЙ інструмент, або -1, якщо в довіднику такого немає. Розмір/довжина можуть уточнювати вибір (рівень 2 м → «Рівень 2 м»).
Довідник:
${cat.map((c,i)=>`${i}. ${c.name}${c.alt?` (так пишуть: ${c.alt})`:""}`).join("\n")}
Назви з бази:
${names.map((n,i)=>`${i}. ${n}`).join("\n")}
Відповідь — лише JSON {"map":[{"i":0,"c":-1}]}.`;
    const j=JSON.parse(String(await window.__fbAI([{text:"Зістав назви."}],prompt)).replace(/^```(json)?|```$/g,"").trim());
    const by=new Map((j.map||[]).map(x=>[+x.i,+x.c]));
    rows=names.map((n,i)=>{ const c=by.get(i); return {old:n,c:Number.isInteger(c)&&c>=0&&c<cat.length?c:-1,on:Number.isInteger(c)&&c>=0&&c<cat.length,qty:[...S.tools.values()].filter(t=>t.name===n).reduce((a,t)=>a+qtyOf(t),0)} });
  }catch(e){ $("#tnBody").innerHTML=`<div class="banner">Не вдалося: ${esc(String(e?.message||e).slice(0,120))}</div>`; return }
  const draw=()=>{ $("#tnBody").innerHTML=`<div class="m" style="color:var(--muted);font-size:12.5px;margin-bottom:8px">Перевірте пари «як записано → правильна назва». Неправильну пару змініть кнопкою 🔍 або зніміть галочку.</div>
    ${rows.map((r,i)=>`<div class="card" style="display:block;cursor:default;margin-bottom:6px;${r.on?"":"opacity:.55"}"><div class="row" style="align-items:center"><input type="checkbox" data-tn="${i}" ${r.on?"checked":""} style="flex:0 0 22px"><span style="flex:1">${esc(r.old)} <span class="m">(${r.qty} шт)</span></span></div>
      <button type="button" class="btn ghost sm" data-tnp="${i}" style="width:100%;text-align:left;margin-top:6px">→ ${r.c>=0?`<b>${esc(cat[r.c].name)}</b>`:"🔍 вибрати з довідника…"}</button></div>`).join("")}
    <button class="btn" id="tnOk" style="width:100%">Перейменувати (${rows.filter(r=>r.on&&r.c>=0).length})</button><div class="actions"><button class="btn ghost" data-close>Закрити</button></div>`;
    $("#tnBody").onchange=e=>{ const i=e.target.dataset.tn; if(i!=null){ rows[i].on=e.target.checked; draw() } };
    $("#tnBody").onclick=e=>{ const b=e.target.closest("[data-tnp]"); if(!b) return; const i=+b.dataset.tnp;
      pickWork(cat.map(c=>({name:c.name,alt:c.alt,cat:c.cat,unit:"",price:0})),rows[i].c,v=>{ rows[i].c=v; rows[i].on=v>=0; draw() },"— немає в довіднику") };
    $("#tnOk").onclick=async()=>{ const ch=rows.filter(r=>r.on&&r.c>=0); if(!ch.length) return; $("#tnOk").disabled=true;
      let n=0; const ok=await write(async db=>{ for(const r of ch){ const c=cat[r.c]; for(const t of [...S.tools.values()].filter(t=>t.name===r.old)){ await db.doc("tools/"+t.id).update({name:c.name,cat:c.cat,updatedAt:Date.now()}); n++ } } });
      if(ok){ closeSheet(); toast(`Перейменовано: ${n} запис(ів)`) } else $("#tnOk").disabled=false };
  }; draw();
}

function matCat(){ const sv=S.matcat?.items; if(!sv) return MATCAT_SEED; if((S.matcat.seedVer||1)>=MATCAT_VER) return sv;
  if(!S.matcatMerged){ const l=sv.map(x=>({...x})), by=new Map(l.map(x=>[normName(x.name),x]));
    for(const it of MATCAT_SEED){ const o=by.get(normName(it.name)); if(!o) l.push({...it}); else { if(!(+o.price>0)&&+it.price>0) o.price=it.price; if(!o.alt&&it.alt) o.alt=it.alt } }
    S.matcatMerged=l; if(S.canWrite) saveMatCat(l) }
  return S.matcatMerged }
let _mcIdx=null,_mcSrc=null;
function matBase(name){ const l=matCat(); if(_mcSrc!==l){ _mcSrc=l; _mcIdx=new Map(); for(const c of l){ _mcIdx.set(normName(c.name),c) } } return _mcIdx.get(normName(name))||null }
function loadMatCat(cb){ if(S.matcatLoaded){ cb&&cb(); return } S.db.doc("meta/matcat").get().then(x=>{ if(x.exists) S.matcat=x.data(); S.matcatLoaded=true; cb&&cb() }).catch(()=>{ S.matcatLoaded=true; cb&&cb() }) }
async function saveMatCat(items){ const data={items,updatedAt:Date.now(),seedVer:MATCAT_VER}; if(await write(db=>db.doc("meta/matcat").set(data))){ S.matcat=data; S.matcatMerged=null; return true } return false }

function buyGroups(onlySite){
  const sites=[...S.sites.values()].filter(x=>x.type!=="warehouse"&&x.active!==false&&(!onlySite||x.id===onlySite)&&(x.needs||[]).length);
  const groups=[]; for(const st of sites){ const l=[];
    (st.needs||[]).forEach((n,i)=>{ if(n.done||haveOnSite(n,st.id)>=(+n.qty||1)) return;
      const mat=n.kind==="material"; if(!mat&&whereIs({...n,need:1},st.id).length) return; // інструмент є десь — його везуть, а не купують
      l.push({site:st,i,n,mat,on:!n.ordered}) }); if(l.length) groups.push({site:st,l}) }
  return groups }

const skillGuess=t=>{ const x=" "+String(t||"").toLowerCase()+" "; return Object.keys(SKILL_RX).filter(k=>SKILL_RX[k].test(x)) };

${items.map((x,i)=>`${i}. ${x.name} | ${x.unit||"шт"}`).join("\n")}

  async function save(){

          const t={name:r.name.trim(),cat:r.cat,brand:r.brand.trim(),model:r.model||"",qty:r.qty,holder:holder||"",site:siteId||"",status:"ok",note:r.note||"",inv:"",serial:""};

      let nid=""; if(await write(async db=>{ const r=await db.collection("tasks").add(d); nid=r?.id })&&nid) taskNeedsSync(nid,d,"") }

  }

}

const thumbOf=(file,max=320)=>new Promise((ok,bad)=>{ const u=URL.createObjectURL(file), i=new Image(); i.onload=()=>{ const k=Math.min(1,max/Math.max(i.width,i.height)), c=document.createElement("canvas"); c.width=Math.round(i.width*k); c.height=Math.round(i.height*k); c.getContext("2d").drawImage(i,0,0,c.width,c.height); URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg",.6)) }; i.onerror=bad; i.src=u });
async function photoAdd(siteId,file,meta){ const th=await thumbOf(file); const big=file.size>1.5e6?await (async()=>{ const d=await thumbOf(file,1600); return new File([await (await fetch(d)).blob()],file.name||"фото.jpg",{type:"image/jpeg"}) })():file;
  const r=await saveFile(big); let id=""; await write(async db=>{ const x=await db.collection(R("photos")).add({site:siteId,fileId:r.id,thumb:th,at:Date.now(),date:todayISO(),by:S.uid||"",byName:S.meName||"",from:meta?.from||"",note:meta?.note||"",msg:meta?.msg||""}); id=x.id }); return id }

// 📄 документ об'єкта поруч зі звітом: погоджений кошторис, КП/смети, прикріплені файли (фото або PDF)
const docTable=(title,rows)=>`<div style="padding:8px;font-size:13px"><b>${esc(title)}</b><table style="width:100%;border-collapse:collapse;margin-top:6px">${rows.map((r,i)=>`<tr style="border-top:1px solid #ddd"><td style="padding:4px 2px;color:#888">${i+1}</td><td style="padding:4px 2px">${esc(r.name||"")}</td><td style="padding:4px 2px;white-space:nowrap;text-align:right"><b>${+r.qty||0}</b> ${esc(r.unit||"")}</td><td style="padding:4px 2px;white-space:nowrap;text-align:right;color:#555">${r.price!=null?money(+r.price):""}</td></tr>`).join("")}</table></div>`;
async function pdfPages(blob){ if(!window.pdfjsLib){ await new Promise((ok,bad)=>{ const x=document.createElement("script"); x.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; x.onload=ok; x.onerror=bad; document.head.appendChild(x) }); pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js" }
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise, out=[];
  for(let i=1;i<=Math.min(pdf.numPages,15);i++){ const pg=await pdf.getPage(i), v=pg.getViewport({scale:1.6}), c=document.createElement("canvas"); c.width=v.width; c.height=v.height; await pg.render({canvasContext:c.getContext("2d"),viewport:v}).promise; out.push(c.toDataURL("image/jpeg",.85)) }
  return out }

// 🤖 Фоновий розбір ШІ: чеки й документи. Можна згорнути застосунок — прийде сповіщення, результат чекає на «Сьогодні»
const RC_PROMPT=`Це фото касового чека або накладної з України. Знайди ПІДСУМКОВУ суму до сплати (рядок «СУМА», «ДО СПЛАТИ», «РАЗОМ»), дату покупки і назву магазину/продавця.
Визнач вид витрати: одне з "Матеріали","Інструменти","Доставка","Інше". Коротко (до 60 символів) опиши, що куплено.
Відповідь — лише JSON {"total":число,"date":"YYYY-MM-DD" або "","vendor":"","kind":"","items":""}. Якщо щось не видно — порожній рядок, total 0.`;
const rcAI=img=>window.__fbAI([img],RC_PROMPT).then(t=>JSON.parse(String(t).replace(/^```(json)?|```$/g,"").trim()));
S.jobs=S.jobs||[]; S.jobIn=S.jobIn||new Map();
const jobsSave=()=>{ try{ localStorage.setItem("aiJobs",JSON.stringify(S.jobs.slice(-30))) }catch(_){} };
const jobCache=()=>window.caches?caches.open("oblik-jobs"):Promise.reject(new Error("no cache"));
async function jobPut(id,inp){ try{ const c=await jobCache(); if(inp.img) await c.put("/j/"+id,new Response(JSON.stringify(inp.img),{headers:{"content-type":"application/json"}}));
  else if(inp.file) await c.put("/j/"+id,new Response(inp.file,{headers:{"content-type":inp.file.type||"application/octet-stream","x-name":encodeURIComponent(inp.file.name||"файл")}})) }catch(_){} }
async function jobGet(id,kind){ if(S.jobIn.has(id)) return S.jobIn.get(id); try{ const r=await (await jobCache()).match("/j/"+id); if(!r) return null;
  const inp=kind==="rc"?{img:await r.json()}:{file:new File([await r.blob()],decodeURIComponent(r.headers.get("x-name")||"файл"),{type:r.headers.get("content-type")||""})}; S.jobIn.set(id,inp); return inp }catch(_){ return null } }
const jobRun=(kind,inp)=>kind==="rc"?rcAI(inp.img):docParts(inp.file).then(parts=>{ inp.parts=parts; return parseDocAI(parts) });
function jobTitle(j){ const r=j.result||{}; return j.kind==="rc"?`🧾 Чек${r.vendor?": "+r.vendor:""}${+r.total?" — "+money(r.total):""}`:`📎 ${r.kind||j.ctx.kind||"Документ"}${r.no?" № "+r.no:""}${+r.total?" — "+money(r.total):""}${site(j.ctx.site)?" · "+site(j.ctx.site).name:""}` }
async function jobStart(kind,ctx,inp,promise,label){ const j={id:"j"+Date.now().toString(36),kind,ctx,label,status:"run",at:Date.now()}; S.jobs.push(j); S.jobIn.set(j.id,inp); jobsSave(); jobPut(j.id,inp);
  toast("🕐 Розбираю у фоні — можна згорнути застосунок, повідомлю"); try{ if(window.Notification&&Notification.permission==="default") Notification.requestPermission().catch(()=>{}) }catch(_){}
  render(); jobWork(j,promise) }
async function jobWork(j,promise){ try{ const inp=await jobGet(j.id,j.kind); if(!inp&&!promise) throw new Error("немає файлу");
    j.result=await (promise||jobRun(j.kind,inp)); j.status="done" }catch(e){ j.status="err"; j.err=String(e?.message||e).slice(0,80) }
  jobsSave(); render(); const txt=j.status==="done"?jobTitle(j)+" · перевірте і збережіть":`${j.label||"Розбір"}: не вдалося — відкрийте, щоб заповнити вручну`;

function telHref(ph){ let d=String(ph||"").replace(/[^\d+]/g,""); if(/^0\d{9}$/.test(d)) d="+38"+d; else if(/^380\d{9}$/.test(d)) d="+"+d; return "tel:"+d }

function firstSeen(id){ let m="";
  for(const f of [...S.B.trio.fin.values(),...(S.duoOk?S.B.duo.fin.values():[])]) if(f.date&&(f.worker===id||f.owner===id||f.from===id||f.to===id)&&(!m||f.date<m)) m=f.date;
  for(const x of S.moves) if((x.to===id||x.from===id||x.holder===id)&&x.at){ const d=new Date(x.at).toISOString().slice(0,10); if(!m||d<m) m=d }
  return m }

function mergePerson(src){ const l=[...S.people.values()].filter(x=>x.id!==src.id&&x.role!=="owner"&&!x.crew&&x.active!==false).sort(byName);
  openSheet(`<h2>🔀 Об'єднати «${esc(src.name)}»</h2><div class="m" style="color:var(--muted);margin-bottom:8px">Виберіть основний запис цієї ж людини. На нього перейдуть нарахування й виплати (обидві бази), інструмент, справи, бригади, телефон і кабінет. «${esc(src.name)}» піде в архів.</div>
    <input type="search" id="mpQ" placeholder="🔍 Пошук" style="margin-bottom:8px"><div class="list">${l.map(x=>{ const t=workerTotals()[x.id]; return `<div class="card" data-mp="${x.id}" data-mpn="${esc(x.name+" "+(x.phone||""))}" style="cursor:pointer"><div class="main"><div class="t">${esc(x.name)}</div><div class="m">${[x.phone,t?"борг "+money(t.acc-t.paid):""].filter(Boolean).map(esc).join(" · ")}</div></div></div>` }).join("")}</div>
    <div class="actions"><button class="btn ghost" id="mpBack">Назад</button></div>`);
  $("#mpQ").oninput=e=>{ const q=e.target.value.trim(); $("#modal").querySelectorAll("[data-mpn]").forEach(c=>c.style.display=!q||wordHit(c.dataset.mpn,q)?"":"none") };
  $("#mpBack").onclick=()=>personForm(src);
  $("#modal").querySelectorAll("[data-mp]").forEach(c=>c.onclick=async()=>{ const dst=S.people.get(c.dataset.mp); if(!confirm(`Перенести все з «${src.name}» на «${dst.name}»?\n«${src.name}» піде в архів.`)) return;
    const fins=[...S.B.trio.finRaw.values()].filter(f=>f.worker===src.id), dfins=S.duoOk?[...S.B.duo.finRaw.values()].filter(f=>f.worker===src.id):[];
    const ok=await write(async()=>{ const db=S.db;
      for(const f of fins) await db.doc("fin/"+f.id).update({worker:dst.id});
      for(const f of dfins) await db.doc("duo_fin/"+f.id).update({worker:dst.id});
      for(const t of S.tools.values()) if(t.holder===src.id) await db.doc("tools/"+t.id).update({holder:dst.id});
      for(const t of S.tasksT||[]) if(t.who===src.id) await db.doc("tasks/"+t.id).update({who:dst.id});
      if(S.duoOk) for(const t of S.tasksD||[]) if(t.who===src.id) await db.doc("duo_tasks/"+t.id).update({who:dst.id});
      for(const c of S.people.values()) if(c.crew&&(c.members||[]).includes(src.id)) await db.doc("people/"+c.id).update({members:[...new Set(c.members.map(m=>m===src.id?dst.id:m))]});
      const up={}; if(src.wkey) up.wkey=src.wkey; if(!dst.phone&&src.phone) up.phone=src.phone; if(!(dst.skills||[]).length&&(src.skills||[]).length){ up.skills=src.skills; up.skillsAt=src.skillsAt||Date.now() } if(!dst.trade&&src.trade) up.trade=src.trade;
      if(Object.keys(up).length) await db.doc("people/"+dst.id).update(up);
      await db.doc("people/"+src.id).update({active:false,mergedInto:dst.id,wkey:null}) });
    if(ok){ try{ localStorage.removeItem("wpubH") }catch(_){} closeSheet(); toast(`✅ Об'єднано: записів ${fins.length+dfins.length}`); setTimeout(wpubSync,1500) } }) }

        <div id="phList">${(p.phones||[]).map(x=>phRow(x)).join("")}</div><button type="button" class="btn ghost sm" id="phAdd" style="margin-top:6px">+ ще номер</button></div>
        <div class="field" style="max-width:220px"><label>У базі з${!isNew&&!p.since?' <span style="font-weight:400;color:var(--muted)">(за першим записом)</span>':""}</label><input name="since" type="date" value="${esc(p.since||(isNew?todayISO():firstSeen(p.id)))}"></div>

    </form>`);
  let role=p.role;

    const crew=role==="worker"&&$("#isCrew").checked; data.crew=crew; data.helper=role==="worker"&&!crew&&$("#isHelp").checked; if(role!=="owner"){ const sk=[...document.querySelectorAll(".pSk:checked")].map(x=>x.value); if(sk.join()!==(Array.isArray(p.skills)?p.skills:[]).join()||sk.length) data.skills=sk } data.members=crew?[...document.querySelectorAll(".crewM:checked")].map(x=>x.value):[];

  });

// ---------- Гроші ----------
const KINDS=["Матеріали","Зарплата","Підсоба","Інструменти","Доставка","Відкат","Податки","Інше"];
// сума з виразу: «15000+17 356» → 32356 (також «-», кома як десятковий роздільник)
function sumExpr(x){ const t=String(x??"").replace(/\s/g,"").replace(/,/g,"."); if(!t) return NaN; if(!/^[+-]?\d*\.?\d+([+-]\d*\.?\d+)*$/.test(t)) return NaN;
  return Math.round((t.match(/[+-]?\d*\.?\d+/g)||[]).reduce((a,n)=>a+parseFloat(n),0)*100)/100 }
const TAX_DEF=()=>{ try{ const t=JSON.parse(localStorage.getItem("oblikTax")||"null")||{on:false,rate:7}; if(+t.rate===8&&!t.v7){ t.rate=7; t.v7=1; localStorage.setItem("oblikTax",JSON.stringify(t)) } return t }catch(_){ return {on:false,rate:7} } };
const money=n=>(Math.round((n||0)*100)/100).toLocaleString("uk-UA",{maximumFractionDigits:2})+" ₴";
const owners=()=>[...S.people.values()].filter(p=>p.role==="owner"&&(!isDuo()||DUO_OWNERS.includes(p.id))).sort(byName);
// 👤 хто зайшов: власник за поштою акаунта (прив'язка в базі), інакше за ім'ям акаунта
const NAME_ROOTS=[["анд","andr"],["сер","serh","serg"],["дми","дим","дім","dmy","dim"]];
function meId(){ const own=[...S.people.values()].filter(p=>p.role==="owner"), em=String(window.__fbEmail||"").toLowerCase();
  if(em){ const b=own.find(p=>String(p.email||"").toLowerCase().split(/[\s,;]+/).includes(em)); if(b) return b.id }
  const nm=String(S.meName||"").toLowerCase().trim(); if(!nm||nm.includes("@")) return "";
  const r=NAME_ROOTS.find(g=>g.some(x=>nm.startsWith(x))); const hit=own.filter(p=>{ const pn=String(p.name||"").toLowerCase(); return r?r.some(x=>pn.startsWith(x)):pn.slice(0,3)===nm.slice(0,3) });
  return hit.length===1?hit[0].id:"" }
const myOwner=()=>{ const m=meId(); return owners().some(o=>o.id===m)?m:"" };
function whoAmISheet(){ const cur=meId(), em=window.__fbEmail||"";
  openSheet(`<h2>👤 Хто ви?</h2><div class="m" style="color:var(--muted);margin-bottom:10px">Акаунт: <b>${esc(em||S.meName||"—")}</b>. Застосунок сам підставлятиме вас у «Хто платить / отримує», «Від кого», «У кого».</div>
    <div class="list">${[...S.people.values()].filter(p=>p.role==="owner").sort(byName).map(p=>`<div class="card" data-iam="${p.id}"><div class="main"><div class="t">${cur===p.id?"✅ ":""}${esc(p.name)}</div></div></div>`).join("")}</div>
    <div class="actions"><button class="btn ghost" data-close>Закрити</button></div>`);
  document.querySelectorAll(".sheet [data-iam]").forEach(c=>c.onclick=async()=>{ if(!em){ toast("Немає пошти акаунта"); return } const id=c.dataset.iam;
    const ok=await write(async db=>{ for(const p of S.people.values()) if(p.role==="owner"){ const l=String(p.email||"").toLowerCase().split(/[\s,;]+/).filter(x=>x&&x!==em.toLowerCase()); if(p.id===id) l.push(em.toLowerCase()); const v=l.join(", "); if(v!==String(p.email||"")){ await db.doc("people/"+p.id).update({email:v}); p.email=v } } });
    if(ok){ closeSheet(); toast("Тепер ви — "+person(id).name); render() } }) }
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDay=iso=>{if(!iso)return"без дати";const [y,m,d]=iso.split("-");return `${d}.${m}.${y}`};
const MONTHS=["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
// 📂 Великі об'єкти: ділянки (підоб'єкти) з полем parent. Головний об'єкт збирає гроші й борги всіх ділянок.
// ділянки з «Общаку на двох» під об'єктом «на трьох» — бачать лише Андрій і Сергій (S.duoOk), Дмитру ці дані недоступні
const duoX=()=>S.duoOk&&!isDuo()?S.B.duo.sites:null;
const isDuoKid=x=>!!(x&&duoX()?.has(x.id)&&!S.sites.has(x.id));
const siteAny=id=>S.sites.get(id)||duoX()?.get(id);
const siteKids=id=>id?[...S.sites.values(),...(duoX()?[...duoX().values()]:[])].filter(x=>x.parent===id&&x.id!==id).sort(byName):[];
const siteRoot=x=>x?.parent&&S.sites.get(x.parent)?S.sites.get(x.parent):x;
const siteFam=id=>[id,...siteKids(id).map(x=>x.id)];

// 💰 оплата замовника на головний об'єкт: спершу закриває його власний договір, решта — борги ділянок по черзі (у порядку створення), скільки вистачить
function custPaid(tot){ tot=tot||siteTotals(); const r={}; for(const x of [...S.sites.values(),...(duoX()?[...duoX().values()]:[])]){ const i=tot[x.id]?.in||0; r[x.id]={paid:i,got:0,gave:0} }
  return r; // ділянки рахуються окремо, кожна за своїм договором і своїми оплатами (без перерозподілу)
  for(const root of S.sites.values()){ if(root.parent&&S.sites.has(root.parent)) continue; const kids=siteKids(root.id).sort((a,b)=>(a.order||0)-(b.order||0)||byName(a,b)); if(!kids.length) continue;
    const pin=r[root.id].paid, pc=+root.contract||0; let left=pc>0?Math.max(0,pin-pc):pin;
    for(const k of kids){ if(left<=0) break; const c=+k.contract||0; if(!(c>0)) continue; const need=c-r[k.id].paid; if(need<=0) continue; const take=Math.min(need,left); r[k.id].paid+=take; r[k.id].got+=take; left-=take; r[root.id].gave+=take }
    r[root.id].paid-=r[root.id].gave }
  return r }
// борг замовника по великому об'єкту = сума боргів ділянок; переплата на одній ділянці НЕ закриває іншу
function famCustDebt(id,tot,over){ tot=tot||siteTotals(); let d=0, o=0, any=false; for(const k of siteFam(id)){ const c=+(siteAny(k)?.contract)||0; if(c>0){ any=true; const x=c-(tot[k]?.in||0); if(x>0) d+=x; else o-=x } } return over?o:any?d:null }
function famTotals(id,tot){ tot=tot||siteTotals(); const r={in:0,out:0,contract:0,acc:0,wpaid:0,n:0}; for(const k of siteFam(id)){ const t=tot[k]; if(t){ r.in+=t.in; r.out+=t.out; r.n+=t.n } r.contract+=+(siteAny(k)?.contract)||0 } return r }
function famWorkDebt(ids){ const set=new Set(ids); let a=0; for(const f of [...S.fin.values(),...(duoX()?[...S.B.duo.fin.values()]:[])]){ if(!set.has(f.site)||!f.worker||person(f.worker)?.helper||isHelperPay(f)) continue; if(f.type==="accrual") a+=+f.amount||0; else if(f.type==="out") a-=+f.amount||0 } return a }

function siteTotals(src){ if(!src&&duoX()){ const a=siteTotals(S.fin), b=siteTotals(S.B.duo.fin); return {...b,...a} }

function siteTotals0(src){const t={};for(const f of (src||S.fin).values()){if(!f.site||f.type==="accrual")continue;const x=t[f.site]||(t[f.site]={in:0,out:0,n:0});x[f.type==="in"?"in":"out"]+=+f.amount||0;x.n++}return t}
function balancesFor(fin,sites,ows){
  const b={}; for(const o of ows) b[o.id]=0; const st={};
  for(const f of fin.values()){ if(f.type==="accrual")continue;
    if(f.owner){ if(!(f.owner in b))b[f.owner]=0; b[f.owner]+=(f.type==="in"?1:-1)*(+f.amount||0); }
    if(f.site){ st[f.site]=(st[f.site]||0)+(f.type==="in"?1:-1)*(+f.amount||0) } }
  let shared=0; for(const id in st) if(sites.get(id)?.split) shared+=st[id];
  const n=ows.length||1; for(const k in b) b[k]-=shared/n;

}

  return duoO.map(o=>({o,trio:t[o.id]||0,duo:d[o.id]||0,sum:(t[o.id]||0)+(d[o.id]||0)})); }

function siteEstimate(siteId){ const out=[];
  if(!siteId) return out;
  const ap=site(siteId)?.approved; if(ap) for(const i of (ap.items||[])) if(!i.mat&&i.name&&+i.price>0) out.push({name:String(i.name),unit:i.unit||"",price:+i.price,src:"погоджена смета № "+(ap.no||"")});
  for(const c of S.contracts.values()) if(c.site===siteId) for(const i of (c.items||[])) if(i.name&&+i.price>0) out.push({name:String(i.name),unit:i.unit||"",price:+i.price,src:"договір "+(c.no||"")});
  for(const d of S.docs.values()) if(d.site===siteId) for(const i of (d.items||[])) if(i.name&&+i.price>0&&!out.some(x=>x.name===i.name&&x.price===+i.price)) out.push({name:String(i.name),unit:i.unit||"",price:+i.price,src:"рахунок "+(d.no||"")});
  return out }

// ---------- Аналітика: скільки заробив кожен за місяць ----------
// Прибуток місяця = прихід − витрати (без взаємозаліків і нарахувань); частка = прибуток / кількість власників бази.
function monthStats(fin,ows){
  const m={};
  for(const f of fin.values()){ if(f.type==="accrual"||f.kind==="Взаємозалік"||!f.date) continue;
    const k=f.date.slice(0,7), x=m[k]||(m[k]={in:0,out:0,p:{}}), a=+f.amount||0;
    if(f.type==="in") x.in+=a; else x.out+=a;
    if(f.owner){ const q=x.p[f.owner]||(x.p[f.owner]={in:0,out:0}); if(f.type==="in") q.in+=a; else q.out+=a } }
  for(const k in m){ m[k].profit=m[k].in-m[k].out; m[k].share=m[k].profit/(ows.length||1) }
  return m;
}
// Мінімальні перекази між власниками, щоб усі балансі стали нулями
function settle(b){ const pos=[],neg=[]; for(const k in b){ const v=Math.round(b[k]*100)/100; if(v>0.5) pos.push([k,v]); else if(v<-0.5) neg.push([k,-v]) }
  pos.sort((a,c)=>c[1]-a[1]); neg.sort((a,c)=>c[1]-a[1]); const out=[]; let i=0,j=0;
  while(i<pos.length&&j<neg.length){ const t=Math.min(pos[i][1],neg[j][1]); out.push({from:pos[i][0],to:neg[j][0],amount:Math.round(t*100)/100}); pos[i][1]-=t; neg[j][1]-=t; if(pos[i][1]<0.5)i++; if(neg[j][1]<0.5)j++ }
  return out }

    ${bases.map(([k,label,b])=>{ const ids=Object.keys(b), tot=ids.reduce((a,id)=>a+b[id],0);

const UA_MON=["Січня","Лютого","Березня","Квітня","Травня","Червня","Липня","Серпня","Вересня","Жовтня","Листопада","Грудня"];
const dLong=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return `${d} ${UA_MON[+m-1]} ${y} р.`};
const dShort=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return `${d}.${m}.${y.slice(2)}`};
const n2=n=>(Math.round((+n||0)*100)/100).toFixed(2);
const nApo=n=>{const[a,b]=n2(n).split(".");return a.replace(/\B(?=(\d{3})+(?!\d))/g,"'")+"."+b};
function uaWords(num){
  const ones=[["","один","два","три","чотири","п'ять","шість","сім","вісім","дев'ять"],["","одна","дві","три","чотири","п'ять","шість","сім","вісім","дев'ять"]];
  const teens=["десять","одинадцять","дванадцять","тринадцять","чотирнадцять","п'ятнадцять","шістнадцять","сімнадцять","вісімнадцять","дев'ятнадцять"];
  const tens=["","","двадцять","тридцять","сорок","п'ятдесят","шістдесят","сімдесят","вісімдесят","дев'яносто"];
  const hund=["","сто","двісті","триста","чотириста","п'ятсот","шістсот","сімсот","вісімсот","дев'ятсот"];
  const form=(n,f)=>{n%=100;if(n>10&&n<20)return f[2];n%=10;return n===1?f[0]:(n>=2&&n<=4?f[1]:f[2])};
  const tri=(n,fem)=>{const w=[];w.push(hund[Math.floor(n/100)]);const t=n%100;if(t>=10&&t<20)w.push(teens[t-10]);else{w.push(tens[Math.floor(t/10)]);w.push(ones[fem?1:0][t%10])}return w.filter(Boolean).join(" ")};
  const groups=[[1e9,0,["мільярд","мільярди","мільярдів"]],[1e6,0,["мільйон","мільйони","мільйонів"]],[1e3,1,["тисяча","тисячі","тисяч"]]];
  let n=Math.floor(num),out=[];
  for(const[d,fem,f]of groups){const g=Math.floor(n/d);if(g){out.push(tri(g,fem)+" "+form(g,f));n%=d}}
  if(n||!out.length)out.push(n?tri(n,1):"нуль");
  const kop=Math.round((num-Math.floor(num))*100);
  const s=out.join(" ")+" "+form(Math.floor(num),["гривня","гривні","гривень"])+" "+String(kop).padStart(2,"0")+" "+form(kop,["копійка","копійки","копійок"]);
  return s.charAt(0).toUpperCase()+s.slice(1);
}
